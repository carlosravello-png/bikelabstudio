    <rect x="70" y="146" width="260" height="80" fill="#0a0a0a"></rect>
    <ellipse cx="200" cy="120" rx="16" ry="6" fill="#4fb8c8" fill-opacity="0.5" stroke="#4fb8c8" stroke-width="1.2"></ellipse>
    <g stroke="#4fb8c8" stroke-width="1.2" fill="none" opacity="0.7">
      <path d="M176 104 q24 -14 48 0"></path>
      <path d="M182 98 q18 -10 36 0"></path>
    </g>
    <text x="240" y="100" fill="#4fb8c8" font-size="10">externa</text>
    <g fill="#4fb8c8" fill-opacity="0.45">
      <circle cx="110" cy="170" r="3"></circle><circle cx="150" cy="186" r="3"></circle><circle cx="195" cy="172" r="3"></circle>
      <circle cx="240" cy="190" r="3"></circle><circle cx="285" cy="174" r="3"></circle><circle cx="130" cy="205" r="3"></circle>
