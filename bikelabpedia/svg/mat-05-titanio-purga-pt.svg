      <text x="460" y="133" fill="#4fb8c8" font-size="9.5">correto</text>
      <rect x="410" y="146" width="40" height="26" rx="3" fill="#c8a23a"></rect>
      <text x="460" y="163" fill="#9c9c9c" font-size="10">dourado · leve oxidação</text>
      <rect x="410" y="184" width="40" height="26" rx="3" fill="#3a6ea5"></rect>
      <text x="460" y="201" fill="#9c9c9c" font-size="10">azul · oxidação média</text>
