    <text x="200" y="276" fill="#8f8f8f" font-size="10" text-anchor="middle">argônio dentro e fora do tubo</text>
    <text x="200" y="296" fill="#5a5a5a" font-size="9.5" text-anchor="middle">desloca o oxigênio por completo</text>

    <text x="410" y="92" fill="#8f8f8f" font-size="12">COR DO CORDÃO</text>
    <g>
      <rect x="410" y="108" width="40" height="26" rx="3" fill="#c8c8cc"></rect>
