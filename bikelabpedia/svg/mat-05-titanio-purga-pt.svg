    <line x1="398" y1="108" x2="398" y2="248" stroke="#5a5a5a" stroke-width="1"></line>
    <text x="392" y="180" fill="#5a5a5a" font-size="9" text-anchor="end" transform="rotate(-90 392 180)">+ oxigênio</text>

    <text x="380" y="332" fill="#5fbecb" font-size="12" text-anchor="middle">o titânio absorve oxigênio quente e fica frágil: a purga é obrigatória</text>
    <text x="380" y="356" fill="#5a5a5a" font-size="10.5" text-anchor="middle">a cor do cordão é o controle de qualidade a olho nu</text>
