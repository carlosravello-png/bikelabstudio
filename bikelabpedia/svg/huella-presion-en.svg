<text x="40" y="52" font-family="&#39;Inter&#39;, sans-serif" font-size="24" font-weight="800" fill="#e0e0e0">Contact patch vs. pressure</text>

    <ellipse cx="180" cy="260" rx="70" ry="110" fill="#4fb8c8" fill-opacity="0.3" stroke="#4fb8c8" stroke-width="2"></ellipse>
    <text x="180" y="410" font-family="&#39;IBM Plex Mono&#39;, monospace" font-size="16" font-weight="700" fill="#e0e0e0" text-anchor="middle">Low</text>
    

    <ellipse cx="400" cy="260" rx="55" ry="78" fill="#4fb8c8" fill-opacity="0.3" stroke="#4fb8c8" stroke-width="2"></ellipse>
    <text x="400" y="378" font-family="&#39;IBM Plex Mono&#39;, monospace" font-size="16" font-weight="700" fill="#e0e0e0" text-anchor="middle">Medium</text>
    

    <ellipse cx="620" cy="260" rx="42" ry="55" fill="#4fb8c8" fill-opacity="0.3" stroke="#4fb8c8" stroke-width="2"></ellipse>
    <text x="620" y="355" font-family="&#39;IBM Plex Mono&#39;, monospace" font-size="16" font-weight="700" fill="#e0e0e0" text-anchor="middle">High</text>
    
<text x="400" y="460" font-family="&#39;IBM Plex Mono&#39;, monospace" font-size="13" font-weight="400" fill="#9a9a9a" text-anchor="middle">Lower = larger patch = more grip (with a limit)</text>

