<title id="t">Contact patch vs. pressure</title>
<desc id="d">Top view of the contact patch at three relative pressures: low (large patch), medium and high (small patch); lower pressure means a larger patch and more grip, up to a limit. — © Carlos Eduardo Ravello Joo · BikeLab Studio · CC BY 4.0 · bikelabstudio.com</desc>
