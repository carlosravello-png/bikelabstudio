  <title>HSC vs LSC: velocidade da haste — BikeLab Studio</title>
  <desc>O eixo da compressão é a velocidade da haste, não a da bike: LSC para frenagens, apoios e bombeio; HSC para raízes, pedras e impactos secos. © Carlos Eduardo Ravello Joo · carlosravello.com</desc>
