<?xml version="1.0"?>
<svg viewBox="0 0 760 400" xmlns="http://www.w3.org/2000/svg" xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <title>TIG vs MIG vs Brazing — BikeLab Studio</title>
  <desc>Três formas de unir tubos: TIG (eletrodo de tungstênio, funde o metal base), MIG (arame contínuo, funde o metal base) e brazing (o material de adição flui por capilaridade, une sem fundir). © Carlos Eduardo Ravello Joo · carlosravello.com</desc>
  <metadata><RDF xmlns:dc="http://purl.org/dc/elements/1.1/"><Description><creator>Carlos Eduardo Ravello Joo</creator><rights>© 2026 Carlos Eduardo Ravello Joo. Todos os direitos reservados.</rights><publisher>BikeLab Studio</publisher><source>https://carlosravello.com</source><identifier>https://orcid.org/0009-0007-5631-7436</identifier></Description></RDF></metadata>
  <g font-family="&#39;IBM Plex Mono&#39;, ui-monospace, monospace">
    <rect x="0" y="0" width="760" height="400" rx="14" fill="#080808"></rect>
    <rect x="1" y="1" width="758" height="398" rx="14" fill="none" stroke="#242424" stroke-width="1.5"></rect>
    <text x="40" y="34" fill="#4fb8c8" font-size="11" letter-spacing="2.5">TIG vs MIG vs BRAZING</text>
    <text x="40" y="50" fill="#5a5a5a" font-size="11">BikeLab-pedia // mat-03 · três formas de unir tubos</text>

    <rect x="40" y="74" width="220" height="278" rx="8" fill="#0c0c0c" stroke="#3a3a3a" stroke-width="1.3"></rect>
    <text x="150" y="100" fill="#ECECEC" font-size="13" font-weight="bold" text-anchor="middle">TIG (GTAW)</text>
    <rect x="64" y="170" width="84" height="40" fill="#1a1a1a" stroke="#5a5a5a" stroke-width="1.2"></rect>
    <rect x="152" y="170" width="84" height="40" fill="#1a1a1a" stroke="#5a5a5a" stroke-width="1.2"></rect>
    <ellipse cx="150" cy="170" rx="14" ry="6" fill="#4fb8c8" fill-opacity="0.5" stroke="#4fb8c8" stroke-width="1.2"></ellipse>
    <line x1="150" y1="128" x2="150" y2="162" stroke="#9c9c9c" stroke-width="3"></line>
    <text x="150" y="124" fill="#8f8f8f" font-size="9" text-anchor="middle">tungstênio</text>
    <line x1="186" y1="140" x2="158" y2="166" stroke="#4fb8c8" stroke-width="2"></line>
    <text x="150" y="240" fill="#4fb8c8" font-size="10.5" text-anchor="middle">+ vareta de adição</text>
    <text x="150" y="280" fill="#f0a0a0" font-size="11" font-weight="bold" text-anchor="middle">funde o metal base</text>
    <text x="150" y="300" fill="#8f8f8f" font-size="10" text-anchor="middle">&gt;1450 °C no aço</text>
    <text x="150" y="330" fill="#5a5a5a" font-size="9.5" text-anchor="middle">controle fino · padrão bike</text>

    <rect x="270" y="74" width="220" height="278" rx="8" fill="#0c0c0c" stroke="#3a3a3a" stroke-width="1.3"></rect>
    <text x="380" y="100" fill="#ECECEC" font-size="13" font-weight="bold" text-anchor="middle">MIG (GMAW)</text>
    <rect x="294" y="170" width="84" height="40" fill="#1a1a1a" stroke="#5a5a5a" stroke-width="1.2"></rect>
    <rect x="382" y="170" width="84" height="40" fill="#1a1a1a" stroke="#5a5a5a" stroke-width="1.2"></rect>
    <ellipse cx="380" cy="170" rx="14" ry="6" fill="#4fb8c8" fill-opacity="0.5" stroke="#4fb8c8" stroke-width="1.2"></ellipse>
    <line x1="380" y1="124" x2="380" y2="164" stroke="#4fb8c8" stroke-width="2.4" stroke-dasharray="3 2"></line>
    <text x="380" y="120" fill="#8f8f8f" font-size="9" text-anchor="middle">arame contínuo</text>
    <text x="380" y="240" fill="#8f8f8f" font-size="10.5" text-anchor="middle">alimentação automática</text>
    <text x="380" y="280" fill="#f0a0a0" font-size="11" font-weight="bold" text-anchor="middle">funde o metal base</text>
    <text x="380" y="300" fill="#8f8f8f" font-size="10" text-anchor="middle">rápido · mais cordão</text>
    <text x="380" y="330" fill="#5a5a5a" font-size="9.5" text-anchor="middle">produção · gama média</text>

    <rect x="500" y="74" width="220" height="278" rx="8" fill="#0c0c0c" stroke="#3a3a3a" stroke-width="1.3"></rect>
    <text x="610" y="100" fill="#ECECEC" font-size="13" font-weight="bold" text-anchor="middle">Brazing</text>
    <rect x="524" y="170" width="84" height="40" fill="#1a1a1a" stroke="#5a5a5a" stroke-width="1.2"></rect>
    <rect x="612" y="170" width="84" height="40" fill="#1a1a1a" stroke="#5a5a5a" stroke-width="1.2"></rect>
    <rect x="606" y="170" width="8" height="40" fill="#c89a4a" fill-opacity="0.7"></rect>
    <path d="M606 178 q-8 0 -8 6 M614 178 q8 0 8 6" fill="none" stroke="#c89a4a" stroke-width="1.4"></path>
    <text x="610" y="240" fill="#c89a4a" font-size="10.5" text-anchor="middle">flui por capilaridade</text>
    <text x="610" y="280" fill="#5fbecb" font-size="11" font-weight="bold" text-anchor="middle">une sem fundir</text>
    <text x="610" y="300" fill="#8f8f8f" font-size="10" text-anchor="middle">menor temperatura</text>
    <text x="610" y="330" fill="#5a5a5a" font-size="9.5" text-anchor="middle">poupa a ZAC do tubo</text>

    <text x="380" y="378" fill="#5fbecb" font-size="12" text-anchor="middle">fundir (TIG/MIG) ou não fundir (brazing): essa é a fronteira</text>
    <text x="724" y="394" fill="#2f2f2f" font-size="8.5" text-anchor="end">© C.E. Ravello Joo · carlosravello.com</text>
  </g>
</svg>