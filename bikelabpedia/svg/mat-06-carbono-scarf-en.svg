<?xml version="1.0"?>
<svg viewBox="0 0 760 400" xmlns="http://www.w3.org/2000/svg" xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <title>Carbon/CFRP: scarf re-lamination repair — BikeLab Studio</title>
  <desc>Four-step sequence of carbon scarf re-lamination: damage, stepped taper, new prepreg plies and vacuum cure with heat. © Carlos Eduardo Ravello Joo · carlosravello.com</desc>
  <metadata><RDF xmlns:dc="http://purl.org/dc/elements/1.1/"><Description><creator>Carlos Eduardo Ravello Joo</creator><rights>© 2026 Carlos Eduardo Ravello Joo. All rights reserved.</rights><publisher>BikeLab Studio</publisher><source>https://carlosravello.com</source><identifier>https://orcid.org/0009-0007-5631-7436</identifier></Description></RDF></metadata>
  <g font-family="&#39;IBM Plex Mono&#39;, ui-monospace, monospace">
    <rect x="0" y="0" width="760" height="400" rx="14" fill="#080808"></rect>
    <rect x="1" y="1" width="758" height="398" rx="14" fill="none" stroke="#242424" stroke-width="1.5"></rect>
    <text x="40" y="34" fill="#4fb8c8" font-size="11" letter-spacing="2.5">CARBON / CFRP · RE-LAMINATION</text>
    <text x="40" y="50" fill="#5a5a5a" font-size="11">BikeLab-pedia // mat-06 · scarf repair, not welded</text>

    <rect x="40" y="68" width="680" height="30" rx="6" fill="#1a1410" stroke="#c87a4a" stroke-width="1.2"></rect>
    <text x="380" y="88" fill="#f0a86a" font-size="13" font-weight="bold" text-anchor="middle">thermoset → NOT welded</text>

    <rect x="40" y="116" width="160" height="170" rx="8" fill="#0c0c0c" stroke="#3a3a3a" stroke-width="1.3"></rect>
    <text x="56" y="138" fill="#4fb8c8" font-size="13" font-weight="bold">1</text>
    <text x="120" y="138" fill="#8f8f8f" font-size="10.5" text-anchor="middle">damage / crack</text>
    <rect x="64" y="196" width="112" height="30" fill="#1a1a1a" stroke="#5a5a5a" stroke-width="1.2"></rect>
    <path d="M112 196 l-6 30 M120 196 l4 30" stroke="#f0a0a0" stroke-width="1.4"></path>
    <text x="120" y="262" fill="#5a5a5a" font-size="9.5" text-anchor="middle">broken laminate</text>

    <rect x="216" y="116" width="160" height="170" rx="8" fill="#0c0c0c" stroke="#3a3a3a" stroke-width="1.3"></rect>
    <text x="232" y="138" fill="#4fb8c8" font-size="13" font-weight="bold">2</text>
    <text x="296" y="138" fill="#8f8f8f" font-size="10.5" text-anchor="middle">scarf taper</text>
    <path d="M240 226 L264 226 L272 214 L288 214 L296 202 L312 202 L320 190 L352 190 L352 226 Z" fill="#1a1a1a" stroke="#9c9c9c" stroke-width="1.2"></path>
    <text x="296" y="262" fill="#5a5a5a" font-size="9.5" text-anchor="middle">stepped cone</text>

    <rect x="392" y="116" width="160" height="170" rx="8" fill="#0c0c0c" stroke="#3a3a3a" stroke-width="1.3"></rect>
    <text x="408" y="138" fill="#4fb8c8" font-size="13" font-weight="bold">3</text>
    <text x="472" y="138" fill="#8f8f8f" font-size="10.5" text-anchor="middle">new plies</text>
    <g stroke="#4fb8c8" stroke-width="1.4" opacity="0.8">
      <line x1="416" y1="206" x2="528" y2="206"></line><line x1="424" y1="198" x2="520" y2="198"></line>
      <line x1="432" y1="190" x2="512" y2="190"></line><line x1="440" y1="182" x2="504" y2="182"></line>
    </g>
    <text x="472" y="234" fill="#4fb8c8" font-size="10" text-anchor="middle">prepreg fibre</text>
    <text x="472" y="262" fill="#5a5a5a" font-size="9.5" text-anchor="middle">orientation per ply</text>

    <rect x="568" y="116" width="152" height="170" rx="8" fill="#0c0c0c" stroke="#3a3a3a" stroke-width="1.3"></rect>
    <text x="584" y="138" fill="#4fb8c8" font-size="13" font-weight="bold">4</text>
    <text x="644" y="138" fill="#8f8f8f" font-size="10.5" text-anchor="middle">vacuum cure</text>
    <rect x="592" y="190" width="104" height="30" rx="3" fill="#16343a" stroke="#4fb8c8" stroke-width="1.2"></rect>
    <g stroke="#9c9c9c" stroke-width="1.2"><line x1="612" y1="178" x2="612" y2="188"></line><line x1="644" y1="178" x2="644" y2="188"></line><line x1="676" y1="178" x2="676" y2="188"></line></g>
    <text x="644" y="240" fill="#4fb8c8" font-size="11" text-anchor="middle">~120 °C</text>
    <text x="644" y="262" fill="#5a5a5a" font-size="9.5" text-anchor="middle">vacuum + heat</text>

    <text x="380" y="332" fill="#5fbecb" font-size="12" text-anchor="middle">carbon doesn&#39;t melt: it&#39;s rebuilt by laminating new fibre over a taper</text>
    <text x="380" y="356" fill="#5a5a5a" font-size="10.5" text-anchor="middle">recovers 70–100% of design strength when done right</text>
    <text x="724" y="394" fill="#2f2f2f" font-size="8.5" text-anchor="end">© C.E. Ravello Joo · carlosravello.com</text>
  </g>
</svg>