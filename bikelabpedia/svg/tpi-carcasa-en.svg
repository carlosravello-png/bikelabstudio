<title id="t">Casing TPI</title>
<desc id="d">Zoom on the casing weave: low TPI with few thick threads (rigid, protection) versus high TPI with many fine threads (flexible, supple), without inventing a TPI number. — © Carlos Eduardo Ravello Joo · BikeLab Studio · CC BY 4.0 · bikelabstudio.com</desc>
