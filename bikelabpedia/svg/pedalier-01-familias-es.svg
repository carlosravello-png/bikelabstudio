  <g font-family="&#39;IBM Plex Mono&#39;, ui-monospace, monospace">
    <rect x="0" y="0" width="760" height="400" rx="14" fill="#080808"></rect>
    <rect x="1" y="1" width="758" height="398" rx="14" fill="none" stroke="#242424" stroke-width="1.5"></rect>
    <text x="40" y="34" fill="#4fb8c8" font-size="11" letter-spacing="2.5">LAS DOS FAMILIAS</text>
    <text x="40" y="50" fill="#5a5a5a" font-size="11">BikeLab-pedia // pedalier-01</text>

    
    <rect x="110" y="62" width="180" height="180" rx="8" fill="none" stroke="#3a3a3a" stroke-width="1.5"></rect>
    <circle cx="200" cy="152" r="66" fill="none" stroke="#e6e6e6" stroke-width="2"></circle>
    <circle cx="200" cy="152" r="60" fill="none" stroke="#4fb8c8" stroke-width="2.2" stroke-dasharray="2 6"></circle>
    <circle cx="200" cy="152" r="50" fill="none" stroke="#7a7a7a" stroke-width="1.6"></circle>
    <circle cx="200" cy="152" r="30" fill="#151515" stroke="#5f5f5f" stroke-width="1.4"></circle>
    <text x="200" y="262" fill="#4fb8c8" font-size="13" text-anchor="middle">rosca visible</text>
    <text x="200" y="312" fill="#f0f0f0" font-size="17" text-anchor="middle">Roscado</text>
    <text x="200" y="334" fill="#8f8f8f" font-size="11.5" text-anchor="middle">se enrosca al cuadro</text>

    
    <rect x="470" y="62" width="180" height="180" rx="8" fill="none" stroke="#3a3a3a" stroke-width="1.5"></rect>
    <circle cx="560" cy="152" r="66" fill="none" stroke="#e6e6e6" stroke-width="2"></circle>
    <circle cx="560" cy="152" r="50" fill="none" stroke="#7a7a7a" stroke-width="1.6"></circle>
    <circle cx="560" cy="152" r="30" fill="#151515" stroke="#5f5f5f" stroke-width="1.4"></circle>
    <text x="560" y="262" fill="#8f8f8f" font-size="13" text-anchor="middle">interior liso</text>
    <text x="560" y="312" fill="#f0f0f0" font-size="17" text-anchor="middle">A presión</text>
    <text x="560" y="334" fill="#8f8f8f" font-size="11.5" text-anchor="middle">entra sin rosca</text>

    <text x="380" y="378" fill="#5fbecb" font-size="12" text-anchor="middle">la rosca se ve a simple vista · el liso no la tiene</text>
