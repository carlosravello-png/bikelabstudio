<svg viewBox="0 0 760 400" xmlns="http://www.w3.org/2000/svg" xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <title>Las dos familias de pedalier — BikeLab Studio</title>
  <desc>Comparativa de caja roscada (con hilos) frente a press-fit (interior liso). © Carlos Eduardo Ravello Joo · carlosravello.com</desc>
