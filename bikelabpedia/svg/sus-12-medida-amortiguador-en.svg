    <text x="416" y="320" fill="#9a9a9a" font-size="10.5">eye-to-eye × stroke, in mm</text>
    <text x="416" y="340" fill="#5a5a5a" font-size="9.5">older frames · do NOT mix</text>

    <text x="380" y="392" fill="#4fb8c8" font-size="12" text-anchor="middle">beyond size, check the mount: eyelet vs trunnion (see sus-02)</text>
