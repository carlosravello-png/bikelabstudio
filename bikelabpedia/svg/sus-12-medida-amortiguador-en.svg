<?xml version="1.0"?>
<svg viewBox="0 0 760 430" xmlns="http://www.w3.org/2000/svg" xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <title>Shock sizing — BikeLab Studio</title>
  <desc>How a shock is measured: eye-to-eye and stroke, metric (210×55) and imperial (200×57) systems, and eyelet versus trunnion mount. © Carlos Eduardo Ravello Joo · carlosravello.com</desc>
  <metadata><RDF xmlns:dc="http://purl.org/dc/elements/1.1/"><Description><creator>Carlos Eduardo Ravello Joo</creator><rights>© 2026 Carlos Eduardo Ravello Joo. All rights reserved.</rights><publisher>BikeLab Studio</publisher><source>https://carlosravello.com</source><identifier>https://orcid.org/0009-0007-5631-7436</identifier></Description></RDF></metadata>
  <g font-family="&#39;IBM Plex Mono&#39;, ui-monospace, monospace">
    <rect x="0" y="0" width="760" height="430" rx="14" fill="#050505"></rect>
    <rect x="1" y="1" width="758" height="428" rx="14" fill="none" stroke="#242424" stroke-width="1.5"></rect>
    <text x="40" y="36" fill="#4fb8c8" font-size="11" letter-spacing="2.5">SHOCK SIZING</text>
    <text x="40" y="54" fill="#9a9a9a" font-size="11">BikeLab-pedia // sus-12 · eye-to-eye × stroke</text>

    <circle cx="120" cy="150" r="18" fill="none" stroke="#9a9a9a" stroke-width="2.4"></circle>
    <circle cx="120" cy="150" r="7" fill="#050505" stroke="#9a9a9a" stroke-width="1.4"></circle>
    <rect x="146" y="132" width="170" height="36" rx="10" fill="#4fb8c8" fill-opacity="0.14" stroke="#4fb8c8" stroke-width="1.4"></rect>
    <rect x="316" y="143" width="170" height="14" fill="#d9a44a" fill-opacity="0.18" stroke="#d9a44a" stroke-width="1.4"></rect>
    <circle cx="512" cy="150" r="18" fill="none" stroke="#9a9a9a" stroke-width="2.4"></circle>
    <circle cx="512" cy="150" r="7" fill="#050505" stroke="#9a9a9a" stroke-width="1.4"></circle>

    <line x1="120" y1="200" x2="512" y2="200" stroke="#ffffff" stroke-width="1"></line>
    <line x1="120" y1="194" x2="120" y2="206" stroke="#ffffff"></line><line x1="512" y1="194" x2="512" y2="206" stroke="#ffffff"></line>
    <text x="316" y="220" fill="#ffffff" font-size="12" text-anchor="middle">eye-to-eye (overall length)</text>
    <line x1="316" y1="112" x2="446" y2="112" stroke="#4fb8c8" stroke-width="1"></line>
    <line x1="316" y1="106" x2="316" y2="118" stroke="#4fb8c8"></line><line x1="446" y1="106" x2="446" y2="118" stroke="#4fb8c8"></line>
    <text x="381" y="100" fill="#4fb8c8" font-size="12" text-anchor="middle">stroke (travel)</text>

    <rect x="60" y="246" width="320" height="110" rx="8" fill="#0c0c0c" stroke="#4fb8c8" stroke-width="1.3"></rect>
    <text x="80" y="270" fill="#4fb8c8" font-size="12" font-weight="bold">METRIC</text>
    <text x="80" y="298" fill="#ffffff" font-size="20" font-weight="bold">210 × 55</text>
    <text x="80" y="320" fill="#9a9a9a" font-size="10.5">eye-to-eye × stroke, in mm</text>
    <text x="80" y="340" fill="#5a5a5a" font-size="9.5">current standard (Metric / Trunnion)</text>

    <rect x="396" y="246" width="304" height="110" rx="8" fill="#0c0c0c" stroke="#9a9a9a" stroke-width="1.3"></rect>
    <text x="416" y="270" fill="#9a9a9a" font-size="12" font-weight="bold">IMPERIAL</text>
