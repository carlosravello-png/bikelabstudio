<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" role="img" aria-label="Os quatro tipos de curva de leverage ratio: linear, progressivo, regressivo e misto, mostrando como muda a relação de alavanca ao longo do curso">
  <metadata><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#"><cc:Work rdf:about=""><dc:title>Tipos de curva de leverage ratio (linear, progressivo, regressivo, misto) — BikeLab Studio</dc:title><dc:creator><cc:Agent><dc:title>Carlos Eduardo Ravello Joo · ORCID 0009-0007-5631-7436</dc:title></cc:Agent></dc:creator><dc:publisher>BikeLab Studio — bikelabstudio.com</dc:publisher><dc:source>https://www.bikelabstudio.com/bikelabpedia/como-funciona-suspensao-mtb-explicado-facil-pt.html</dc:source><dc:rights>© 2026 BikeLab Studio · Carlos Eduardo Ravello Joo. Licencia CC BY-NC-ND 4.0.</dc:rights><dc:identifier>https://orcid.org/0009-0007-5631-7436</dc:identifier><cc:license rdf:resource="https://creativecommons.org/licenses/by-nc-nd/4.0/"/></cc:Work></rdf:RDF></metadata>
  <style>
    .ti{font-family:'IBM Plex Mono',monospace;fill:#4fb8c8;font-size:14px;font-weight:700}
    .ax{stroke:#333;stroke-width:1}
    .cv{stroke:#4fb8c8;stroke-width:2.5;fill:none}
    .lb{font-family:'IBM Plex Mono',monospace;fill:#777;font-size:10px}
    .ds{font-family:'IBM Plex Mono',monospace;fill:#9a9a9a;font-size:11px}
  </style>
  <!-- panel 1: linear -->
  <g transform="translate(40,40)">
    <text x="150" y="0" text-anchor="middle" class="ti">LINEAR</text>
    <line x1="20" y1="20" x2="20" y2="120" class="ax"/><line x1="20" y1="120" x2="280" y2="120" class="ax"/>
    <text x="-2" y="22" text-anchor="end" class="lb">LR</text><text x="278" y="138" text-anchor="end" class="lb">curso</text>
    <path class="cv" d="M20,60 L280,64"/>
    <text x="150" y="160" text-anchor="middle" class="ds">LR quase constante</text>
  </g>
  <!-- panel 2: progressivo -->
  <g transform="translate(400,40)">
    <text x="150" y="0" text-anchor="middle" class="ti">PROGRESSIVO</text>
    <line x1="20" y1="20" x2="20" y2="120" class="ax"/><line x1="20" y1="120" x2="280" y2="120" class="ax"/>
    <text x="-2" y="22" text-anchor="end" class="lb">LR</text><text x="278" y="138" text-anchor="end" class="lb">curso</text>
    <path class="cv" d="M20,38 C120,55 200,95 280,108"/>
    <text x="150" y="160" text-anchor="middle" class="ds">LR cai → endurece no final</text>
  </g>
  <!-- panel 3: regressivo -->
  <g transform="translate(40,250)">
    <text x="150" y="0" text-anchor="middle" class="ti">REGRESSIVO</text>
    <line x1="20" y1="20" x2="20" y2="120" class="ax"/><line x1="20" y1="120" x2="280" y2="120" class="ax"/>
    <text x="-2" y="22" text-anchor="end" class="lb">LR</text><text x="278" y="138" text-anchor="end" class="lb">curso</text>
    <path class="cv" d="M20,108 C120,95 200,55 280,38"/>
    <text x="150" y="160" text-anchor="middle" class="ds">LR sobe → amolece no final</text>
  </g>
  <!-- panel 4: misto -->
  <g transform="translate(400,250)">
    <text x="150" y="0" text-anchor="middle" class="ti">MISTO (progressivo-regressivo)</text>
    <line x1="20" y1="20" x2="20" y2="120" class="ax"/><line x1="20" y1="120" x2="280" y2="120" class="ax"/>
    <text x="-2" y="22" text-anchor="end" class="lb">LR</text><text x="278" y="138" text-anchor="end" class="lb">curso</text>
    <path class="cv" d="M20,50 C90,100 150,100 170,92 C220,78 250,55 280,52"/>
    <text x="150" y="160" text-anchor="middle" class="ds">suporte médio, suaviza o final</text>
  </g>
  <text x="752" y="425" text-anchor="end" font-family="'IBM Plex Mono',monospace" font-size="10" fill="#333">bikelabstudio.com · C.E. Ravello Joo · CC BY-NC-ND 4.0</text>
</svg>
