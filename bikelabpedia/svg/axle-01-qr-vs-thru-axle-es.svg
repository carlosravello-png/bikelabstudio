<svg viewBox="0 0 760 400" xmlns="http://www.w3.org/2000/svg" xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <title>Cierre rápido vs eje pasante — BikeLab Studio</title>
  <desc>Comparativa del cierre rápido (varilla de 5 mm con leva en dropout abierto en U) frente al eje pasante (Ø12 mm roscado al cuadro, dropout cerrado en O). © Carlos Eduardo Ravello Joo · carlosravello.com</desc>
  <metadata><RDF xmlns:dc="http://purl.org/dc/elements/1.1/"><Description><creator>Carlos Eduardo Ravello Joo</creator><rights>© 2026 Carlos Eduardo Ravello Joo. Todos los derechos reservados.</rights><publisher>BikeLab Studio</publisher><source>https://carlosravello.com</source></Description></RDF></metadata>
  <g font-family="&#39;IBM Plex Mono&#39;, ui-monospace, monospace">
    <rect x="0" y="0" width="760" height="400" rx="14" fill="#080808"></rect>
    <rect x="1" y="1" width="758" height="398" rx="14" fill="none" stroke="#242424" stroke-width="1.5"></rect>
    <text x="40" y="34" fill="#4fb8c8" font-size="11" letter-spacing="2.5">CIERRE RÁPIDO vs EJE PASANTE</text>
    <text x="40" y="50" fill="#5a5a5a" font-size="11">BikeLab-pedia // axle-01</text>

    
    <line x1="380" y1="76" x2="380" y2="300" stroke="#2c2c2c" stroke-width="1"></line>

    
    <text x="200" y="96" fill="#8f8f8f" font-size="12" text-anchor="middle">CIERRE RÁPIDO (QR)</text>
    
    <path d="M150 120 v70 h22 v-44 h56 v44 h22 v-70" fill="none" stroke="#7a7a7a" stroke-width="2"></path>
    
    <path d="M172 190 v20 M250 190 v20" stroke="#5a5a5a" stroke-width="2" stroke-dasharray="3 3"></path>
    <text x="211" y="226" fill="#8f8f8f" font-size="10.5" text-anchor="middle">dropout ABIERTO (U)</text>
    
    <line x1="120" y1="168" x2="300" y2="168" stroke="#9c9c9c" stroke-width="3"></line>
    <circle cx="211" cy="168" r="14" fill="#151515" stroke="#7a7a7a" stroke-width="1.4"></circle>
    
    <circle cx="116" cy="168" r="6" fill="#101010" stroke="#9c9c9c" stroke-width="1.6"></circle>
    <path d="M116 168 l-22 -12 q-8 -4 -8 5 l0 14 q0 9 8 5 Z" fill="#101010" stroke="#9c9c9c" stroke-width="1.4"></path>
    <line x1="290" y1="168" x2="306" y2="168" stroke="#9c9c9c" stroke-width="5"></line>
    
    <line x1="120" y1="250" x2="300" y2="250" stroke="#5a5a5a" stroke-width="1"></line>
    <line x1="120" y1="244" x2="120" y2="256" stroke="#5a5a5a"></line><line x1="300" y1="244" x2="300" y2="256" stroke="#5a5a5a"></line>
    <text x="211" y="268" fill="#8f8f8f" font-size="12" text-anchor="middle">varilla 5 mm + leva</text>
    <text x="211" y="290" fill="#5a5a5a" font-size="11" text-anchor="middle">extremos 9 mm (del.) / 10 mm (tras.)</text>

    
    <text x="560" y="96" fill="#8f8f8f" font-size="12" text-anchor="middle">EJE PASANTE (THRU-AXLE)</text>
    
    <rect x="500" y="120" width="120" height="92" rx="10" fill="#101010" stroke="#7a7a7a" stroke-width="2"></rect>
    <circle cx="560" cy="168" r="22" fill="#080808" stroke="#9c9c9c" stroke-width="1.6"></circle>
    
    <g stroke="#4fb8c8" stroke-width="1.2">
      <path d="M582 156 h14 M582 162 h14 M582 168 h14 M582 174 h14 M582 180 h14"></path>
    </g>
    <text x="560" y="226" fill="#8f8f8f" font-size="10.5" text-anchor="middle">dropout CERRADO (O)</text>
    
    <line x1="470" y1="168" x2="650" y2="168" stroke="#9c9c9c" stroke-width="6"></line>
    <circle cx="466" cy="168" r="7" fill="#101010" stroke="#9c9c9c" stroke-width="1.6"></circle>
    
    <line x1="470" y1="250" x2="650" y2="250" stroke="#5a5a5a" stroke-width="1"></line>
    <line x1="470" y1="244" x2="470" y2="256" stroke="#5a5a5a"></line><line x1="650" y1="244" x2="650" y2="256" stroke="#5a5a5a"></line>
    <text x="560" y="268" fill="#4fb8c8" font-size="12.5" text-anchor="middle">Ø12 mm roscado al cuadro</text>
    <text x="560" y="290" fill="#5a5a5a" font-size="11" text-anchor="middle">par 9–15 N·m · 15 mm en MTB delantero</text>

    <text x="380" y="378" fill="#5fbecb" font-size="12" text-anchor="middle">el eje pasante cierra el dropout y se rosca al cuadro · más rígido y seguro</text>
