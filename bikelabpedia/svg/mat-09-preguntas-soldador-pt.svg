  <g font-family="&#39;IBM Plex Mono&#39;, ui-monospace, monospace">
    <rect x="0" y="0" width="760" height="400" rx="14" fill="#080808"></rect>
    <rect x="1" y="1" width="758" height="398" rx="14" fill="none" stroke="#242424" stroke-width="1.5"></rect>
    <text x="40" y="34" fill="#4fb8c8" font-size="11" letter-spacing="2.5">O QUE PERGUNTAR AO SOLDADOR</text>
    <text x="40" y="50" fill="#5a5a5a" font-size="11">BikeLab-pedia // mat-09 · quatro perguntas-chave</text>

    <rect x="40" y="80" width="338" height="120" rx="8" fill="#0c0c0c" stroke="#3a3a3a" stroke-width="1.3"></rect>
    <circle cx="78" cy="120" r="18" fill="none" stroke="#4fb8c8" stroke-width="1.6"></circle>
    <text x="78" y="126" fill="#4fb8c8" font-size="16" text-anchor="middle">?</text>
    <text x="112" y="116" fill="#ECECEC" font-size="13" font-weight="bold">Qual técnica?</text>
    <text x="112" y="140" fill="#8f8f8f" font-size="11">TIG ou brazing — define a união</text>
    <text x="112" y="168" fill="#5a5a5a" font-size="10">funde o tubo ou une sem fundir</text>

    <rect x="382" y="80" width="338" height="120" rx="8" fill="#0c0c0c" stroke="#3a3a3a" stroke-width="1.3"></rect>
    <circle cx="420" cy="120" r="18" fill="none" stroke="#4fb8c8" stroke-width="1.6"></circle>
    <text x="420" y="126" fill="#4fb8c8" font-size="16" text-anchor="middle">?</text>
    <text x="454" y="116" fill="#ECECEC" font-size="13" font-weight="bold">Qual adição?</text>
    <text x="454" y="140" fill="#8f8f8f" font-size="11">alumínio: 4043 / 5356 · Ti: ER Ti</text>
    <text x="454" y="168" fill="#5a5a5a" font-size="10">resistência e acabamento dependem dela</text>

    <rect x="40" y="212" width="338" height="120" rx="8" fill="#0c0c0c" stroke="#3a3a3a" stroke-width="1.3"></rect>
    <circle cx="78" cy="252" r="18" fill="none" stroke="#4fb8c8" stroke-width="1.6"></circle>
    <text x="78" y="258" fill="#4fb8c8" font-size="16" text-anchor="middle">?</text>
    <text x="112" y="248" fill="#ECECEC" font-size="13" font-weight="bold">Purga de argônio?</text>
    <text x="112" y="272" fill="#8f8f8f" font-size="11">obrigatória no titânio</text>
    <text x="112" y="300" fill="#5a5a5a" font-size="10">interior + exterior, ou o cordão fragiliza</text>

    <rect x="382" y="212" width="338" height="120" rx="8" fill="#0c0c0c" stroke="#3a3a3a" stroke-width="1.3"></rect>
    <circle cx="420" cy="252" r="18" fill="none" stroke="#4fb8c8" stroke-width="1.6"></circle>
    <text x="420" y="258" fill="#4fb8c8" font-size="16" text-anchor="middle">?</text>
    <text x="454" y="248" fill="#ECECEC" font-size="13" font-weight="bold">Tratamento térmico?</text>
    <text x="454" y="272" fill="#8f8f8f" font-size="11">pós-solda no alumínio</text>
    <text x="454" y="300" fill="#5a5a5a" font-size="10">6061 exige; 7005 autotêmpera</text>

    <text x="380" y="366" fill="#5fbecb" font-size="12" text-anchor="middle">não é para decidir por ele: é para entender o que fazem no seu quadro</text>
