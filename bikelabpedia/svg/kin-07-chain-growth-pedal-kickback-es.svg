<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" role="img" aria-labelledby="t d">
  <title id="t">Chain growth y pedal kickback</title>
  <desc id="d">Al comprimirse la suspensión, el eje trasero se aleja del pedalier y la cadena debe estirarse (chain growth). Esa tensión tira de las bielas hacia atrás: pedal kickback.</desc>
  <metadata><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#"><cc:Work rdf:about=""><dc:title>Chain growth y pedal kickback explicados — BikeLab Studio</dc:title><dc:creator><cc:Agent><dc:title>Carlos Eduardo Ravello Joo · ORCID 0009-0007-5631-7436</dc:title></cc:Agent></dc:creator><dc:publisher>BikeLab Studio — bikelabstudio.com</dc:publisher><dc:source>https://www.bikelabstudio.com/bikelabpedia/chain-growth-y-pedal-kickback-es.html</dc:source><dc:rights>© 2026 BikeLab Studio · Carlos Eduardo Ravello Joo. Licencia CC BY-NC-ND 4.0.</dc:rights><dc:identifier>https://orcid.org/0009-0007-5631-7436</dc:identifier><cc:license rdf:resource="https://creativecommons.org/licenses/by-nc-nd/4.0/"/></cc:Work></rdf:RDF></metadata>
  <style>
    .wh{stroke:#777;stroke-width:3;fill:none}
    .t{font-family:'IBM Plex Mono',monospace;fill:#9a9a9a;font-size:13px}
    .a{font-family:'IBM Plex Mono',monospace;fill:#4fb8c8;font-size:14px;font-weight:700}
    .ch{stroke:#cfcfcf;stroke-width:2}
    .ch2{stroke:#4fb8c8;stroke-width:2.5}
  </style>
  <!-- chainring (BB) -->
  <circle cx="250" cy="270" r="34" class="wh" stroke="#cfcfcf"/>
  <circle cx="250" cy="270" r="5" fill="#cfcfcf"/>
  <text x="250" y="330" text-anchor="middle" class="t">pedalier + plato</text>
  <!-- crank + pedal -->
  <line x1="250" y1="270" x2="250" y2="330" class="ch" stroke="#cfcfcf"/>
  <rect x="236" y="330" width="28" height="10" rx="2" fill="#cfcfcf"/>
  <!-- rear cog position 1 (extended) -->
  <circle cx="560" cy="250" r="16" class="wh" stroke="#777"/>
  <text x="560" y="300" text-anchor="middle" class="t">piñón (extendido)</text>
  <line x1="282" y1="258" x2="546" y2="240" class="ch"/>
  <!-- rear cog position 2 (compressed, moved back/up) -->
  <circle cx="620" cy="180" r="16" class="wh" stroke="#4fb8c8"/>
  <text x="640" y="165" class="a">la rueda se aleja</text>
  <text x="640" y="184" class="t">(suspensión comprimida)</text>
  <line x1="282" y1="252" x2="606" y2="172" class="ch2"/>
  <!-- chain growth bracket -->
  <text x="430" y="120" text-anchor="middle" class="a">CHAIN GROWTH</text>
  <text x="430" y="139" text-anchor="middle" class="t">la cadena tiene que estirarse →</text>
  <!-- kickback arrow on crank -->
  <path d="M250,330 a 60 60 0 0 1 -34,-50" fill="none" stroke="#4fb8c8" stroke-width="2.5" marker-end="url(#kb)"/>
  <text x="150" y="360" text-anchor="middle" class="a">PEDAL KICKBACK</text>
  <text x="150" y="379" text-anchor="middle" class="t">…y te patea el pedal atrás</text>
  <defs>
    <marker id="kb" markerWidth="9" markerHeight="9" refX="4.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#4fb8c8"/></marker>
  </defs>
  <text x="752" y="425" text-anchor="end" font-family="'IBM Plex Mono',monospace" font-size="10" fill="#333">bikelabstudio.com · C.E. Ravello Joo · CC BY-NC-ND 4.0</text>
</svg>
