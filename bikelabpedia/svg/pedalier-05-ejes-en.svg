    <text x="600" y="320" fill="#8f8f8f" font-size="11.5" text-anchor="middle">the stiffest</text>

    <text x="380" y="372" fill="#5fbecb" font-size="12" text-anchor="middle">larger diameter = stiffer · stiffness scales with the 4th power of Ø</text>
