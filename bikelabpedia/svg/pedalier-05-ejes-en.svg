    <text x="380" y="300" fill="#f0f0f0" font-size="14" text-anchor="middle">SRAM DUB</text>
    <text x="380" y="320" fill="#8f8f8f" font-size="11.5" text-anchor="middle">patented spindle</text>

    <circle cx="600" cy="170" r="60" fill="none" stroke="#4fb8c8" stroke-width="2.4"></circle>
