  <g font-family="&#39;IBM Plex Mono&#39;, ui-monospace, monospace">
    <rect x="0" y="0" width="760" height="400" rx="14" fill="#080808"></rect>
    <rect x="1" y="1" width="758" height="398" rx="14" fill="none" stroke="#242424" stroke-width="1.5"></rect>
    <text x="40" y="34" fill="#4fb8c8" font-size="11" letter-spacing="2.5">SPINDLE DIAMETERS</text>
    <text x="40" y="50" fill="#5a5a5a" font-size="11">BikeLab-pedia // pedalier-05 · relative-to-scale</text>

    <line x1="70" y1="170" x2="690" y2="170" stroke="#242424" stroke-width="1" stroke-dasharray="4 5"></line>

    <circle cx="170" cy="170" r="48" fill="none" stroke="#e6e6e6" stroke-width="2"></circle>
    <circle cx="170" cy="170" r="26" fill="#151515" stroke="#5f5f5f" stroke-width="1.4"></circle>
