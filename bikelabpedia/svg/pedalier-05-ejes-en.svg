    <line x1="122" y1="232" x2="122" y2="244" stroke="#5a5a5a"></line><line x1="218" y1="232" x2="218" y2="244" stroke="#5a5a5a"></line>
    <text x="170" y="232" fill="#8f8f8f" font-size="13" text-anchor="middle">24 mm</text>
    <text x="170" y="300" fill="#f0f0f0" font-size="14" text-anchor="middle">Shimano</text>
    <text x="170" y="320" fill="#8f8f8f" font-size="11.5" text-anchor="middle">Hollowtech II</text>

    <circle cx="380" cy="170" r="58" fill="none" stroke="#e6e6e6" stroke-width="2"></circle>
