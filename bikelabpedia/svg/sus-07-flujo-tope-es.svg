<?xml version="1.0"?>
<svg viewBox="0 0 760 430" xmlns="http://www.w3.org/2000/svg" xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <title>Flujo: hace tope — BikeLab Studio</title>
  <desc>Diagrama de flujo para una suspensión que hace tope: subir presión, comprobar si queda dura arriba, añadir un token de progresividad y revisar la compresión alta. © Carlos Eduardo Ravello Joo · carlosravello.com</desc>
  <metadata><RDF xmlns:dc="http://purl.org/dc/elements/1.1/"><Description><creator>Carlos Eduardo Ravello Joo</creator><rights>© 2026 Carlos Eduardo Ravello Joo. Todos los derechos reservados.</rights><publisher>BikeLab Studio</publisher><source>https://carlosravello.com</source><identifier>https://orcid.org/0009-0007-5631-7436</identifier></Description></RDF></metadata>
  <g font-family="&#39;IBM Plex Mono&#39;, ui-monospace, monospace">
    <rect x="0" y="0" width="760" height="430" rx="14" fill="#050505"></rect>
    <rect x="1" y="1" width="758" height="428" rx="14" fill="none" stroke="#242424" stroke-width="1.5"></rect>
    <text x="40" y="36" fill="#4fb8c8" font-size="11" letter-spacing="2.5">FLUJO · HACE TOPE</text>
    <text x="40" y="54" fill="#9a9a9a" font-size="11">BikeLab-pedia // sus-07 · llega al final de golpe</text>

    <rect x="280" y="76" width="200" height="40" rx="8" fill="#0c0c0c" stroke="#d9a44a" stroke-width="1.4"></rect>
    <text x="380" y="101" fill="#d9a44a" font-size="13" text-anchor="middle" font-weight="bold">hace tope (bottom-out)</text>

    <line x1="380" y1="116" x2="380" y2="142" stroke="#4fb8c8" stroke-width="1.4" marker-end="url(#aC)"></line>
    <rect x="300" y="142" width="160" height="42" rx="8" fill="#0c0c0c" stroke="#4fb8c8" stroke-width="1.3"></rect>
    <text x="380" y="168" fill="#4fb8c8" font-size="13" text-anchor="middle" font-weight="bold">+5 psi</text>

    <line x1="380" y1="184" x2="380" y2="206" stroke="#9a9a9a" stroke-width="1.4" marker-end="url(#aS)"></line>
    <polygon points="380,208 480,242 380,276 280,242" fill="#0c0c0c" stroke="#4fb8c8" stroke-width="1.4"></polygon>
    <text x="380" y="238" fill="#ffffff" font-size="11.5" text-anchor="middle">¿queda dura arriba</text>
    <text x="380" y="255" fill="#ffffff" font-size="11.5" text-anchor="middle">(baches pequeños)?</text>

    
    <line x1="480" y1="242" x2="588" y2="242" stroke="#d9a44a" stroke-width="1.4" marker-end="url(#aA)"></line>
    <text x="534" y="234" fill="#d9a44a" font-size="10" text-anchor="middle">SÍ</text>
    <rect x="590" y="218" width="120" height="48" rx="8" fill="#0c0c0c" stroke="#d9a44a" stroke-width="1.3"></rect>
    <text x="650" y="240" fill="#d9a44a" font-size="11" text-anchor="middle" font-weight="bold">+1 token</text>
    <text x="650" y="257" fill="#9a9a9a" font-size="8.5" text-anchor="middle">progresividad, no presión</text>

    
    <line x1="380" y1="276" x2="380" y2="302" stroke="#4fb8c8" stroke-width="1.4" marker-end="url(#aC)"></line>
    <text x="396" y="294" fill="#4fb8c8" font-size="10">NO</text>
    <rect x="250" y="302" width="260" height="58" rx="8" fill="#0c0c0c" stroke="#3a3a3a" stroke-width="1.3"></rect>
    <text x="380" y="324" fill="#ffffff" font-size="11.5" text-anchor="middle">revisa la compresión alta (HSC)</text>
    <text x="380" y="344" fill="#9a9a9a" font-size="10" text-anchor="middle">cierra 1–2 clics para frenar el impacto seco</text>

    <text x="380" y="398" fill="#4fb8c8" font-size="12" text-anchor="middle">+presión sube todo; +token solo endurece el final sin perder sensibilidad</text>
    <text x="724" y="418" fill="#3a3a3a" font-size="8.5" text-anchor="end">© C.E. Ravello Joo · carlosravello.com</text>

    <defs>
      <marker id="aS" markerWidth="9" markerHeight="9" refX="6" refY="4" orient="auto"><path d="M0 0 L6 4 L0 8" fill="none" stroke="#9a9a9a" stroke-width="1.4"></path></marker>
      <marker id="aC" markerWidth="9" markerHeight="9" refX="6" refY="4" orient="auto"><path d="M0 0 L6 4 L0 8" fill="none" stroke="#4fb8c8" stroke-width="1.4"></path></marker>
      <marker id="aA" markerWidth="9" markerHeight="9" refX="6" refY="4" orient="auto"><path d="M0 0 L6 4 L0 8" fill="none" stroke="#d9a44a" stroke-width="1.4"></path></marker>
    </defs>
  </g>
</svg>