<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" role="img" aria-labelledby="t d">
  <title id="t">Six-bar / DW6: seis barras articuladas</title>
  <desc id="d">El six-bar añade más barras y articulaciones para definir de forma casi independiente el leverage ratio, el anti-squat, el anti-rise y la trayectoria del eje, a costa de complejidad y peso.</desc>
