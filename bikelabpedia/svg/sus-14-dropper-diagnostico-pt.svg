<?xml version="1.0"?>
<svg viewBox="0 0 760 470" xmlns="http://www.w3.org/2000/svg" xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <title>Diagnóstico do dropper — BikeLab Studio</title>
  <desc>Anatomia interna de um canote telescópico e árvore de falhas: não sobe, afunda ou tem folga lateral, com suas causas e soluções. © Carlos Eduardo Ravello Joo · carlosravello.com</desc>
  <metadata><RDF xmlns:dc="http://purl.org/dc/elements/1.1/"><Description><creator>Carlos Eduardo Ravello Joo</creator><rights>© 2026 Carlos Eduardo Ravello Joo. Todos os direitos reservados.</rights><publisher>BikeLab Studio</publisher><source>https://carlosravello.com</source><identifier>https://orcid.org/0009-0007-5631-7436</identifier></Description></RDF></metadata>
  <g font-family="&#39;IBM Plex Mono&#39;, ui-monospace, monospace">
    <rect x="0" y="0" width="760" height="470" rx="14" fill="#050505"></rect>
    <rect x="1" y="1" width="758" height="468" rx="14" fill="none" stroke="#242424" stroke-width="1.5"></rect>
    <text x="40" y="36" fill="#4fb8c8" font-size="11" letter-spacing="2.5">DIAGNÓSTICO DO DROPPER</text>
    <text x="40" y="54" fill="#9a9a9a" font-size="11">BikeLab-pedia // sus-14 · anatomia interna + árvore de falhas</text>

    <text x="150" y="86" fill="#9a9a9a" font-size="11" text-anchor="middle">ANATOMIA INTERNA</text>
    <rect x="120" y="100" width="60" height="300" rx="6" fill="#0c0c0c" stroke="#3a3a3a" stroke-width="1.3"></rect>
    <rect x="134" y="120" width="32" height="120" rx="4" fill="#4fb8c8" fill-opacity="0.15" stroke="#4fb8c8" stroke-width="1.3"></rect>
    <text x="196" y="150" fill="#4fb8c8" font-size="9" text-anchor="start">cartucho</text>
    <line x1="166" y1="150" x2="192" y2="150" stroke="#3a3a3a" stroke-width="1"></line>
    <rect x="134" y="240" width="32" height="10" fill="#9a9a9a"></rect>
    <text x="196" y="248" fill="#9a9a9a" font-size="9" text-anchor="start">IFP (pistão flutuante)</text>
    <line x1="166" y1="246" x2="192" y2="246" stroke="#3a3a3a" stroke-width="1"></line>
    <rect x="134" y="250" width="32" height="120" rx="4" fill="#d9a44a" fill-opacity="0.15" stroke="#d9a44a" stroke-width="1.3"></rect>
    <circle cx="150" cy="380" r="5" fill="none" stroke="#d9a44a" stroke-width="1.3"></circle>
    <text x="196" y="384" fill="#d9a44a" font-size="9" text-anchor="start">válvula de ar</text>
    <line x1="166" y1="380" x2="192" y2="380" stroke="#3a3a3a" stroke-width="1"></line>

    <line x1="360" y1="80" x2="360" y2="420" stroke="#2c2c2c" stroke-width="1"></line>

    <text x="400" y="86" fill="#9a9a9a" font-size="11">SINTOMA → CAUSA PROVÁVEL</text>
    <rect x="400" y="100" width="320" height="92" rx="8" fill="#0c0c0c" stroke="#d9a44a" stroke-width="1.3"></rect>
    <text x="416" y="124" fill="#d9a44a" font-size="12.5" font-weight="bold">não sobe</text>
    <text x="416" y="146" fill="#ffffff" font-size="10.5">· cabo tenso demais</text>
    <text x="416" y="164" fill="#ffffff" font-size="10.5">· colar apertado &gt; 5 N·m</text>
    <text x="416" y="182" fill="#ffffff" font-size="10.5">· pressão de ar baixa (recarregue)</text>
    <rect x="400" y="202" width="320" height="70" rx="8" fill="#0c0c0c" stroke="#d9a44a" stroke-width="1.3"></rect>
    <text x="416" y="226" fill="#d9a44a" font-size="12.5" font-weight="bold">afunda</text>
    <text x="416" y="248" fill="#ffffff" font-size="10.5">· válvula / vedações internas</text>
    <text x="416" y="266" fill="#ffffff" font-size="10.5">· cartucho a substituir</text>
    <rect x="400" y="282" width="320" height="70" rx="8" fill="#0c0c0c" stroke="#d9a44a" stroke-width="1.3"></rect>
    <text x="416" y="306" fill="#d9a44a" font-size="12.5" font-weight="bold">folga lateral</text>
    <text x="416" y="328" fill="#ffffff" font-size="10.5">· buchas (bushings) gastas</text>
    <text x="416" y="346" fill="#ffffff" font-size="10.5">· algumas ajustam com shims</text>

    <text x="380" y="392" fill="#4fb8c8" font-size="12" text-anchor="middle">a maioria das falhas é cabo, colar ou pressão — antes de abrir o cartucho</text>
    <text x="380" y="414" fill="#9a9a9a" font-size="10" text-anchor="middle">comece sempre pelo barato e reversível: cabo e torque do colar</text>
    <text x="724" y="456" fill="#3a3a3a" font-size="8.5" text-anchor="end">© C.E. Ravello Joo · carlosravello.com</text>
  </g>
