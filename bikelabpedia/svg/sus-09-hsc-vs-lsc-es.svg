<?xml version="1.0"?>
<svg viewBox="0 0 760 430" xmlns="http://www.w3.org/2000/svg" xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <title>HSC vs LSC: la velocidad del vástago — BikeLab Studio</title>
  <desc>El eje de la compresión es la velocidad del vástago, no la de la bici: LSC para frenadas, apoyos y bombeo; HSC para raíces, piedras e impactos secos. © Carlos Eduardo Ravello Joo · carlosravello.com</desc>
  <metadata><RDF xmlns:dc="http://purl.org/dc/elements/1.1/"><Description><creator>Carlos Eduardo Ravello Joo</creator><rights>© 2026 Carlos Eduardo Ravello Joo. Todos los derechos reservados.</rights><publisher>BikeLab Studio</publisher><source>https://carlosravello.com</source><identifier>https://orcid.org/0009-0007-5631-7436</identifier></Description></RDF></metadata>
  <g font-family="&#39;IBM Plex Mono&#39;, ui-monospace, monospace">
    <rect x="0" y="0" width="760" height="430" rx="14" fill="#050505"></rect>
    <rect x="1" y="1" width="758" height="428" rx="14" fill="none" stroke="#242424" stroke-width="1.5"></rect>
    <text x="40" y="36" fill="#4fb8c8" font-size="11" letter-spacing="2.5">HSC vs LSC</text>
    <text x="40" y="54" fill="#9a9a9a" font-size="11">BikeLab-pedia // sus-09 · velocidad del VÁSTAGO, no de la bici</text>

    
    <rect x="40" y="74" width="680" height="34" rx="8" fill="#0c0c0c" stroke="#4fb8c8" stroke-width="1.3"></rect>
    <text x="380" y="96" fill="#4fb8c8" font-size="12.5" text-anchor="middle" font-weight="bold">el eje es la velocidad a la que se comprime el vástago — no a la que ruedas</text>

    
    <rect x="40" y="126" width="340" height="220" rx="10" fill="#0c0c0c" stroke="#3a3a3a" stroke-width="1.3"></rect>
    <text x="64" y="154" fill="#4fb8c8" font-size="14" font-weight="bold">LSC</text>
    <text x="118" y="154" fill="#9a9a9a" font-size="11">baja velocidad de vástago</text>
    <line x1="64" y1="164" x2="356" y2="164" stroke="#242424" stroke-width="1"></line>
    <text x="64" y="190" fill="#ffffff" font-size="11.5">· frenadas (clavar el freno)</text>
    <text x="64" y="216" fill="#ffffff" font-size="11.5">· apoyos en curva</text>
    <text x="64" y="242" fill="#ffffff" font-size="11.5">· bombeo y pedaleo</text>
    <text x="64" y="268" fill="#ffffff" font-size="11.5">· transferencias de peso</text>
    <text x="64" y="306" fill="#9a9a9a" font-size="10">movimientos lentos que TÚ provocas</text>
    <text x="64" y="324" fill="#5a5a5a" font-size="9.5">controla el hundimiento y el soporte</text>

    
    <rect x="380" y="126" width="340" height="220" rx="10" fill="#0c0c0c" stroke="#3a3a3a" stroke-width="1.3"></rect>
    <text x="404" y="154" fill="#d9a44a" font-size="14" font-weight="bold">HSC</text>
    <text x="458" y="154" fill="#9a9a9a" font-size="11">alta velocidad de vástago</text>
    <line x1="404" y1="164" x2="696" y2="164" stroke="#242424" stroke-width="1"></line>
    <text x="404" y="190" fill="#ffffff" font-size="11.5">· raíces cruzadas</text>
    <text x="404" y="216" fill="#ffffff" font-size="11.5">· piedras y escalones</text>
    <text x="404" y="242" fill="#ffffff" font-size="11.5">· impactos secos</text>
    <text x="404" y="268" fill="#ffffff" font-size="11.5">· aterrizajes fuertes</text>
    <text x="404" y="306" fill="#9a9a9a" font-size="10">golpes rápidos que da el TERRENO</text>
    <text x="404" y="324" fill="#5a5a5a" font-size="9.5">controla los impactos bruscos</text>

    <text x="380" y="384" fill="#4fb8c8" font-size="12" text-anchor="middle">una raíz a 5 km/h mueve el vástago más rápido que un frenazo a 40 km/h</text>
    <text x="724" y="416" fill="#3a3a3a" font-size="8.5" text-anchor="end">© C.E. Ravello Joo · carlosravello.com</text>
  </g>
</svg>