<?xml version="1.0"?>
<svg viewBox="0 0 760 430" xmlns="http://www.w3.org/2000/svg" xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <title>Fluxo: a suspensão está dura — BikeLab Studio</title>
  <desc>Fluxograma para diagnosticar uma suspensão dura demais: checar SAG, baixar pressão, abrir cliques de compressão baixa e descartar stiction ou serviço. © Carlos Eduardo Ravello Joo · carlosravello.com</desc>
  <metadata><RDF xmlns:dc="http://purl.org/dc/elements/1.1/"><Description><creator>Carlos Eduardo Ravello Joo</creator><rights>© 2026 Carlos Eduardo Ravello Joo. Todos os direitos reservados.</rights><publisher>BikeLab Studio</publisher><source>https://carlosravello.com</source><identifier>https://orcid.org/0009-0007-5631-7436</identifier></Description></RDF></metadata>
  <g font-family="&#39;IBM Plex Mono&#39;, ui-monospace, monospace">
    <rect x="0" y="0" width="760" height="430" rx="14" fill="#050505"></rect>
    <rect x="1" y="1" width="758" height="428" rx="14" fill="none" stroke="#242424" stroke-width="1.5"></rect>
    <text x="40" y="36" fill="#4fb8c8" font-size="11" letter-spacing="2.5">FLUXO · ESTÁ DURA</text>
    <text x="40" y="54" fill="#9a9a9a" font-size="11">BikeLab-pedia // sus-06 · não usa todo o curso</text>

    <rect x="280" y="76" width="200" height="40" rx="8" fill="#0c0c0c" stroke="#d9a44a" stroke-width="1.4"></rect>
    <text x="380" y="101" fill="#d9a44a" font-size="13" text-anchor="middle" font-weight="bold">está dura / não engole</text>

    <line x1="380" y1="116" x2="380" y2="140" stroke="#9a9a9a" stroke-width="1.4" marker-end="url(#aS)"></line>
    <polygon points="380,142 470,176 380,210 290,176" fill="#0c0c0c" stroke="#4fb8c8" stroke-width="1.4"></polygon>
    <text x="380" y="172" fill="#ffffff" font-size="11.5" text-anchor="middle">SAG correto?</text>
    <text x="380" y="190" fill="#9a9a9a" font-size="9.5" text-anchor="middle">15–20% / 25–30%</text>

    <line x1="290" y1="176" x2="180" y2="176" stroke="#d9a44a" stroke-width="1.4" marker-end="url(#aA)"></line>
    <text x="232" y="168" fill="#d9a44a" font-size="10" text-anchor="middle">NÃO</text>
    <rect x="60" y="156" width="120" height="42" rx="8" fill="#0c0c0c" stroke="#d9a44a" stroke-width="1.3"></rect>
    <text x="120" y="181" fill="#ffffff" font-size="11" text-anchor="middle">−5 psi</text>
    <text x="120" y="214" fill="#9a9a9a" font-size="9" text-anchor="middle">e meça de novo</text>

    <line x1="380" y1="210" x2="380" y2="240" stroke="#4fb8c8" stroke-width="1.4" marker-end="url(#aC)"></line>
    <text x="394" y="230" fill="#4fb8c8" font-size="10">SIM</text>
    <rect x="270" y="240" width="220" height="46" rx="8" fill="#0c0c0c" stroke="#4fb8c8" stroke-width="1.3"></rect>
    <text x="380" y="262" fill="#4fb8c8" font-size="12" text-anchor="middle" font-weight="bold">abra cliques de LSC</text>
    <text x="380" y="279" fill="#9a9a9a" font-size="9.5" text-anchor="middle">compressão baixa · de 2 em 2</text>

    <line x1="380" y1="286" x2="380" y2="312" stroke="#9a9a9a" stroke-width="1.4" marker-end="url(#aS)"></line>
    <rect x="230" y="312" width="300" height="58" rx="8" fill="#0c0c0c" stroke="#3a3a3a" stroke-width="1.3"></rect>
    <text x="380" y="334" fill="#ffffff" font-size="11.5" text-anchor="middle">segue dura com tudo aberto?</text>
    <text x="380" y="354" fill="#d9a44a" font-size="11" text-anchor="middle">stiction · hora do serviço (horas de uso)</text>

    <text x="380" y="404" fill="#4fb8c8" font-size="12" text-anchor="middle">primeiro o SAG, depois a compressão, e por fim a manutenção</text>
    <text x="724" y="420" fill="#3a3a3a" font-size="8.5" text-anchor="end">© C.E. Ravello Joo · carlosravello.com</text>

    <defs>
      <marker id="aS" markerWidth="9" markerHeight="9" refX="6" refY="4" orient="auto"><path d="M0 0 L6 4 L0 8" fill="none" stroke="#9a9a9a" stroke-width="1.4"></path></marker>
      <marker id="aC" markerWidth="9" markerHeight="9" refX="6" refY="4" orient="auto"><path d="M0 0 L6 4 L0 8" fill="none" stroke="#4fb8c8" stroke-width="1.4"></path></marker>
      <marker id="aA" markerWidth="9" markerHeight="9" refX="6" refY="4" orient="auto"><path d="M0 0 L6 4 L0 8" fill="none" stroke="#d9a44a" stroke-width="1.4"></path></marker>
    </defs>
  </g>
</svg>