      <line x1="490" y1="194" x2="490" y2="206" stroke="#5a5a5a"></line><line x1="640" y1="194" x2="640" y2="206" stroke="#5a5a5a"></line>
      <text x="565" y="220" fill="#4fb8c8" font-size="14" text-anchor="middle">M12 × 1.0</text>
