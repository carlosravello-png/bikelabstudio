        <line x1="600" y1="161" x2="600" y2="179"></line><line x1="610" y1="161" x2="610" y2="179"></line>
        <line x1="620" y1="161" x2="620" y2="179"></line><line x1="630" y1="161" x2="630" y2="179"></line>
