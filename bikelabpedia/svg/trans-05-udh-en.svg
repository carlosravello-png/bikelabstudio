      <line x1="346" y1="162" x2="386" y2="162"></line><line x1="346" y1="170" x2="386" y2="170"></line><line x1="346" y1="178" x2="386" y2="178"></line>
    </g>
    <text x="360" y="232" fill="#8f8f8f" font-size="11.5" text-anchor="middle">bolt</text>
    <text x="360" y="248" fill="#5a5a5a" font-size="10.5" text-anchor="middle">reverse thread</text>

    <g>
      <circle cx="470" cy="170" r="20" fill="#101010" stroke="#9c9c9c" stroke-width="1.8"></circle>
      <circle cx="470" cy="170" r="8" fill="#080808" stroke="#7a7a7a" stroke-width="1.2"></circle>
