    <rect x="120" y="296" width="520" height="44" rx="6" fill="#0c0c0c" stroke="#3a3a3a" stroke-width="1.3"></rect>
    <rect x="120" y="296" width="5" height="44" fill="#4fb8c8"></rect>
    <text x="142" y="316" fill="#e6e6e6" font-size="12.5">The frame must be UDH from the factory.</text>
    <text x="142" y="333" fill="#8f8f8f" font-size="11">It&#39;s the base for Full Mount / T-Type setups (direct-mount derailleur, no separate hanger).</text>

    <text x="380" y="378" fill="#5fbecb" font-size="12" text-anchor="middle">a single standard hanger for almost any modern frame</text>
    <text x="724" y="393" fill="#2f2f2f" font-size="8.5" text-anchor="end">© C.E. Ravello Joo · carlosravello.com</text>

