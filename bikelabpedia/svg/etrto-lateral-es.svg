<title id="t">Lectura ETRTO en el flanco</title>
<desc id="d">Marca ETRTO en el flanco del neumático (57-622) con callouts: 57 = ancho de sección en mm, 622 = diámetro de asiento del talón (29&#34;). Tabla de equivalencias con 584 (27.5&#34;) y 559 (26&#34;). — © Carlos Eduardo Ravello Joo · BikeLab Studio · CC BY 4.0 · bikelabstudio.com</desc>
