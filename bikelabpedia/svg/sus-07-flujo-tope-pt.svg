    <text x="380" y="168" fill="#4fb8c8" font-size="13" text-anchor="middle" font-weight="bold">+5 psi</text>

    <line x1="380" y1="184" x2="380" y2="206" stroke="#9a9a9a" stroke-width="1.4" marker-end="url(#aS)"></line>
    <polygon points="380,208 480,242 380,276 280,242" fill="#0c0c0c" stroke="#4fb8c8" stroke-width="1.4"></polygon>
