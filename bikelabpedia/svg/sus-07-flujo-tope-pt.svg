    <text x="40" y="36" fill="#4fb8c8" font-size="11" letter-spacing="2.5">FLUXO · FIM DE CURSO</text>
    <text x="40" y="54" fill="#9a9a9a" font-size="11">BikeLab-pedia // sus-07 · chega ao fim com pancada</text>

    <rect x="280" y="76" width="200" height="40" rx="8" fill="#0c0c0c" stroke="#d9a44a" stroke-width="1.4"></rect>
    <text x="380" y="101" fill="#d9a44a" font-size="13" text-anchor="middle" font-weight="bold">faz fim de curso</text>

    <line x1="380" y1="116" x2="380" y2="142" stroke="#4fb8c8" stroke-width="1.4" marker-end="url(#aC)"></line>
