    <text x="650" y="240" fill="#d9a44a" font-size="11" text-anchor="middle" font-weight="bold">+1 token</text>
    <text x="650" y="257" fill="#9a9a9a" font-size="8.5" text-anchor="middle">progressividade, não pressão</text>

