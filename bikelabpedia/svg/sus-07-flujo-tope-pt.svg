    <text x="380" y="324" fill="#ffffff" font-size="11.5" text-anchor="middle">revise a compressão alta (HSC)</text>
    <text x="380" y="344" fill="#9a9a9a" font-size="10" text-anchor="middle">feche 1–2 cliques para frear o impacto seco</text>

    <text x="380" y="398" fill="#4fb8c8" font-size="12" text-anchor="middle">+pressão sobe tudo; +token só endurece o final sem perder sensibilidade</text>
