<?xml version="1.0"?>
<svg viewBox="0 0 760 400" xmlns="http://www.w3.org/2000/svg" xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <title>Rotor size to scale — BikeLab Studio</title>
  <desc>Concentric brake rotors to scale of 140, 160, 180, 203 and 220 mm; SRAM 200 and Shimano 203 don&#39;t share an adapter; a +20 mm adapter raises 160 to 180 mm. © Carlos Eduardo Ravello Joo · carlosravello.com</desc>
  <metadata><RDF xmlns:dc="http://purl.org/dc/elements/1.1/"><Description><creator>Carlos Eduardo Ravello Joo</creator><rights>© 2026 Carlos Eduardo Ravello Joo. All rights reserved.</rights><publisher>BikeLab Studio</publisher><source>https://carlosravello.com</source></Description></RDF></metadata>
  <g font-family="&#39;IBM Plex Mono&#39;, ui-monospace, monospace">
    <rect x="0" y="0" width="760" height="400" rx="14" fill="#080808"></rect>
    <rect x="1" y="1" width="758" height="398" rx="14" fill="none" stroke="#242424" stroke-width="1.5"></rect>
    <text x="40" y="34" fill="#4fb8c8" font-size="11" letter-spacing="2.5">ROTOR SIZE</text>
    <text x="40" y="50" fill="#5a5a5a" font-size="11">BikeLab-pedia // brake-03 · concentric, to scale</text>

    <circle cx="250" cy="212" r="68" fill="none" stroke="#7a7a7a" stroke-width="1.6"></circle>
    <circle cx="250" cy="212" r="63" fill="none" stroke="#7a7a7a" stroke-width="1.6"></circle>
    <circle cx="250" cy="212" r="56" fill="none" stroke="#4fb8c8" stroke-width="2"></circle>
    <circle cx="250" cy="212" r="50" fill="none" stroke="#7a7a7a" stroke-width="1.6"></circle>
    <circle cx="250" cy="212" r="43" fill="none" stroke="#7a7a7a" stroke-width="1.6"></circle>
    <circle cx="250" cy="212" r="14" fill="#151515" stroke="#5f5f5f" stroke-width="1.2"></circle>

    <g font-size="11">
      <line x1="298" y1="164" x2="342" y2="150" stroke="#5a5a5a"></line><text x="348" y="154" fill="#8f8f8f">220 mm</text>
      <line x1="295" y1="167" x2="342" y2="176" stroke="#5a5a5a"></line><text x="348" y="180" fill="#8f8f8f">203 mm</text>
      <line x1="290" y1="172" x2="342" y2="202" stroke="#4fb8c8"></line><text x="348" y="206" fill="#4fb8c8">180 mm</text>
      <line x1="285" y1="177" x2="342" y2="240" stroke="#5a5a5a"></line><text x="348" y="244" fill="#8f8f8f">160 mm</text>
      <line x1="280" y1="182" x2="342" y2="266" stroke="#5a5a5a"></line><text x="348" y="270" fill="#8f8f8f">140 mm</text>
    </g>

    <rect x="470" y="120" width="250" height="70" rx="6" fill="#0c0c0c" stroke="#3a3a3a" stroke-width="1.3"></rect>
    <text x="486" y="142" fill="#8f8f8f" font-size="10.5">SRAM 200 · Shimano 203</text>
    <text x="486" y="162" fill="#5a5a5a" font-size="10.5">are different sizes:</text>
    <text x="486" y="180" fill="#5a5a5a" font-size="10.5">do NOT swap the adapter</text>

    <rect x="470" y="206" width="250" height="74" rx="6" fill="#0c0c0c" stroke="#4fb8c8" stroke-width="1.5"></rect>
    <text x="486" y="228" fill="#8f8f8f" font-size="10.5">ADAPTER RULE</text>
    <path d="M490 244 h28 v22 h-28" fill="none" stroke="#4fb8c8" stroke-width="1.6"></path>
    <circle cx="490" cy="250" r="3.5" fill="#101010" stroke="#4fb8c8" stroke-width="1.2"></circle>
    <circle cx="490" cy="260" r="3.5" fill="#101010" stroke="#4fb8c8" stroke-width="1.2"></circle>
    <text x="536" y="252" fill="#4fb8c8" font-size="14">+20 mm</text>
    <text x="536" y="270" fill="#5fbecb" font-size="11">raises 160 → 180</text>

    <text x="380" y="348" fill="#8f8f8f" font-size="11.5" text-anchor="middle">more diameter = more braking torque and better heat dissipation</text>
    <text x="380" y="378" fill="#5fbecb" font-size="12" text-anchor="middle">sizing up one step usually costs just a caliper adapter, not a new caliper</text>
    <text x="724" y="393" fill="#2f2f2f" font-size="8.5" text-anchor="end">© C.E. Ravello Joo · carlosravello.com</text>
  </g>
</svg>