<?xml version="1.0"?>
<svg viewBox="0 0 760 400" xmlns="http://www.w3.org/2000/svg" xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <title>Caliper mounts: Post, Flat, IS — BikeLab Studio</title>
  <desc>Comparison of disc-brake caliper mounts with dimensions: Post Mount (74 mm between posts, M6 bolt), Flat Mount (34 mm, M5 bolt from below) and IS Mount (legacy). © Carlos Eduardo Ravello Joo · carlosravello.com</desc>
  <metadata><RDF xmlns:dc="http://purl.org/dc/elements/1.1/"><Description><creator>Carlos Eduardo Ravello Joo</creator><rights>© 2026 Carlos Eduardo Ravello Joo. All rights reserved.</rights><publisher>BikeLab Studio</publisher><source>https://carlosravello.com</source></Description></RDF></metadata>
  <g font-family="&#39;IBM Plex Mono&#39;, ui-monospace, monospace">
    <rect x="0" y="0" width="760" height="400" rx="14" fill="#080808"></rect>
    <rect x="1" y="1" width="758" height="398" rx="14" fill="none" stroke="#242424" stroke-width="1.5"></rect>
    <text x="40" y="34" fill="#4fb8c8" font-size="11" letter-spacing="2.5">CALIPER MOUNTS</text>
    <text x="40" y="50" fill="#5a5a5a" font-size="11">BikeLab-pedia // brake-01 · with real dimensions</text>

    <line x1="293" y1="80" x2="293" y2="306" stroke="#2c2c2c" stroke-width="1"></line>
    <line x1="507" y1="80" x2="507" y2="306" stroke="#2c2c2c" stroke-width="1"></line>

    <text x="166" y="100" fill="#8f8f8f" font-size="12" text-anchor="middle">POST MOUNT</text>
    <rect x="126" y="150" width="80" height="84" rx="6" fill="#151515" stroke="#9c9c9c" stroke-width="1.6"></rect>
    <circle cx="146" cy="138" r="7" fill="#101010" stroke="#7a7a7a" stroke-width="1.6"></circle>
    <circle cx="186" cy="138" r="7" fill="#101010" stroke="#7a7a7a" stroke-width="1.6"></circle>
    <line x1="146" y1="145" x2="146" y2="150" stroke="#7a7a7a" stroke-width="2"></line>
    <line x1="186" y1="145" x2="186" y2="150" stroke="#7a7a7a" stroke-width="2"></line>
    <line x1="146" y1="120" x2="186" y2="120" stroke="#4fb8c8" stroke-width="1.4"></line>
    <line x1="146" y1="114" x2="146" y2="126" stroke="#4fb8c8"></line><line x1="186" y1="114" x2="186" y2="126" stroke="#4fb8c8"></line>
    <text x="166" y="108" fill="#4fb8c8" font-size="13" text-anchor="middle">74 mm</text>
    <text x="166" y="262" fill="#5a5a5a" font-size="10.5" text-anchor="middle">M6 bolt · posts</text>
    <text x="166" y="278" fill="#5a5a5a" font-size="10.5" text-anchor="middle">parallel to the disc</text>
    <text x="166" y="298" fill="#8f8f8f" font-size="10.5" text-anchor="middle">MTB · adjust with adapter</text>

    <text x="400" y="100" fill="#8f8f8f" font-size="12" text-anchor="middle">FLAT MOUNT</text>
    <rect x="364" y="150" width="72" height="60" rx="5" fill="#151515" stroke="#9c9c9c" stroke-width="1.6"></rect>
    <circle cx="382" cy="222" r="6" fill="#101010" stroke="#7a7a7a" stroke-width="1.6"></circle>
    <circle cx="418" cy="222" r="6" fill="#101010" stroke="#7a7a7a" stroke-width="1.6"></circle>
    <line x1="382" y1="210" x2="382" y2="216" stroke="#7a7a7a" stroke-width="2"></line>
    <line x1="418" y1="210" x2="418" y2="216" stroke="#7a7a7a" stroke-width="2"></line>
    <line x1="382" y1="240" x2="418" y2="240" stroke="#4fb8c8" stroke-width="1.4"></line>
    <line x1="382" y1="234" x2="382" y2="246" stroke="#4fb8c8"></line><line x1="418" y1="234" x2="418" y2="246" stroke="#4fb8c8"></line>
    <text x="400" y="258" fill="#4fb8c8" font-size="13" text-anchor="middle">34 mm</text>
    <text x="400" y="278" fill="#5a5a5a" font-size="10.5" text-anchor="middle">M5 bolt · from below</text>
    <text x="400" y="298" fill="#8f8f8f" font-size="10.5" text-anchor="middle">compact · road / gravel</text>

    <text x="634" y="100" fill="#8f8f8f" font-size="12" text-anchor="middle">IS MOUNT</text>
    <rect x="596" y="150" width="76" height="84" rx="6" fill="#151515" stroke="#9c9c9c" stroke-width="1.6"></rect>
    <rect x="576" y="166" width="20" height="14" fill="#101010" stroke="#7a7a7a" stroke-width="1.4"></rect>
    <rect x="576" y="204" width="20" height="14" fill="#101010" stroke="#7a7a7a" stroke-width="1.4"></rect>
    <circle cx="586" cy="173" r="4" fill="#080808" stroke="#7a7a7a" stroke-width="1.2"></circle>
    <circle cx="586" cy="211" r="4" fill="#080808" stroke="#7a7a7a" stroke-width="1.2"></circle>
    <text x="634" y="262" fill="#5a5a5a" font-size="10.5" text-anchor="middle">perpendicular tabs</text>
    <text x="634" y="278" fill="#5a5a5a" font-size="10.5" text-anchor="middle">always with adapter</text>
    <text x="634" y="298" fill="#8f8f8f" font-size="10.5" text-anchor="middle">legacy · rare today</text>

    <text x="380" y="348" fill="#8f8f8f" font-size="11.5" text-anchor="middle">the bolt spacing defines the mount · Post 74 mm vs Flat 34 mm</text>
    <text x="380" y="378" fill="#5fbecb" font-size="12" text-anchor="middle">Flat Mount rules road and gravel · Post Mount on MTB · IS nearly obsolete</text>
    <text x="724" y="393" fill="#2f2f2f" font-size="8.5" text-anchor="end">© C.E. Ravello Joo · carlosravello.com</text>
  </g>
