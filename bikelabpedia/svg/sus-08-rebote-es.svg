  <g font-family="&#39;IBM Plex Mono&#39;, ui-monospace, monospace">
    <rect x="0" y="0" width="760" height="430" rx="14" fill="#050505"></rect>
    <rect x="1" y="1" width="758" height="428" rx="14" fill="none" stroke="#242424" stroke-width="1.5"></rect>
    <text x="40" y="36" fill="#4fb8c8" font-size="11" letter-spacing="2.5">EL REBOTE · POGO vs PACK-DOWN</text>
    <text x="40" y="54" fill="#9a9a9a" font-size="11">BikeLab-pedia // sus-08 · a qué velocidad vuelve la suspensión</text>

    
    
    <rect x="40" y="80" width="220" height="250" rx="10" fill="#0c0c0c" stroke="#d9a44a" stroke-width="1.3"></rect>
    <text x="150" y="104" fill="#d9a44a" font-size="13" text-anchor="middle" font-weight="bold">RÁPIDO</text>
    
    <path d="M64 200 Q90 130 116 200 Q142 250 168 200 Q194 165 220 200" fill="none" stroke="#d9a44a" stroke-width="2.2"></path>
    <text x="150" y="244" fill="#d9a44a" font-size="12" text-anchor="middle" font-weight="bold">pogo</text>
    <text x="150" y="268" fill="#9a9a9a" font-size="10" text-anchor="middle">rebota, te despega</text>
    <text x="150" y="286" fill="#9a9a9a" font-size="10" text-anchor="middle">de la rueda</text>
    <text x="150" y="312" fill="#5a5a5a" font-size="9.5" text-anchor="middle">cierra clics (más lento)</text>

    
    <rect x="270" y="80" width="220" height="250" rx="10" fill="#0c0c0c" stroke="#4fb8c8" stroke-width="1.6"></rect>
    <text x="380" y="104" fill="#4fb8c8" font-size="13" text-anchor="middle" font-weight="bold">ÓPTIMO</text>
    
    <path d="M294 200 Q330 140 366 198 Q400 215 420 205 Q445 200 460 202" fill="none" stroke="#4fb8c8" stroke-width="2.4"></path>
    <text x="380" y="244" fill="#4fb8c8" font-size="12" text-anchor="middle" font-weight="bold">controlado</text>
    <text x="380" y="268" fill="#9a9a9a" font-size="10" text-anchor="middle">vuelve sin rebotar</text>
    <text x="380" y="286" fill="#9a9a9a" font-size="10" text-anchor="middle">la rueda sigue el suelo</text>
    <text x="380" y="312" fill="#5a5a5a" font-size="9.5" text-anchor="middle">zona de trabajo</text>

    
    <rect x="500" y="80" width="220" height="250" rx="10" fill="#0c0c0c" stroke="#d9a44a" stroke-width="1.3"></rect>
    <text x="610" y="104" fill="#d9a44a" font-size="13" text-anchor="middle" font-weight="bold">LENTO</text>
    
    <path d="M524 160 L556 180 Q566 200 576 196 L600 210 Q610 226 620 222 L644 236 Q654 250 664 246 L696 256" fill="none" stroke="#d9a44a" stroke-width="2.2"></path>
    <text x="610" y="244" fill="#d9a44a" font-size="12" text-anchor="middle" font-weight="bold">pack-down</text>
    <text x="610" y="268" fill="#9a9a9a" font-size="10" text-anchor="middle">no recupera entre</text>
    <text x="610" y="286" fill="#9a9a9a" font-size="10" text-anchor="middle">baches seguidos</text>
    <text x="610" y="312" fill="#5a5a5a" font-size="9.5" text-anchor="middle">abre clics (más rápido)</text>

    <text x="380" y="368" fill="#4fb8c8" font-size="12" text-anchor="middle">ajusta el rebote en una bajada con baches seguidos, no en el parking</text>
    <text x="380" y="390" fill="#9a9a9a" font-size="10.5" text-anchor="middle">la liebre = rápido · la tortuga = lento, en casi todos los mandos</text>
    <text x="724" y="416" fill="#3a3a3a" font-size="8.5" text-anchor="end">© C.E. Ravello Joo · carlosravello.com</text>
  </g>
