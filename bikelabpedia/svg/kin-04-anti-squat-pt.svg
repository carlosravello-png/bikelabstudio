<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" role="img" aria-labelledby="t d">
  <title id="t">Anti-squat: o empate entre o peso que afunda e a corrente que sustenta</title>
  <desc id="d">Ao pedalar, a transferência de peso tende a afundar a suspensão; a tensão da corrente tende a resistir a isso. O anti-squat mede o quanto se cancelam: 100% é empate, a suspensão não se move.</desc>
  <metadata><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#"><cc:Work rdf:about=""><dc:title>Anti-squat explicado — BikeLab Studio</dc:title><dc:creator><cc:Agent><dc:title>Carlos Eduardo Ravello Joo · ORCID 0009-0007-5631-7436</dc:title></cc:Agent></dc:creator><dc:publisher>BikeLab Studio — bikelabstudio.com</dc:publisher><dc:source>https://www.bikelabstudio.com/bikelabpedia/o-que-e-anti-squat-pt.html</dc:source><dc:rights>© 2026 BikeLab Studio · Carlos Eduardo Ravello Joo. Licencia CC BY-NC-ND 4.0.</dc:rights><dc:identifier>https://orcid.org/0009-0007-5631-7436</dc:identifier><cc:license rdf:resource="https://creativecommons.org/licenses/by-nc-nd/4.0/"/></cc:Work></rdf:RDF></metadata>
  <style>
    .t{font-family:'IBM Plex Mono',monospace;fill:#cfcfcf;font-size:14px}
    .a{font-family:'IBM Plex Mono',monospace;fill:#4fb8c8;font-size:14px;font-weight:700}
    .g{font-family:'IBM Plex Mono',monospace;fill:#9a9a9a;font-size:13px}
    .susp{stroke:#cfcfcf;stroke-width:4;fill:none}
  </style>
  <!-- title -->
  <text x="380" y="48" text-anchor="middle" class="a" font-size="22">ANTI-SQUAT = quem ganha?</text>
  <!-- suspension element center -->
  <rect x="360" y="120" width="40" height="150" rx="6" class="susp"/>
  <line x1="380" y1="135" x2="380" y2="255" stroke="#555" stroke-width="2" stroke-dasharray="5 5"/>
  <text x="380" y="292" text-anchor="middle" class="t">sua suspensão</text>
  <!-- left: weight pushes down (neutral grey) -->
  <line x1="220" y1="150" x2="220" y2="245" stroke="#888" stroke-width="4" marker-end="url(#dn)"/>
  <text x="220" y="135" text-anchor="middle" class="g">peso ao pedalar</text>
  <text x="220" y="270" text-anchor="middle" class="g" font-weight="700">tende a AFUNDAR</text>
  <line x1="245" y1="195" x2="356" y2="195" stroke="#888" stroke-width="2" marker-end="url(#rt)"/>
  <!-- right: chain pulls up (accent) -->
  <line x1="540" y1="245" x2="540" y2="150" stroke="#4fb8c8" stroke-width="4" marker-end="url(#up)"/>
  <text x="540" y="135" text-anchor="middle" class="a">tensão da corrente</text>
  <text x="540" y="270" text-anchor="middle" class="a">RESISTE ao afundamento</text>
  <line x1="515" y1="195" x2="404" y2="195" stroke="#4fb8c8" stroke-width="2" marker-end="url(#lt)"/>
  <!-- gauge -->
  <text x="380" y="345" text-anchor="middle" class="t">100% = EMPATE → a suspensão não se move ao pedalar</text>
  <text x="380" y="372" text-anchor="middle" class="g">&lt;100% = afunda e "balança" (pedal bob) · &gt;100% = se estica (e mais pedal kickback)</text>
  <defs>
    <marker id="dn" markerWidth="10" markerHeight="10" refX="5" refY="9" orient="auto"><path d="M0,0 L10,0 L5,10 Z" fill="#888"/></marker>
    <marker id="up" markerWidth="10" markerHeight="10" refX="5" refY="1" orient="auto"><path d="M0,10 L10,10 L5,0 Z" fill="#4fb8c8"/></marker>
    <marker id="rt" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L0,10 L10,5 Z" fill="#888"/></marker>
    <marker id="lt" markerWidth="10" markerHeight="10" refX="1" refY="5" orient="auto"><path d="M10,0 L10,10 L0,5 Z" fill="#4fb8c8"/></marker>
  </defs>
  <text x="752" y="425" text-anchor="end" font-family="'IBM Plex Mono',monospace" font-size="10" fill="#333">bikelabstudio.com · C.E. Ravello Joo · CC BY-NC-ND 4.0</text>
</svg>
