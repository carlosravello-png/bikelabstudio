<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" role="img" aria-labelledby="t d">
  <title id="t">High pivot com polia idler</title>
  <desc id="d">O pivô principal fica muito alto, dando uma trajetória do eixo muito para trás que engole os impactos; uma polia idler perto do pivô redireciona a corrente para neutralizar o enorme chain growth e o pedal kickback.</desc>
  <metadata><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#"><cc:Work rdf:about=""><dc:title>High pivot + idler — BikeLab Studio</dc:title><dc:creator><cc:Agent><dc:title>Carlos Eduardo Ravello Joo · ORCID 0009-0007-5631-7436</dc:title></cc:Agent></dc:creator><dc:publisher>BikeLab Studio — bikelabstudio.com</dc:publisher><dc:source>https://www.bikelabstudio.com/bikelabpedia/high-pivot-idler-pt.html</dc:source><dc:rights>© 2026 BikeLab Studio · Carlos Eduardo Ravello Joo. Licencia CC BY 4.0.</dc:rights><dc:identifier>https://orcid.org/0009-0007-5631-7436</dc:identifier><cc:license rdf:resource="https://creativecommons.org/licenses/by/4.0/"/></cc:Work></rdf:RDF></metadata>
  <style>
    .fr{stroke:#cfcfcf;stroke-width:3;fill:none;stroke-linecap:round}
    .arm{stroke:#4fb8c8;stroke-width:4;fill:none;stroke-linecap:round}
    .wh{stroke:#777;stroke-width:3;fill:none}
    .ch{stroke:#cfcfcf;stroke-width:2.5;fill:none}
    .path{stroke:#4fb8c8;stroke-width:2;fill:none;stroke-dasharray:6 6}
    .lab{font-family:'IBM Plex Mono',monospace;fill:#9a9a9a;font-size:13px}
    .key{font-family:'IBM Plex Mono',monospace;fill:#4fb8c8;font-size:13px;font-weight:700}
    .ld{stroke:#3a3a3a;stroke-width:1}
  </style>
  <text x="380" y="38" text-anchor="middle" class="key" font-size="17">HIGH PIVOT + IDLER · pivô alto, polia para a corrente</text>
  <circle class="wh" cx="200" cy="320" r="70"/>
  <line class="fr" x1="440" y1="328" x2="458" y2="170"/>
  <line class="fr" x1="458" y1="170" x2="630" y2="186"/>
  <line class="fr" x1="440" y1="328" x2="640" y2="188"/>
  <circle cx="440" cy="328" r="9" fill="none" stroke="#cfcfcf" stroke-width="3"/>
  <!-- HIGH pivot, well above BB -->
  <circle cx="430" cy="222" r="9" fill="#050505" stroke="#4fb8c8" stroke-width="3"/>
  <line class="ld" x1="430" y1="222" x2="500" y2="150"/>
  <text class="key" x="504" y="146">PIVÔ ALTO</text>
  <text class="lab" x="504" y="164">bem acima do eixo</text>
  <!-- swingarm from high pivot to axle -->
  <line class="arm" x1="430" y1="222" x2="200" y2="320"/>
  <!-- idler pulley near pivot -->
  <circle cx="412" cy="250" r="13" fill="none" stroke="#4fb8c8" stroke-width="2.5"/>
  <circle cx="412" cy="250" r="3" fill="#4fb8c8"/>
  <text class="key" x="300" y="200" text-anchor="middle">IDLER (polia)</text>
  <text class="lab" x="300" y="218" text-anchor="middle">neutraliza o kickback</text>
  <line class="ld" x1="380" y1="232" x2="320" y2="206"/>
  <!-- chain over idler to chainring -->
  <path class="ch" d="M440,322 L412,262 M412,238 L210,322"/>
  <!-- rearward axle path -->
  <circle cx="200" cy="320" r="6" fill="#4fb8c8"/>
  <path class="path" d="M200,320 q -55,-50 -70,-120" marker-end="url(#mr)"/>
  <text class="key" x="120" y="160">AXLE PATH</text>
  <text class="lab" x="120" y="178">muito para trás → engole</text>
  <defs><marker id="mr" markerWidth="9" markerHeight="9" refX="4.5" refY="2" orient="auto"><path d="M0,9 L9,9 L4.5,0 Z" fill="#4fb8c8"/></marker></defs>
  <text x="752" y="425" text-anchor="end" font-family="'IBM Plex Mono',monospace" font-size="10" fill="#333">bikelabstudio.com · C.E. Ravello Joo · CC BY 4.0</text>
</svg>
