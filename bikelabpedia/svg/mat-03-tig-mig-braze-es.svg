  <desc>Tres formas de unir tubos: TIG (electrodo de tungsteno, funde el metal base), MIG (alambre continuo, funde el metal base) y brazing (el aporte fluye por capilaridad, une sin fundir). © Carlos Eduardo Ravello Joo · carlosravello.com</desc>
