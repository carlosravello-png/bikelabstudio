<?xml version="1.0"?>
<svg viewBox="0 0 760 430" xmlns="http://www.w3.org/2000/svg" xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <title>Presión de partida por peso — BikeLab Studio</title>
  <desc>Tabla orientativa de presión de aire de partida según el peso corporal, con la regla PSI aproximadamente igual al peso en libras. © Carlos Eduardo Ravello Joo · carlosravello.com</desc>
  <metadata><RDF xmlns:dc="http://purl.org/dc/elements/1.1/"><Description><creator>Carlos Eduardo Ravello Joo</creator><rights>© 2026 Carlos Eduardo Ravello Joo. Todos los derechos reservados.</rights><publisher>BikeLab Studio</publisher><source>https://carlosravello.com</source><identifier>https://orcid.org/0009-0007-5631-7436</identifier></Description></RDF></metadata>
  <g font-family="&#39;IBM Plex Mono&#39;, ui-monospace, monospace">
    <rect x="0" y="0" width="760" height="430" rx="14" fill="#050505"></rect>
    <rect x="1" y="1" width="758" height="428" rx="14" fill="none" stroke="#242424" stroke-width="1.5"></rect>
    <text x="40" y="36" fill="#4fb8c8" font-size="11" letter-spacing="2.5">PRESIÓN DE PARTIDA POR PESO</text>
    <text x="40" y="54" fill="#9a9a9a" font-size="11">BikeLab-pedia // sus-05 · regla: PSI ≈ peso corporal en libras</text>

    
    
    <rect x="60" y="80" width="640" height="34" rx="6" fill="#0c0c0c" stroke="#3a3a3a" stroke-width="1.2"></rect>
    <text x="140" y="102" fill="#9a9a9a" font-size="12" text-anchor="middle">PESO (kg)</text>
    <text x="340" y="102" fill="#9a9a9a" font-size="12" text-anchor="middle">≈ LIBRAS</text>
    <text x="560" y="102" fill="#4fb8c8" font-size="12" text-anchor="middle">PSI DE PARTIDA</text>

    
    <g font-size="14">
      <line x1="60" y1="150" x2="700" y2="150" stroke="#1a1a1f"></line>
      <text x="140" y="142" fill="#ffffff" text-anchor="middle">60 kg</text>
      <text x="340" y="142" fill="#9a9a9a" text-anchor="middle">~132 lb</text>
      <rect x="470" y="126" width="180" height="20" rx="3" fill="#4fb8c8" fill-opacity="0.12"></rect>
      <text x="560" y="142" fill="#4fb8c8" text-anchor="middle" font-weight="bold">≈ 90 psi</text>

      <line x1="60" y1="186" x2="700" y2="186" stroke="#1a1a1f"></line>
      <text x="140" y="178" fill="#ffffff" text-anchor="middle">70 kg</text>
      <text x="340" y="178" fill="#9a9a9a" text-anchor="middle">~154 lb</text>
      <rect x="470" y="162" width="180" height="20" rx="3" fill="#4fb8c8" fill-opacity="0.12"></rect>
      <text x="560" y="178" fill="#4fb8c8" text-anchor="middle" font-weight="bold">≈ 105 psi</text>

      <line x1="60" y1="222" x2="700" y2="222" stroke="#1a1a1f"></line>
      <text x="140" y="214" fill="#ffffff" text-anchor="middle">80 kg</text>
      <text x="340" y="214" fill="#9a9a9a" text-anchor="middle">~176 lb</text>
      <rect x="470" y="198" width="180" height="20" rx="3" fill="#4fb8c8" fill-opacity="0.12"></rect>
      <text x="560" y="214" fill="#4fb8c8" text-anchor="middle" font-weight="bold">≈ 120 psi</text>

      <text x="140" y="250" fill="#ffffff" text-anchor="middle">90 kg</text>
      <text x="340" y="250" fill="#9a9a9a" text-anchor="middle">~198 lb</text>
      <rect x="470" y="234" width="180" height="20" rx="3" fill="#4fb8c8" fill-opacity="0.12"></rect>
      <text x="560" y="250" fill="#4fb8c8" text-anchor="middle" font-weight="bold">≈ 135 psi</text>
    </g>

    
    <rect x="60" y="282" width="640" height="74" rx="8" fill="#0c0c0c" stroke="#d9a44a" stroke-width="1.3"></rect>
    <rect x="60" y="282" width="5" height="74" fill="#d9a44a"></rect>
    <text x="380" y="312" fill="#d9a44a" font-size="15" font-weight="bold" text-anchor="middle">punto de partida — calíbralo al SAG 15–20%</text>
    <text x="380" y="338" fill="#9a9a9a" font-size="11" text-anchor="middle">la cifra es solo el arranque: el SAG manda · ajusta ±5 psi hasta cuadrarlo</text>

    <text x="380" y="392" fill="#4fb8c8" font-size="12" text-anchor="middle">incluye equipo y mochila en el peso · cada horquilla tiene su tabla oficial</text>
    <text x="724" y="416" fill="#3a3a3a" font-size="8.5" text-anchor="end">© C.E. Ravello Joo · carlosravello.com</text>
  </g>
</svg>