    <text x="430" y="216" fill="#4fb8c8" font-size="9" text-anchor="middle">em pé, neutro</text>
    <text x="360" y="306" fill="#9a9a9a" font-size="9.5" text-anchor="middle">suba sem quicar, desça com cuidado</text>

    <text x="600" y="92" fill="#ffffff" font-size="12" text-anchor="middle">3 · medir e calcular</text>
    <rect x="560" y="106" width="40" height="180" rx="6" fill="#0c0c0c" stroke="#3a3a3a" stroke-width="1.3"></rect>
