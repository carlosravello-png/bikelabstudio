    <text x="150" y="306" fill="#9a9a9a" font-size="9.5" text-anchor="middle">encoste no retentor</text>

    <text x="360" y="92" fill="#ffffff" font-size="12" text-anchor="middle">2 · posição de ataque</text>
    <rect x="340" y="106" width="40" height="180" rx="6" fill="#0c0c0c" stroke="#3a3a3a" stroke-width="1.3"></rect>
