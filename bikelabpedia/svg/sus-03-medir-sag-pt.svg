    <text x="450" y="354" fill="#d9a44a" font-size="12" font-weight="bold">AMORT.</text>
    <text x="610" y="354" fill="#ffffff" font-size="16" font-weight="bold" text-anchor="end">25–30%</text>
    <text x="450" y="374" fill="#9a9a9a" font-size="9.5">a traseira engole mais</text>

    <text x="380" y="410" fill="#4fb8c8" font-size="12" text-anchor="middle">o SAG é o ponto de partida de TODO ajuste · meça-o sempre primeiro</text>
