    <line x1="284" y1="150" x2="314" y2="150" stroke="#5a5a5a" stroke-width="1" stroke-dasharray="3 3"></line>
    <path d="M300 150 h12" stroke="#4fb8c8" stroke-width="1.4" marker-end="url(#ae)"></path>
    
