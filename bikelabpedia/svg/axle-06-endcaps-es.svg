  <title>Convertibilidad del buje: endcaps — BikeLab Studio</title>
  <desc>Despiece simple de un buje con endcaps intercambiables que permiten pasar de 142 a 148 mm con un kit de espaciadores y reposicionando el disco. © Carlos Eduardo Ravello Joo · carlosravello.com</desc>
