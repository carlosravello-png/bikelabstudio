    <text x="40" y="34" fill="#4fb8c8" font-size="11" letter-spacing="2.5">CONVERTIBILIDAD · ENDCAPS</text>
    <text x="40" y="50" fill="#5a5a5a" font-size="11">BikeLab-pedia // axle-06 · despiece del buje</text>

    
