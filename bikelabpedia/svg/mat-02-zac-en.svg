    <text x="380" y="80" fill="#4fb8c8" font-size="11.5" text-anchor="middle">weld bead</text>
    <text x="312" y="182" fill="#b89a5a" font-size="11" text-anchor="middle">HAZ</text>
    <text x="448" y="182" fill="#b89a5a" font-size="11" text-anchor="middle">HAZ</text>
