<svg viewBox="0 0 760 400" xmlns="http://www.w3.org/2000/svg" xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <title>The Heat-Affected Zone (HAZ) — BikeLab Studio</title>
  <desc>Cross-section of a tube joint showing weld bead, HAZ band and base metal, with the strength versus distance-to-bead curve. © Carlos Eduardo Ravello Joo · carlosravello.com</desc>
