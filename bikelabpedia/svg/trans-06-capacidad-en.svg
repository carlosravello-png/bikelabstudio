  <title>Derailleur capacity — BikeLab Studio</title>
  <desc>Visual formula for derailleur capacity: (largest sprocket − smallest) + (largest chainring − smallest), with the 1x12 example of a 10-52T cassette and a 32T ring giving 42T, plus the SS, GS and SGS cage legend. © Carlos Eduardo Ravello Joo · carlosravello.com</desc>
