  <g font-family="&#39;IBM Plex Mono&#39;, ui-monospace, monospace">
    <rect x="0" y="0" width="760" height="400" rx="14" fill="#080808"></rect>
    <rect x="1" y="1" width="758" height="398" rx="14" fill="none" stroke="#242424" stroke-width="1.5"></rect>
    <text x="40" y="34" fill="#4fb8c8" font-size="11" letter-spacing="2.5">DERAILLEUR CAPACITY</text>
    <text x="40" y="50" fill="#5a5a5a" font-size="11">BikeLab-pedia // trans-06 · formula and 1x12 example</text>

    <text x="380" y="100" fill="#e6e6e6" font-size="15" text-anchor="middle">capacity = (largest sprocket − smallest) + (largest ring − smallest)</text>

    <g>
      <rect x="92" y="138" width="240" height="118" rx="8" fill="none" stroke="#3a3a3a" stroke-width="1.4"></rect>
      <text x="212" y="160" fill="#5a5a5a" font-size="11" text-anchor="middle">CASSETTE 10-52T</text>
      <circle cx="150" cy="208" r="34" fill="none" stroke="#e6e6e6" stroke-width="2"></circle>
      <circle cx="150" cy="208" r="14" fill="#151515" stroke="#5f5f5f" stroke-width="1.2"></circle>
      <text x="150" y="256" fill="#8f8f8f" font-size="12" text-anchor="middle">52T</text>
      <circle cx="262" cy="208" r="16" fill="none" stroke="#e6e6e6" stroke-width="2"></circle>
      <circle cx="262" cy="208" r="6" fill="#151515" stroke="#5f5f5f" stroke-width="1.2"></circle>
      <text x="262" y="256" fill="#8f8f8f" font-size="12" text-anchor="middle">10T</text>
      <text x="206" y="180" fill="#5fbecb" font-size="13" text-anchor="middle">52−10</text>
    </g>

    <text x="356" y="214" fill="#e6e6e6" font-size="24" text-anchor="middle">+</text>

    <g>
      <rect x="380" y="138" width="200" height="118" rx="8" fill="none" stroke="#3a3a3a" stroke-width="1.4"></rect>
      <text x="480" y="160" fill="#5a5a5a" font-size="11" text-anchor="middle">SINGLE RING 32T</text>
      <circle cx="480" cy="206" r="30" fill="none" stroke="#e6e6e6" stroke-width="2"></circle>
      <circle cx="480" cy="206" r="11" fill="#151515" stroke="#5f5f5f" stroke-width="1.2"></circle>
      <text x="480" y="252" fill="#8f8f8f" font-size="12" text-anchor="middle">32T (1x)</text>
      <text x="538" y="210" fill="#5fbecb" font-size="13" text-anchor="middle">32−32</text>
    </g>

    <text x="604" y="214" fill="#e6e6e6" font-size="24" text-anchor="middle">=</text>

    <g>
      <rect x="630" y="160" width="100" height="92" rx="8" fill="#16343a" stroke="#4fb8c8" stroke-width="1.6"></rect>
      <text x="680" y="200" fill="#4fb8c8" font-size="34" font-weight="bold" text-anchor="middle">42T</text>
      <text x="680" y="228" fill="#5fbecb" font-size="11" text-anchor="middle">(52−10)+0</text>
    </g>

    <line x1="92" y1="288" x2="668" y2="288" stroke="#2c2c2c" stroke-width="1"></line>
    <text x="92" y="312" fill="#5a5a5a" font-size="11">derailleur cage by capacity:</text>
    <g font-size="12">
      <text x="120" y="338" fill="#e6e6e6">SS</text><text x="150" y="338" fill="#8f8f8f">short</text>
      <text x="300" y="338" fill="#e6e6e6">GS</text><text x="330" y="338" fill="#8f8f8f">medium</text>
      <text x="480" y="338" fill="#e6e6e6">SGS</text><text x="520" y="338" fill="#8f8f8f">long</text>
    </g>
    <rect x="200" y="329" width="40" height="6" fill="#7a7a7a"></rect>
    <rect x="400" y="329" width="70" height="6" fill="#7a7a7a"></rect>
    <rect x="560" y="329" width="100" height="6" fill="#7a7a7a"></rect>

    <text x="380" y="378" fill="#5fbecb" font-size="12" text-anchor="middle">the cage must absorb total capacity · in 1x the ring term is 0</text>
    <text x="724" y="393" fill="#2f2f2f" font-size="8.5" text-anchor="end">© C.E. Ravello Joo · carlosravello.com</text>
  </g>
