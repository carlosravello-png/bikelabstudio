<?xml version="1.0"?>
<svg viewBox="0 0 760 400" xmlns="http://www.w3.org/2000/svg" xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <title>Qué preguntarle al soldador — BikeLab Studio</title>
  <desc>Checklist informativo de cuatro puntos para hablar con el soldador: técnica, material de aporte, purga de argón y tratamiento térmico post-soldadura. © Carlos Eduardo Ravello Joo · carlosravello.com</desc>
  <metadata><RDF xmlns:dc="http://purl.org/dc/elements/1.1/"><Description><creator>Carlos Eduardo Ravello Joo</creator><rights>© 2026 Carlos Eduardo Ravello Joo. Todos los derechos reservados.</rights><publisher>BikeLab Studio</publisher><source>https://carlosravello.com</source><identifier>https://orcid.org/0009-0007-5631-7436</identifier></Description></RDF></metadata>
  <g font-family="&#39;IBM Plex Mono&#39;, ui-monospace, monospace">
    <rect x="0" y="0" width="760" height="400" rx="14" fill="#080808"></rect>
    <rect x="1" y="1" width="758" height="398" rx="14" fill="none" stroke="#242424" stroke-width="1.5"></rect>
    <text x="40" y="34" fill="#4fb8c8" font-size="11" letter-spacing="2.5">QUÉ PREGUNTARLE AL SOLDADOR</text>
    <text x="40" y="50" fill="#5a5a5a" font-size="11">BikeLab-pedia // mat-09 · cuatro preguntas clave</text>

    
    
    <rect x="40" y="80" width="338" height="120" rx="8" fill="#0c0c0c" stroke="#3a3a3a" stroke-width="1.3"></rect>
    <circle cx="78" cy="120" r="18" fill="none" stroke="#4fb8c8" stroke-width="1.6"></circle>
    <text x="78" y="126" fill="#4fb8c8" font-size="16" text-anchor="middle">?</text>
    <text x="112" y="116" fill="#ECECEC" font-size="13" font-weight="bold">¿Qué técnica?</text>
    <text x="112" y="140" fill="#8f8f8f" font-size="11">TIG o brazing — define la unión</text>
    <text x="112" y="168" fill="#5a5a5a" font-size="10">funde el tubo o lo une sin fundir</text>

    
    <rect x="382" y="80" width="338" height="120" rx="8" fill="#0c0c0c" stroke="#3a3a3a" stroke-width="1.3"></rect>
    <circle cx="420" cy="120" r="18" fill="none" stroke="#4fb8c8" stroke-width="1.6"></circle>
    <text x="420" y="126" fill="#4fb8c8" font-size="16" text-anchor="middle">?</text>
    <text x="454" y="116" fill="#ECECEC" font-size="13" font-weight="bold">¿Qué aporte?</text>
    <text x="454" y="140" fill="#8f8f8f" font-size="11">aluminio: 4043 / 5356 · Ti: ER Ti</text>
    <text x="454" y="168" fill="#5a5a5a" font-size="10">resistencia y acabado dependen de él</text>

    
    <rect x="40" y="212" width="338" height="120" rx="8" fill="#0c0c0c" stroke="#3a3a3a" stroke-width="1.3"></rect>
    <circle cx="78" cy="252" r="18" fill="none" stroke="#4fb8c8" stroke-width="1.6"></circle>
    <text x="78" y="258" fill="#4fb8c8" font-size="16" text-anchor="middle">?</text>
    <text x="112" y="248" fill="#ECECEC" font-size="13" font-weight="bold">¿Purga de argón?</text>
    <text x="112" y="272" fill="#8f8f8f" font-size="11">obligatoria en titanio</text>
    <text x="112" y="300" fill="#5a5a5a" font-size="10">interior + exterior, o el cordón se fragiliza</text>

    
    <rect x="382" y="212" width="338" height="120" rx="8" fill="#0c0c0c" stroke="#3a3a3a" stroke-width="1.3"></rect>
    <circle cx="420" cy="252" r="18" fill="none" stroke="#4fb8c8" stroke-width="1.6"></circle>
    <text x="420" y="258" fill="#4fb8c8" font-size="16" text-anchor="middle">?</text>
    <text x="454" y="248" fill="#ECECEC" font-size="13" font-weight="bold">¿Tratamiento térmico?</text>
    <text x="454" y="272" fill="#8f8f8f" font-size="11">post-soldadura en aluminio</text>
    <text x="454" y="300" fill="#5a5a5a" font-size="10">6061 lo exige; 7005 se autotempla</text>

    <text x="380" y="366" fill="#5fbecb" font-size="12" text-anchor="middle">no es para decidir por él: es para entender qué le hace a tu cuadro</text>
    <text x="724" y="394" fill="#2f2f2f" font-size="8.5" text-anchor="end">© C.E. Ravello Joo · carlosravello.com</text>
  </g>
</svg>