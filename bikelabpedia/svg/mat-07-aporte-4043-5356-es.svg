<?xml version="1.0"?>
<svg viewBox="0 0 760 400" xmlns="http://www.w3.org/2000/svg" xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <title>Material de aporte: 4043 vs 5356 — BikeLab Studio</title>
  <desc>Comparación de los dos aportes de aluminio: 4043 (funde más bajo, moja y fluye mejor, cordón oscuro) y 5356 (más resistente, cordón claro, anodiza bien). © Carlos Eduardo Ravello Joo · carlosravello.com</desc>
  <metadata><RDF xmlns:dc="http://purl.org/dc/elements/1.1/"><Description><creator>Carlos Eduardo Ravello Joo</creator><rights>© 2026 Carlos Eduardo Ravello Joo. Todos los derechos reservados.</rights><publisher>BikeLab Studio</publisher><source>https://carlosravello.com</source><identifier>https://orcid.org/0009-0007-5631-7436</identifier></Description></RDF></metadata>
  <g font-family="&#39;IBM Plex Mono&#39;, ui-monospace, monospace">
    <rect x="0" y="0" width="760" height="400" rx="14" fill="#080808"></rect>
    <rect x="1" y="1" width="758" height="398" rx="14" fill="none" stroke="#242424" stroke-width="1.5"></rect>
    <text x="40" y="34" fill="#4fb8c8" font-size="11" letter-spacing="2.5">MATERIAL DE APORTE</text>
    <text x="40" y="50" fill="#5a5a5a" font-size="11">BikeLab-pedia // mat-07 · aluminio 4043 vs 5356</text>

    <line x1="380" y1="74" x2="380" y2="306" stroke="#2c2c2c" stroke-width="1"></line>

    
    <text x="210" y="98" fill="#ECECEC" font-size="14" text-anchor="middle" font-weight="bold">4043</text>
    
    <rect x="110" y="114" width="200" height="22" rx="4" fill="#6a6a72"></rect>
    <text x="210" y="152" fill="#5a5a5a" font-size="9.5" text-anchor="middle">cordón más oscuro</text>
    <text x="70" y="186" fill="#8f8f8f" font-size="11">· para serie 6xxx</text>
    <text x="70" y="210" fill="#8f8f8f" font-size="11">· funde más bajo</text>
    <text x="70" y="234" fill="#4fb8c8" font-size="11">· &#34;moja y fluye&#34; mejor</text>
    <text x="70" y="258" fill="#8f8f8f" font-size="11">· menos fisuración</text>
    <text x="70" y="282" fill="#f0a0a0" font-size="11">· no anodiza bien</text>

    
    <text x="550" y="98" fill="#ECECEC" font-size="14" text-anchor="middle" font-weight="bold">5356</text>
    <rect x="450" y="114" width="200" height="22" rx="4" fill="#c8c8ce"></rect>
    <text x="550" y="152" fill="#5a5a5a" font-size="9.5" text-anchor="middle">cordón más claro / brillante</text>
    <text x="410" y="186" fill="#4fb8c8" font-size="11">· más resistente</text>
    <text x="410" y="210" fill="#8f8f8f" font-size="11">· cordón claro y brillante</text>
    <text x="410" y="234" fill="#4fb8c8" font-size="11">· anodiza bien</text>
    <text x="410" y="258" fill="#8f8f8f" font-size="11">· algo más difícil de fluir</text>
    <text x="410" y="282" fill="#8f8f8f" font-size="11">· estándar en cuadros</text>

    
    <rect x="110" y="320" width="540" height="36" rx="6" fill="#16343a" stroke="#4fb8c8" stroke-width="1.3"></rect>
    <text x="380" y="343" fill="#4fb8c8" font-size="12.5" text-anchor="middle" font-weight="bold">regla: 3 pasadas de 4043 ≈ 1 de 5356 en resistencia al corte</text>

    <text x="380" y="378" fill="#5fbecb" font-size="12" text-anchor="middle">4043 fluye fácil y no fisura; 5356 aguanta más y anodiza</text>
    <text x="724" y="394" fill="#2f2f2f" font-size="8.5" text-anchor="end">© C.E. Ravello Joo · carlosravello.com</text>
  </g>
</svg>