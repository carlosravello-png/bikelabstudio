<title id="t">Reading ETRTO on the sidewall</title>
<desc id="d">ETRTO marking on the tire sidewall (57-622) with callouts: 57 = section width in mm, 622 = bead seat diameter (29&#34;). Equivalence table with 584 (27.5&#34;) and 559 (26&#34;). — © Carlos Eduardo Ravello Joo · BikeLab Studio · CC BY 4.0 · bikelabstudio.com</desc>
