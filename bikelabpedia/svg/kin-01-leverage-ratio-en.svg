  <text x="380" y="70" text-anchor="middle" class="a" font-size="40" font-weight="900">LR = 3 : 1</text>
  <text x="380" y="105" text-anchor="middle" class="d" font-size="15">the wheel has 3× the leverage over the shock</text>
