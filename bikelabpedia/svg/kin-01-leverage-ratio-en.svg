  <polygon points="380,250 360,300 400,300" fill="#2a2a2a" stroke="#4fb8c8" stroke-width="1.5"/>
  <text x="380" y="320" text-anchor="middle" class="d" font-size="13">pivot</text>
  <line x1="120" y1="250" x2="640" y2="250" stroke="#4fb8c8" stroke-width="3"/>
  <circle cx="150" cy="250" r="34" fill="none" stroke="#cfcfcf" stroke-width="3"/>
  <circle cx="150" cy="250" r="5" fill="#cfcfcf"/>
  <text x="150" y="200" text-anchor="middle" class="t" font-size="14">WHEEL</text>
  <line x1="150" y1="300" x2="150" y2="372" stroke="#4fb8c8" stroke-width="2" marker-end="url(#ar)"/>
  <text x="150" y="398" text-anchor="middle" class="a" font-size="20" font-weight="700">3 mm</text>
  <text x="150" y="418" text-anchor="middle" class="d" font-size="12">moves a lot</text>
  <rect x="600" y="234" width="60" height="32" rx="4" fill="none" stroke="#cfcfcf" stroke-width="3"/>
  <line x1="612" y1="250" x2="648" y2="250" stroke="#cfcfcf" stroke-width="2"/>
  <text x="630" y="205" text-anchor="middle" class="t" font-size="14">SHOCK</text>
  <line x1="630" y1="285" x2="630" y2="312" stroke="#4fb8c8" stroke-width="2" marker-end="url(#ar)"/>
  <text x="630" y="338" text-anchor="middle" class="a" font-size="20" font-weight="700">1 mm</text>
