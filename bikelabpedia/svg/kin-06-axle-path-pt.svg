<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" role="img" aria-labelledby="t d">
  <title id="t">Axle path: trajetória do eixo para frente vs para trás</title>
  <desc id="d">Ao comprimir a suspensão, o eixo traseiro pode descrever um arco para frente (aproxima a roda do movimento central) ou para trás (a afasta). A trajetória para trás engole melhor as batidas de canto vivo.</desc>
  <metadata><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#"><cc:Work rdf:about=""><dc:title>Axle path (trajetória do eixo) explicado — BikeLab Studio</dc:title><dc:creator><cc:Agent><dc:title>Carlos Eduardo Ravello Joo · ORCID 0009-0007-5631-7436</dc:title></cc:Agent></dc:creator><dc:publisher>BikeLab Studio — bikelabstudio.com</dc:publisher><dc:source>https://www.bikelabstudio.com/bikelabpedia/axle-path-trajetoria-do-eixo-pt.html</dc:source><dc:rights>© 2026 BikeLab Studio · Carlos Eduardo Ravello Joo. Licencia CC BY 4.0.</dc:rights><dc:identifier>https://orcid.org/0009-0007-5631-7436</dc:identifier><cc:license rdf:resource="https://creativecommons.org/licenses/by/4.0/"/></cc:Work></rdf:RDF></metadata>
  <style>
    .wh{stroke:#777;stroke-width:3;fill:none}
    .ob{fill:#2a2a2a;stroke:#cfcfcf;stroke-width:1.5}
    .fwd{stroke:#888;stroke-width:2.5;fill:none;stroke-dasharray:6 5}
    .rwd{stroke:#4fb8c8;stroke-width:3;fill:none;stroke-dasharray:6 5}
    .t{font-family:'IBM Plex Mono',monospace;fill:#9a9a9a;font-size:13px}
    .a{font-family:'IBM Plex Mono',monospace;fill:#4fb8c8;font-size:14px;font-weight:700}
    .g{font-family:'IBM Plex Mono',monospace;fill:#888;font-size:14px;font-weight:700}
  </style>
  <text x="380" y="44" text-anchor="middle" class="t">para onde a roda viaja quando bate num obstáculo?</text>
  <!-- ground + obstacle -->
  <line x1="60" y1="330" x2="700" y2="330" stroke="#333" stroke-width="2"/>
  <rect class="ob" x="300" y="296" width="34" height="34"/>
  <text x="317" y="356" text-anchor="middle" class="t">canto vivo</text>
  <!-- wheel -->
  <circle class="wh" cx="430" cy="262" r="68"/>
  <circle cx="430" cy="262" r="6" fill="#cfcfcf"/>
  <!-- forward path -->
  <path class="fwd" d="M430,262 q -30,-70 10,-130" marker-end="url(#mf)"/>
  <text x="470" y="120" class="g">PARA FRENTE</text>
  <text x="470" y="140" class="t">aproxima a roda do mov. central · típico</text>
  <!-- rearward path -->
  <path class="rwd" d="M430,262 q -75,-50 -120,-118" marker-end="url(#mr)"/>
  <text x="120" y="120" class="a">PARA TRÁS</text>
  <text x="120" y="140" class="t">a roda desvia da batida · "flutua"</text>
  <defs>
    <marker id="mf" markerWidth="9" markerHeight="9" refX="4.5" refY="2" orient="auto"><path d="M0,9 L9,9 L4.5,0 Z" fill="#888"/></marker>
    <marker id="mr" markerWidth="9" markerHeight="9" refX="4.5" refY="2" orient="auto"><path d="M0,9 L9,9 L4.5,0 Z" fill="#4fb8c8"/></marker>
  </defs>
  <text x="752" y="425" text-anchor="end" font-family="'IBM Plex Mono',monospace" font-size="10" fill="#333">bikelabstudio.com · C.E. Ravello Joo · CC BY 4.0</text>
</svg>
