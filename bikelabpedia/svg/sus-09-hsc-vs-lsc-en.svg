  <g font-family="&#39;IBM Plex Mono&#39;, ui-monospace, monospace">
    <rect x="0" y="0" width="760" height="430" rx="14" fill="#050505"></rect>
    <rect x="1" y="1" width="758" height="428" rx="14" fill="none" stroke="#242424" stroke-width="1.5"></rect>
    <text x="40" y="36" fill="#4fb8c8" font-size="11" letter-spacing="2.5">HSC vs LSC</text>
    <text x="40" y="54" fill="#9a9a9a" font-size="11">BikeLab-pedia // sus-09 · SHAFT speed, not bike speed</text>

    <rect x="40" y="74" width="680" height="34" rx="8" fill="#0c0c0c" stroke="#4fb8c8" stroke-width="1.3"></rect>
    <text x="380" y="96" fill="#4fb8c8" font-size="12.5" text-anchor="middle" font-weight="bold">the axis is how fast the shaft compresses — not how fast you ride</text>

    <rect x="40" y="126" width="340" height="220" rx="10" fill="#0c0c0c" stroke="#3a3a3a" stroke-width="1.3"></rect>
    <text x="64" y="154" fill="#4fb8c8" font-size="14" font-weight="bold">LSC</text>
    <text x="118" y="154" fill="#9a9a9a" font-size="11">low shaft speed</text>
    <line x1="64" y1="164" x2="356" y2="164" stroke="#242424" stroke-width="1"></line>
    <text x="64" y="190" fill="#ffffff" font-size="11.5">· braking (grabbing the brake)</text>
    <text x="64" y="216" fill="#ffffff" font-size="11.5">· cornering loads</text>
    <text x="64" y="242" fill="#ffffff" font-size="11.5">· pumping and pedaling</text>
    <text x="64" y="268" fill="#ffffff" font-size="11.5">· weight transfers</text>
    <text x="64" y="306" fill="#9a9a9a" font-size="10">slow movements that YOU cause</text>
    <text x="64" y="324" fill="#5a5a5a" font-size="9.5">controls dive and support</text>

    <rect x="380" y="126" width="340" height="220" rx="10" fill="#0c0c0c" stroke="#3a3a3a" stroke-width="1.3"></rect>
    <text x="404" y="154" fill="#d9a44a" font-size="14" font-weight="bold">HSC</text>
    <text x="458" y="154" fill="#9a9a9a" font-size="11">high shaft speed</text>
    <line x1="404" y1="164" x2="696" y2="164" stroke="#242424" stroke-width="1"></line>
    <text x="404" y="190" fill="#ffffff" font-size="11.5">· crossing roots</text>
    <text x="404" y="216" fill="#ffffff" font-size="11.5">· rocks and ledges</text>
    <text x="404" y="242" fill="#ffffff" font-size="11.5">· sharp impacts</text>
    <text x="404" y="268" fill="#ffffff" font-size="11.5">· hard landings</text>
    <text x="404" y="306" fill="#9a9a9a" font-size="10">fast hits the TERRAIN delivers</text>
    <text x="404" y="324" fill="#5a5a5a" font-size="9.5">controls abrupt impacts</text>

    <text x="380" y="384" fill="#4fb8c8" font-size="12" text-anchor="middle">a root at 5 km/h moves the shaft faster than a hard brake at 40 km/h</text>
    <text x="724" y="416" fill="#3a3a3a" font-size="8.5" text-anchor="end">© C.E. Ravello Joo · carlosravello.com</text>
  </g>
