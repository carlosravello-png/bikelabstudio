  <title>HSC vs LSC: shaft speed — BikeLab Studio</title>
  <desc>The compression axis is shaft speed, not bike speed: LSC for braking, cornering loads and pumping; HSC for roots, rocks and sharp impacts. © Carlos Eduardo Ravello Joo · carlosravello.com</desc>
