<?xml version="1.0"?>
<svg viewBox="0 0 760 400" xmlns="http://www.w3.org/2000/svg" xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <title>The Boost shift — BikeLab Studio</title>
  <desc>The Boost widening: rear 142 to 148 mm (+3 mm per side) and front 100 to 110 mm (+5 mm per side), with Super Boost 157 as a third step; wider hub flanges give a stiffer wheel and chainline moves 49 to 52 mm. © Carlos Eduardo Ravello Joo · carlosravello.com</desc>
  <metadata><RDF xmlns:dc="http://purl.org/dc/elements/1.1/"><Description><creator>Carlos Eduardo Ravello Joo</creator><rights>© 2026 Carlos Eduardo Ravello Joo. All rights reserved.</rights><publisher>BikeLab Studio</publisher><source>https://carlosravello.com</source></Description></RDF></metadata>
  <g font-family="&#39;IBM Plex Mono&#39;, ui-monospace, monospace">
    <rect x="0" y="0" width="760" height="400" rx="14" fill="#080808"></rect>
    <rect x="1" y="1" width="758" height="398" rx="14" fill="none" stroke="#242424" stroke-width="1.5"></rect>
    <text x="40" y="34" fill="#4fb8c8" font-size="11" letter-spacing="2.5">THE BOOST SHIFT</text>
    <text x="40" y="50" fill="#5a5a5a" font-size="11">BikeLab-pedia // axle-03 · rear hub, front view</text>

    <line x1="380" y1="84" x2="380" y2="300" stroke="#4fb8c8" stroke-width="1" stroke-dasharray="5 5" opacity="0.5"></line>
    <text x="380" y="316" fill="#5a5a5a" font-size="10" text-anchor="middle">center plane</text>

    <g>
      <line x1="259" y1="120" x2="501" y2="120" stroke="#7a7a7a" stroke-width="2"></line>
      <line x1="259" y1="106" x2="259" y2="134" stroke="#7a7a7a" stroke-width="2.4"></line>
      <line x1="501" y1="106" x2="501" y2="134" stroke="#7a7a7a" stroke-width="2.4"></line>
      <text x="540" y="124" fill="#8f8f8f" font-size="12.5">142 mm</text>
      <text x="225" y="124" fill="#5a5a5a" font-size="11" text-anchor="end">before</text>
    </g>
    <g>
      <line x1="254" y1="178" x2="506" y2="178" stroke="#4fb8c8" stroke-width="2.4"></line>
      <line x1="254" y1="162" x2="254" y2="194" stroke="#4fb8c8" stroke-width="2.6"></line>
      <line x1="506" y1="162" x2="506" y2="194" stroke="#4fb8c8" stroke-width="2.6"></line>
      <text x="540" y="182" fill="#4fb8c8" font-size="12.5">148 mm (Boost)</text>
      <text x="225" y="182" fill="#5fbecb" font-size="11" text-anchor="end">Boost</text>
      <path d="M259 178 h-9" stroke="#4fb8c8" stroke-width="1.4" marker-end="url(#al)"></path>
      <path d="M501 178 h9" stroke="#4fb8c8" stroke-width="1.4" marker-end="url(#al)"></path>
      <text x="246" y="208" fill="#4fb8c8" font-size="10.5" text-anchor="middle">+3</text>
      <text x="514" y="208" fill="#4fb8c8" font-size="10.5" text-anchor="middle">+3</text>
    </g>
    <g>
      <line x1="247" y1="240" x2="513" y2="240" stroke="#7a7a7a" stroke-width="2"></line>
      <line x1="247" y1="226" x2="247" y2="254" stroke="#7a7a7a" stroke-width="2.4"></line>
      <line x1="513" y1="226" x2="513" y2="254" stroke="#7a7a7a" stroke-width="2.4"></line>
      <text x="540" y="244" fill="#8f8f8f" font-size="12.5">157 mm (Super Boost)</text>
      <text x="225" y="244" fill="#5a5a5a" font-size="11" text-anchor="end">+9</text>
    </g>

    <rect x="92" y="120" width="2" height="120" fill="#222"></rect>
    <text x="120" y="280" fill="#4fb8c8" font-size="20" font-weight="bold">+6 mm (3 mm/side)</text>

    <line x1="92" y1="328" x2="668" y2="328" stroke="#2c2c2c" stroke-width="1"></line>
    <text x="380" y="350" fill="#8f8f8f" font-size="11.5" text-anchor="middle">wider flanges = stiffer wheel · front 100→110 (+5/side, 15 mm axle) · chainline 49→52 mm</text>

    <text x="380" y="378" fill="#5fbecb" font-size="12" text-anchor="middle">Boost widens the hub to brace the spokes better and gain lateral stiffness</text>
    <text x="724" y="393" fill="#2f2f2f" font-size="8.5" text-anchor="end">© C.E. Ravello Joo · carlosravello.com</text>

    <defs><marker id="al" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0 L6 4 L0 8" fill="none" stroke="#4fb8c8" stroke-width="1.4"></path></marker></defs>
  </g>
</svg>