<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" role="img" aria-labelledby="t d">
  <title id="t">Switch Infinity (Yeti): pivô deslizante vertical</title>
  <desc id="d">A Yeti substitui a bieleta inferior por um trilho vertical sobre o qual um pivô sobe e depois desce no meio do curso, mudando o anti-squat de alto no sag para baixo no fundo.</desc>
  <metadata><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#"><cc:Work rdf:about=""><dc:title>Switch Infinity (Yeti) — BikeLab Studio</dc:title><dc:creator><cc:Agent><dc:title>Carlos Eduardo Ravello Joo · ORCID 0009-0007-5631-7436</dc:title></cc:Agent></dc:creator><dc:publisher>BikeLab Studio — bikelabstudio.com</dc:publisher><dc:source>https://www.bikelabstudio.com/bikelabpedia/switch-infinity-pt.html</dc:source><dc:rights>© 2026 BikeLab Studio · Carlos Eduardo Ravello Joo. Licencia CC BY-NC-ND 4.0.</dc:rights><dc:identifier>https://orcid.org/0009-0007-5631-7436</dc:identifier><cc:license rdf:resource="https://creativecommons.org/licenses/by-nc-nd/4.0/"/></cc:Work></rdf:RDF></metadata>
  <style>
    .fr{stroke:#cfcfcf;stroke-width:3;fill:none;stroke-linecap:round}
    .arm{stroke:#4fb8c8;stroke-width:4;fill:none;stroke-linecap:round}
    .wh{stroke:#777;stroke-width:3;fill:none}
    .sh{stroke:#cfcfcf;stroke-width:7;fill:none;stroke-linecap:round}
    .rail{stroke:#4fb8c8;stroke-width:8;fill:none;stroke-linecap:round;opacity:.35}
    .lab{font-family:'IBM Plex Mono',monospace;fill:#9a9a9a;font-size:13px}
    .key{font-family:'IBM Plex Mono',monospace;fill:#4fb8c8;font-size:13px;font-weight:700}
    .ld{stroke:#3a3a3a;stroke-width:1}
  </style>
  <text x="380" y="40" text-anchor="middle" class="key" font-size="17">SWITCH INFINITY (Yeti) · pivô que sobe e desce num trilho</text>
  <circle class="wh" cx="200" cy="312" r="74"/>
  <line class="fr" x1="455" y1="320" x2="470" y2="160"/>
  <line class="fr" x1="470" y1="160" x2="640" y2="178"/>
  <line class="fr" x1="455" y1="320" x2="648" y2="180"/>
  <circle cx="455" cy="320" r="9" fill="none" stroke="#cfcfcf" stroke-width="3"/>
  <!-- vertical rail near BB -->
  <line class="rail" x1="430" y1="250" x2="430" y2="300"/>
  <line x1="424" y1="250" x2="436" y2="250" stroke="#4fb8c8" stroke-width="2"/>
  <line x1="424" y1="300" x2="436" y2="300" stroke="#4fb8c8" stroke-width="2"/>
  <circle cx="430" cy="276" r="8" fill="#050505" stroke="#4fb8c8" stroke-width="3"/>
  <path d="M446,266 l10,-6 m-10,22 l10,6" stroke="#4fb8c8" stroke-width="2" fill="none"/>
  <text class="key" x="510" y="262">TRILHO VERTICAL</text>
  <text class="lab" x="510" y="280">o pivô sobe e depois desce</text>
  <line class="ld" x1="442" y1="276" x2="506" y2="268"/>
  <!-- swingarm from sliding pivot to axle -->
  <line class="arm" x1="430" y1="276" x2="200" y2="312"/>
  <!-- upper link -->
  <line class="arm" x1="200" y1="312" x2="470" y2="170"/>
  <line class="sh" x1="470" y1="170" x2="445" y2="255"/>
  <circle cx="200" cy="312" r="6" fill="#4fb8c8"/>
  <text x="610" y="320" class="lab">anti-squat alto no</text>
  <text x="610" y="338" class="lab">sag → baixo no fundo</text>
