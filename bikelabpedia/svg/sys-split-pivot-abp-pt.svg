<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" role="img" aria-labelledby="t d">
  <title id="t">Split pivot / ABP: pivô concêntrico ao eixo</title>
  <desc id="d">O split pivot (ABP na Trek) coloca um pivô concêntrico com o eixo da roda traseira, separando a montagem do freio do movimento do eixo para manter a suspensão ativa ao frear.</desc>
  <metadata><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#"><cc:Work rdf:about=""><dc:title>Split pivot / ABP (pivô concêntrico ao eixo) — BikeLab Studio</dc:title><dc:creator><cc:Agent><dc:title>Carlos Eduardo Ravello Joo · ORCID 0009-0007-5631-7436</dc:title></cc:Agent></dc:creator><dc:publisher>BikeLab Studio — bikelabstudio.com</dc:publisher><dc:source>https://www.bikelabstudio.com/bikelabpedia/split-pivot-abp-pt.html</dc:source><dc:rights>© 2026 BikeLab Studio · Carlos Eduardo Ravello Joo. Licencia CC BY-NC-ND 4.0.</dc:rights><dc:identifier>https://orcid.org/0009-0007-5631-7436</dc:identifier><cc:license rdf:resource="https://creativecommons.org/licenses/by-nc-nd/4.0/"/></cc:Work></rdf:RDF></metadata>
  <style>
    .fr{stroke:#cfcfcf;stroke-width:3;fill:none;stroke-linecap:round}
    .arm{stroke:#4fb8c8;stroke-width:4;fill:none;stroke-linecap:round}
    .wh{stroke:#777;stroke-width:3;fill:none}
    .sh{stroke:#cfcfcf;stroke-width:7;fill:none;stroke-linecap:round}
    .lab{font-family:'IBM Plex Mono',monospace;fill:#9a9a9a;font-size:13px}
    .key{font-family:'IBM Plex Mono',monospace;fill:#4fb8c8;font-size:13px;font-weight:700}
    .ld{stroke:#3a3a3a;stroke-width:1}
  </style>
  <text x="380" y="40" text-anchor="middle" class="key" font-size="17">SPLIT PIVOT / ABP · pivô no mesmo eixo da roda</text>
  <circle class="wh" cx="200" cy="312" r="74"/>
  <circle class="wh" cx="660" cy="312" r="74" opacity="0.4"/>
  <line class="fr" x1="430" y1="320" x2="452" y2="160"/>
  <line class="fr" x1="452" y1="160" x2="640" y2="178"/>
  <line class="fr" x1="430" y1="320" x2="648" y2="180"/>
  <circle cx="430" cy="320" r="9" fill="none" stroke="#cfcfcf" stroke-width="3"/>
  <!-- chainstay to axle -->
  <line class="arm" x1="430" y1="320" x2="200" y2="312"/>
  <!-- seatstay from axle up to rocker -->
  <line class="arm" x1="200" y1="312" x2="452" y2="178"/>
  <!-- concentric pivot at axle -->
  <circle cx="200" cy="312" r="14" fill="none" stroke="#4fb8c8" stroke-width="3"/>
  <circle cx="200" cy="312" r="5" fill="#4fb8c8"/>
  <line class="ld" x1="200" y1="312" x2="150" y2="170"/>
  <text class="key" x="120" y="160">PIVÔ = EIXO</text>
  <text class="lab" x="120" y="178">concêntrico à roda</text>
  <!-- brake caliper on seatstay -->
  <rect x="250" y="276" width="20" height="14" rx="2" fill="none" stroke="#cfcfcf" stroke-width="2"/>
  <text class="lab" x="300" y="262" text-anchor="middle">freio no tirante</text>
  <line class="ld" x1="262" y1="282" x2="300" y2="266"/>
  <line class="sh" x1="452" y1="178" x2="436" y2="258"/>
  <text x="600" y="250" class="lab">→ a traseira continua</text>
  <text x="600" y="268" class="lab">ativa ao frear</text>
  <text x="752" y="425" text-anchor="end" font-family="'IBM Plex Mono',monospace" font-size="10" fill="#333">bikelabstudio.com · C.E. Ravello Joo · CC BY-NC-ND 4.0</text>
</svg>
