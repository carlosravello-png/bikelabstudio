<?xml version="1.0"?>
<svg viewBox="0 0 760 430" xmlns="http://www.w3.org/2000/svg" xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <title>Offset e trail — BikeLab Studio</title>
  <desc>Como o offset da suspensão muda o trail e a direção: 44 mm dá mais trail e estabilidade; 51 mm dá menos trail e direção mais ágil. © Carlos Eduardo Ravello Joo · carlosravello.com</desc>
  <metadata><RDF xmlns:dc="http://purl.org/dc/elements/1.1/"><Description><creator>Carlos Eduardo Ravello Joo</creator><rights>© 2026 Carlos Eduardo Ravello Joo. Todos os direitos reservados.</rights><publisher>BikeLab Studio</publisher><source>https://carlosravello.com</source><identifier>https://orcid.org/0009-0007-5631-7436</identifier></Description></RDF></metadata>
  <g font-family="&#39;IBM Plex Mono&#39;, ui-monospace, monospace">
    <rect x="0" y="0" width="760" height="430" rx="14" fill="#050505"></rect>
    <rect x="1" y="1" width="758" height="428" rx="14" fill="none" stroke="#242424" stroke-width="1.5"></rect>
    <text x="40" y="36" fill="#4fb8c8" font-size="11" letter-spacing="2.5">OFFSET E TRAIL</text>
    <text x="40" y="54" fill="#9a9a9a" font-size="11">BikeLab-pedia // sus-10 · geometria da direção</text>

    <text x="200" y="86" fill="#4fb8c8" font-size="12" text-anchor="middle">OFFSET 44 mm</text>
    <line x1="70" y1="320" x2="330" y2="320" stroke="#3a3a3a" stroke-width="1.4"></line>
    <line x1="150" y1="110" x2="250" y2="320" stroke="#9a9a9a" stroke-width="1.2" stroke-dasharray="4 4"></line>
    <line x1="175" y1="160" x2="205" y2="300" stroke="#4fb8c8" stroke-width="2.4"></line>
    <circle cx="205" cy="300" r="20" fill="none" stroke="#ffffff" stroke-width="1.6"></circle>
    <line x1="205" y1="320" x2="250" y2="320" stroke="#d9a44a" stroke-width="2.4"></line>
    <text x="227" y="338" fill="#d9a44a" font-size="10" text-anchor="middle">trail ↑</text>
    <line x1="150" y1="160" x2="175" y2="160" stroke="#4fb8c8" stroke-width="1.4"></line>
    <text x="162" y="150" fill="#4fb8c8" font-size="9" text-anchor="middle">44</text>
    <text x="200" y="364" fill="#ffffff" font-size="11" text-anchor="middle">mais trail</text>
    <text x="200" y="382" fill="#9a9a9a" font-size="10" text-anchor="middle">mais estável em velocidade</text>

    <line x1="380" y1="80" x2="380" y2="390" stroke="#2c2c2c" stroke-width="1"></line>

    <text x="560" y="86" fill="#4fb8c8" font-size="12" text-anchor="middle">OFFSET 51 mm</text>
    <line x1="430" y1="320" x2="690" y2="320" stroke="#3a3a3a" stroke-width="1.4"></line>
    <line x1="510" y1="110" x2="610" y2="320" stroke="#9a9a9a" stroke-width="1.2" stroke-dasharray="4 4"></line>
    <line x1="543" y1="160" x2="585" y2="300" stroke="#4fb8c8" stroke-width="2.4"></line>
    <circle cx="585" cy="300" r="20" fill="none" stroke="#ffffff" stroke-width="1.6"></circle>
    <line x1="585" y1="320" x2="610" y2="320" stroke="#d9a44a" stroke-width="2.4"></line>
    <text x="598" y="338" fill="#d9a44a" font-size="10" text-anchor="middle">trail ↓</text>
    <line x1="510" y1="160" x2="543" y2="160" stroke="#4fb8c8" stroke-width="1.4"></line>
    <text x="526" y="150" fill="#4fb8c8" font-size="9" text-anchor="middle">51</text>
    <text x="560" y="364" fill="#ffffff" font-size="11" text-anchor="middle">menos trail</text>
    <text x="560" y="382" fill="#9a9a9a" font-size="10" text-anchor="middle">direção mais ágil</text>

    <text x="380" y="410" fill="#4fb8c8" font-size="12" text-anchor="middle">mais offset = menos trail = direção mais ágil · menos offset = mais estável</text>
    <text x="724" y="424" fill="#3a3a3a" font-size="8.5" text-anchor="end">© C.E. Ravello Joo · carlosravello.com</text>
  </g>
