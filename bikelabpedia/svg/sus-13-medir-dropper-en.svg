<svg viewBox="0 0 760 470" xmlns="http://www.w3.org/2000/svg" xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <title>Measuring a dropper post — BikeLab Studio</title>
  <desc>The key measurements of a dropper post: overall length, max insertion, stack from collar to rails, travel and seat-tube length, with the formula usable travel = tube depth minus stack. © Carlos Eduardo Ravello Joo · carlosravello.com</desc>
