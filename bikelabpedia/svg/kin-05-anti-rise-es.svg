<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" role="img" aria-labelledby="t d">
  <title id="t">Anti-rise: cómo reacciona la trasera al frenar</title>
  <desc id="d">Al frenar con el freno trasero, el peso se transfiere adelante y la parte trasera tiende a subir (extenderse). El anti-rise mide cuánto lo contrarresta el diseño: alto la mantiene plantada, bajo la deja extenderse.</desc>
  <metadata><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#"><cc:Work rdf:about=""><dc:title>Anti-rise explicado — BikeLab Studio</dc:title><dc:creator><cc:Agent><dc:title>Carlos Eduardo Ravello Joo · ORCID 0009-0007-5631-7436</dc:title></cc:Agent></dc:creator><dc:publisher>BikeLab Studio — bikelabstudio.com</dc:publisher><dc:source>https://www.bikelabstudio.com/bikelabpedia/que-es-el-anti-rise-es.html</dc:source><dc:rights>© 2026 BikeLab Studio · Carlos Eduardo Ravello Joo. Licencia CC BY-NC-ND 4.0.</dc:rights><dc:identifier>https://orcid.org/0009-0007-5631-7436</dc:identifier><cc:license rdf:resource="https://creativecommons.org/licenses/by-nc-nd/4.0/"/></cc:Work></rdf:RDF></metadata>
  <style>
    .t{font-family:'IBM Plex Mono',monospace;fill:#cfcfcf;font-size:14px}
    .a{font-family:'IBM Plex Mono',monospace;fill:#4fb8c8;font-size:14px;font-weight:700}
    .g{font-family:'IBM Plex Mono',monospace;fill:#9a9a9a;font-size:13px}
    .susp{stroke:#cfcfcf;stroke-width:4;fill:none}
  </style>
  <text x="380" y="46" text-anchor="middle" class="a" font-size="22">ANTI-RISE = ¿qué hace la trasera al frenar?</text>
  <!-- suspension center -->
  <rect x="360" y="135" width="40" height="150" rx="6" class="susp"/>
  <text x="380" y="305" text-anchor="middle" class="t">tu suspensión trasera</text>
  <!-- left: braking transfers weight forward -> rear rises (grey, up) -->
  <line x1="220" y1="250" x2="220" y2="150" stroke="#888" stroke-width="4" marker-end="url(#up)"/>
  <text x="220" y="135" text-anchor="middle" class="g">al frenar atrás</text>
  <text x="220" y="275" text-anchor="middle" class="g" font-weight="700">la trasera tiende a SUBIR</text>
  <!-- right: anti-rise keeps it planted (accent, down) -->
  <line x1="540" y1="150" x2="540" y2="250" stroke="#4fb8c8" stroke-width="4" marker-end="url(#dn)"/>
  <text x="540" y="135" text-anchor="middle" class="a">anti-rise</text>
  <text x="540" y="275" text-anchor="middle" class="a">la mantiene PLANTADA</text>
  <!-- bottom -->
  <text x="380" y="350" text-anchor="middle" class="t">ALTO = firme y estable al frenar (menos sensible a baches)</text>
  <text x="380" y="377" text-anchor="middle" class="g">BAJO = se extiende y la geometría sube (más activa)</text>
  <defs>
    <marker id="up" markerWidth="10" markerHeight="10" refX="5" refY="1" orient="auto"><path d="M0,10 L10,10 L5,0 Z" fill="#888"/></marker>
    <marker id="dn" markerWidth="10" markerHeight="10" refX="5" refY="9" orient="auto"><path d="M0,0 L10,0 L5,10 Z" fill="#4fb8c8"/></marker>
  </defs>
  <text x="752" y="425" text-anchor="end" font-family="'IBM Plex Mono',monospace" font-size="10" fill="#333">bikelabstudio.com · C.E. Ravello Joo · CC BY-NC-ND 4.0</text>
</svg>
