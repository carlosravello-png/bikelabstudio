<?xml version="1.0"?>
<svg viewBox="0 0 760 430" xmlns="http://www.w3.org/2000/svg" xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <title>Medir el SAG — BikeLab Studio</title>
  <desc>Cómo medir el SAG: O-ring arriba, ciclista en posición de ataque, medir el hundimiento y calcular el porcentaje; horquilla 15–20%, amortiguador 25–30%. © Carlos Eduardo Ravello Joo · carlosravello.com</desc>
  <metadata><RDF xmlns:dc="http://purl.org/dc/elements/1.1/"><Description><creator>Carlos Eduardo Ravello Joo</creator><rights>© 2026 Carlos Eduardo Ravello Joo. Todos los derechos reservados.</rights><publisher>BikeLab Studio</publisher><source>https://carlosravello.com</source><identifier>https://orcid.org/0009-0007-5631-7436</identifier></Description></RDF></metadata>
  <g font-family="&#39;IBM Plex Mono&#39;, ui-monospace, monospace">
    <rect x="0" y="0" width="760" height="430" rx="14" fill="#050505"></rect>
    <rect x="1" y="1" width="758" height="428" rx="14" fill="none" stroke="#242424" stroke-width="1.5"></rect>
    <text x="40" y="36" fill="#4fb8c8" font-size="11" letter-spacing="2.5">MEDIR EL SAG</text>
    <text x="40" y="54" fill="#9a9a9a" font-size="11">BikeLab-pedia // sus-03 · el hundimiento con tu peso</text>

    
    
    <text x="150" y="92" fill="#ffffff" font-size="12" text-anchor="middle">1 · O-ring arriba</text>
    <rect x="130" y="106" width="40" height="180" rx="6" fill="#0c0c0c" stroke="#3a3a3a" stroke-width="1.3"></rect>
    <rect x="126" y="116" width="48" height="8" rx="4" fill="#d9a44a"></rect>
    <text x="186" y="124" fill="#d9a44a" font-size="9" text-anchor="start">O-ring</text>
    <text x="150" y="306" fill="#9a9a9a" font-size="9.5" text-anchor="middle">baja a la junta</text>

    
    <text x="360" y="92" fill="#ffffff" font-size="12" text-anchor="middle">2 · posición de ataque</text>
    <rect x="340" y="106" width="40" height="180" rx="6" fill="#0c0c0c" stroke="#3a3a3a" stroke-width="1.3"></rect>
    
    <rect x="336" y="176" width="48" height="8" rx="4" fill="#d9a44a"></rect>
    
    <g stroke="#4fb8c8" stroke-width="2" fill="none">
      <circle cx="430" cy="130" r="8"></circle>
      <line x1="430" y1="138" x2="430" y2="168"></line><line x1="430" y1="148" x2="410" y2="162"></line><line x1="430" y1="148" x2="450" y2="160"></line>
      <line x1="430" y1="168" x2="416" y2="196"></line><line x1="430" y1="168" x2="446" y2="196"></line>
    </g>
    <text x="430" y="216" fill="#4fb8c8" font-size="9" text-anchor="middle">de pie, neutral</text>
    <text x="360" y="306" fill="#9a9a9a" font-size="9.5" text-anchor="middle">súbete sin rebotar, baja con cuidado</text>

    
    <text x="600" y="92" fill="#ffffff" font-size="12" text-anchor="middle">3 · medir y calcular</text>
    <rect x="560" y="106" width="40" height="180" rx="6" fill="#0c0c0c" stroke="#3a3a3a" stroke-width="1.3"></rect>
    <rect x="556" y="176" width="48" height="8" rx="4" fill="#d9a44a"></rect>
    
    <line x1="620" y1="120" x2="620" y2="180" stroke="#4fb8c8" stroke-width="1"></line>
    <line x1="614" y1="120" x2="626" y2="120" stroke="#4fb8c8"></line><line x1="614" y1="180" x2="626" y2="180" stroke="#4fb8c8"></line>
    <text x="632" y="154" fill="#4fb8c8" font-size="10">SAG</text>
    <text x="600" y="306" fill="#9a9a9a" font-size="9.5" text-anchor="middle">SAG ÷ recorrido × 100</text>

    
    <rect x="130" y="330" width="280" height="56" rx="8" fill="#0c0c0c" stroke="#4fb8c8" stroke-width="1.3"></rect>
    <text x="150" y="354" fill="#4fb8c8" font-size="12" font-weight="bold">HORQUILLA</text>
    <text x="380" y="354" fill="#ffffff" font-size="16" font-weight="bold" text-anchor="end">15–20%</text>
    <text x="150" y="374" fill="#9a9a9a" font-size="9.5">delante necesita más apoyo</text>

    <rect x="430" y="330" width="200" height="56" rx="8" fill="#0c0c0c" stroke="#d9a44a" stroke-width="1.3"></rect>
    <text x="450" y="354" fill="#d9a44a" font-size="12" font-weight="bold">AMORTIG.</text>
    <text x="610" y="354" fill="#ffffff" font-size="16" font-weight="bold" text-anchor="end">25–30%</text>
    <text x="450" y="374" fill="#9a9a9a" font-size="9.5">atrás traga más</text>

    <text x="380" y="410" fill="#4fb8c8" font-size="12" text-anchor="middle">el SAG es el punto de partida de TODO el reglaje · mídelo siempre primero</text>
    <text x="724" y="424" fill="#3a3a3a" font-size="8.5" text-anchor="end">© C.E. Ravello Joo · carlosravello.com</text>
