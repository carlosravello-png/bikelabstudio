<?xml version="1.0"?>
<svg viewBox="0 0 760 430" xmlns="http://www.w3.org/2000/svg" xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <title>Axle-to-crown (A2C) — BikeLab Studio</title>
  <desc>Medición eje-a-corona de la horquilla: comparación entre rígida y suspensión, con la suspensión medida a sag dinámico, e iguala el A2C al cambiar de horquilla. © Carlos Eduardo Ravello Joo · carlosravello.com</desc>
  <metadata><RDF xmlns:dc="http://purl.org/dc/elements/1.1/"><Description><creator>Carlos Eduardo Ravello Joo</creator><rights>© 2026 Carlos Eduardo Ravello Joo. Todos los derechos reservados.</rights><publisher>BikeLab Studio</publisher><source>https://carlosravello.com</source><identifier>https://orcid.org/0009-0007-5631-7436</identifier></Description></RDF></metadata>
  <g font-family="&#39;IBM Plex Mono&#39;, ui-monospace, monospace">
    <rect x="0" y="0" width="760" height="430" rx="14" fill="#050505"></rect>
    <rect x="1" y="1" width="758" height="428" rx="14" fill="none" stroke="#242424" stroke-width="1.5"></rect>
    <text x="40" y="36" fill="#4fb8c8" font-size="11" letter-spacing="2.5">AXLE-TO-CROWN (A2C)</text>
    <text x="40" y="54" fill="#9a9a9a" font-size="11">BikeLab-pedia // sus-11 · eje → corona define la geometría</text>

    
    <text x="200" y="86" fill="#9a9a9a" font-size="12" text-anchor="middle">RÍGIDA / GRAVEL</text>
    
    <rect x="160" y="100" width="80" height="14" rx="3" fill="#1a1a1a" stroke="#9a9a9a" stroke-width="1.4"></rect>
    <text x="248" y="110" fill="#9a9a9a" font-size="9">corona</text>
    
    <line x1="178" y1="114" x2="190" y2="300" stroke="#9a9a9a" stroke-width="2.2"></line>
    <line x1="222" y1="114" x2="210" y2="300" stroke="#9a9a9a" stroke-width="2.2"></line>
    
    <circle cx="200" cy="300" r="6" fill="#9a9a9a"></circle>
    <text x="252" y="304" fill="#9a9a9a" font-size="9">eje</text>
    
    <line x1="120" y1="107" x2="120" y2="300" stroke="#4fb8c8" stroke-width="1.2"></line>
    <line x1="114" y1="107" x2="126" y2="107" stroke="#4fb8c8"></line><line x1="114" y1="300" x2="126" y2="300" stroke="#4fb8c8"></line>
    <text x="108" y="205" fill="#4fb8c8" font-size="10" text-anchor="middle" transform="rotate(-90 108 205)">A2C estático</text>
    <text x="200" y="330" fill="#ffffff" font-size="10.5" text-anchor="middle">medida fija</text>
    <text x="200" y="348" fill="#9a9a9a" font-size="9.5" text-anchor="middle">no cambia con la carga</text>

    <line x1="380" y1="80" x2="380" y2="360" stroke="#2c2c2c" stroke-width="1"></line>

    
    <text x="560" y="86" fill="#4fb8c8" font-size="12" text-anchor="middle">SUSPENSIÓN</text>
    <rect x="520" y="100" width="80" height="14" rx="3" fill="#1a1a1a" stroke="#4fb8c8" stroke-width="1.4"></rect>
    
    <rect x="538" y="114" width="10" height="90" fill="#4fb8c8" fill-opacity="0.2" stroke="#4fb8c8" stroke-width="1.2"></rect>
    <rect x="572" y="114" width="10" height="90" fill="#4fb8c8" fill-opacity="0.2" stroke="#4fb8c8" stroke-width="1.2"></rect>
    
    <rect x="536" y="204" width="14" height="96" fill="#1a1a1a" stroke="#9a9a9a" stroke-width="1.2"></rect>
    <rect x="570" y="204" width="14" height="96" fill="#1a1a1a" stroke="#9a9a9a" stroke-width="1.2"></rect>
    <circle cx="560" cy="300" r="6" fill="#9a9a9a"></circle>
    
    <rect x="538" y="114" width="44" height="30" fill="#d9a44a" fill-opacity="0.12"></rect>
    <text x="616" y="132" fill="#d9a44a" font-size="9">sag dinámico</text>
    
    <line x1="660" y1="107" x2="660" y2="300" stroke="#4fb8c8" stroke-width="1.2"></line>
    <line x1="654" y1="107" x2="666" y2="107" stroke="#4fb8c8"></line><line x1="654" y1="300" x2="666" y2="300" stroke="#4fb8c8"></line>
    <text x="678" y="205" fill="#4fb8c8" font-size="10" text-anchor="middle" transform="rotate(-90 678 205)">A2C a sag</text>
    <text x="560" y="330" fill="#ffffff" font-size="10.5" text-anchor="middle">mídela hundida al sag</text>
    <text x="560" y="348" fill="#9a9a9a" font-size="9.5" text-anchor="middle">no extendida en el aire</text>

    <text x="380" y="398" fill="#4fb8c8" font-size="12" text-anchor="middle">iguala el A2C al cambiar de horquilla o no respetarás la geometría del cuadro</text>
    <text x="724" y="418" fill="#3a3a3a" font-size="8.5" text-anchor="end">© C.E. Ravello Joo · carlosravello.com</text>
  </g>
