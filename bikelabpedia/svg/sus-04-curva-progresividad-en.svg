<?xml version="1.0"?>
<svg viewBox="0 0 760 430" xmlns="http://www.w3.org/2000/svg" xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <title>Progressivity curve — BikeLab Studio</title>
  <desc>Force versus travel graph comparing a coil spring (straight linear line) with air (progressive curve); a token steepens the curve at the end. © Carlos Eduardo Ravello Joo · carlosravello.com</desc>
  <metadata><RDF xmlns:dc="http://purl.org/dc/elements/1.1/"><Description><creator>Carlos Eduardo Ravello Joo</creator><rights>© 2026 Carlos Eduardo Ravello Joo. All rights reserved.</rights><publisher>BikeLab Studio</publisher><source>https://carlosravello.com</source><identifier>https://orcid.org/0009-0007-5631-7436</identifier></Description></RDF></metadata>
  <g font-family="&#39;IBM Plex Mono&#39;, ui-monospace, monospace">
    <rect x="0" y="0" width="760" height="430" rx="14" fill="#050505"></rect>
    <rect x="1" y="1" width="758" height="428" rx="14" fill="none" stroke="#242424" stroke-width="1.5"></rect>
    <text x="40" y="36" fill="#4fb8c8" font-size="11" letter-spacing="2.5">PROGRESSIVITY CURVE</text>
    <text x="40" y="54" fill="#9a9a9a" font-size="11">BikeLab-pedia // sus-04 · force vs travel</text>

    <g stroke="#1a1a1f" stroke-width="1">
      <line x1="120" y1="140" x2="640" y2="140"></line><line x1="120" y1="190" x2="640" y2="190"></line>
      <line x1="120" y1="240" x2="640" y2="240"></line><line x1="120" y1="290" x2="640" y2="290"></line>
    </g>
    <line x1="120" y1="90" x2="120" y2="340" stroke="#9a9a9a" stroke-width="1.4"></line>
    <line x1="120" y1="340" x2="640" y2="340" stroke="#9a9a9a" stroke-width="1.4"></line>
    <text x="380" y="364" fill="#ffffff" font-size="12" text-anchor="middle">travel →</text>
    <text x="74" y="215" fill="#ffffff" font-size="12" text-anchor="middle" transform="rotate(-90 74 215)">force →</text>
    <text x="116" y="356" fill="#9a9a9a" font-size="9" text-anchor="middle">0%</text>
    <text x="640" y="356" fill="#9a9a9a" font-size="9" text-anchor="middle">100%</text>

    <line x1="120" y1="320" x2="640" y2="150" stroke="#d9a44a" stroke-width="2.6"></line>
    <text x="648" y="150" fill="#d9a44a" font-size="11">coil</text>
    <text x="430" y="222" fill="#d9a44a" font-size="9.5" transform="rotate(-18 430 222)">straight, linear</text>

    <path d="M120,320 C 320,300 480,250 640,110" fill="none" stroke="#4fb8c8" stroke-width="2.6"></path>
    <text x="648" y="112" fill="#4fb8c8" font-size="11">air</text>
    <text x="300" y="300" fill="#4fb8c8" font-size="9.5">progressive curve</text>

    <path d="M120,320 C 320,302 460,260 600,96" fill="none" stroke="#4fb8c8" stroke-width="1.8" stroke-dasharray="5 4" opacity="0.75"></path>
    <text x="556" y="110" fill="#4fb8c8" font-size="9.5" text-anchor="end" opacity="0.9">+ token</text>
    <rect x="560" y="90" width="80" height="250" fill="#4fb8c8" fill-opacity="0.05"></rect>
    <text x="600" y="330" fill="#9a9a9a" font-size="8.5" text-anchor="middle">end of travel</text>

    <text x="380" y="396" fill="#4fb8c8" font-size="12" text-anchor="middle">the coil rises evenly; air firms up at the end and resists bottom-out</text>
    <text x="380" y="416" fill="#9a9a9a" font-size="10" text-anchor="middle">tokens (spacers) steepen that final part without touching SAG</text>
    <text x="724" y="424" fill="#3a3a3a" font-size="8.5" text-anchor="end">© C.E. Ravello Joo · carlosravello.com</text>
  </g>
</svg>