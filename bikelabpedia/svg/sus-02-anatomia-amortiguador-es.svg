<?xml version="1.0"?>
<svg viewBox="0 0 760 430" xmlns="http://www.w3.org/2000/svg" xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <title>Anatomía del amortiguador — BikeLab Studio</title>
  <desc>Corte de un amortiguador trasero: air can con cámara positiva y negativa, cuerpo del damper, anclaje de ojillo frente a trunnion, y las cotas eye-to-eye y stroke. © Carlos Eduardo Ravello Joo · carlosravello.com</desc>
  <metadata><RDF xmlns:dc="http://purl.org/dc/elements/1.1/"><Description><creator>Carlos Eduardo Ravello Joo</creator><rights>© 2026 Carlos Eduardo Ravello Joo. Todos los derechos reservados.</rights><publisher>BikeLab Studio</publisher><source>https://carlosravello.com</source><identifier>https://orcid.org/0009-0007-5631-7436</identifier></Description></RDF></metadata>
  <g font-family="&#39;IBM Plex Mono&#39;, ui-monospace, monospace">
    <rect x="0" y="0" width="760" height="430" rx="14" fill="#050505"></rect>
    <rect x="1" y="1" width="758" height="428" rx="14" fill="none" stroke="#242424" stroke-width="1.5"></rect>
    <text x="40" y="36" fill="#4fb8c8" font-size="11" letter-spacing="2.5">ANATOMÍA DEL AMORTIGUADOR</text>
    <text x="40" y="54" fill="#9a9a9a" font-size="11">BikeLab-pedia // sus-02 · air can | damper | anclajes</text>

    
    
    <circle cx="92" cy="180" r="20" fill="none" stroke="#9a9a9a" stroke-width="2.4"></circle>
    <circle cx="92" cy="180" r="8" fill="#050505" stroke="#9a9a9a" stroke-width="1.4"></circle>
    <text x="92" y="222" fill="#9a9a9a" font-size="9.5" text-anchor="middle">ojillo (eyelet)</text>
    
    <rect x="120" y="158" width="190" height="44" rx="10" fill="#4fb8c8" fill-opacity="0.14" stroke="#4fb8c8" stroke-width="1.4"></rect>
    <text x="170" y="150" fill="#4fb8c8" font-size="9.5" text-anchor="middle">cámara +</text>
    <rect x="120" y="158" width="60" height="44" rx="10" fill="#4fb8c8" fill-opacity="0.10" stroke="#4fb8c8" stroke-width="1" stroke-dasharray="3 3"></rect>
    <text x="150" y="186" fill="#4fb8c8" font-size="8.5" text-anchor="middle">neg</text>
    <text x="250" y="186" fill="#4fb8c8" font-size="9.5" text-anchor="middle">air can</text>
    
    <rect x="310" y="172" width="150" height="16" fill="#d9a44a" fill-opacity="0.18" stroke="#d9a44a" stroke-width="1.4"></rect>
    <text x="385" y="208" fill="#d9a44a" font-size="9.5" text-anchor="middle">cuerpo del damper</text>
    
    <circle cx="486" cy="180" r="20" fill="none" stroke="#9a9a9a" stroke-width="2.4"></circle>
    <circle cx="486" cy="180" r="8" fill="#050505" stroke="#9a9a9a" stroke-width="1.4"></circle>

    
    <line x1="92" y1="250" x2="486" y2="250" stroke="#ffffff" stroke-width="1"></line>
    <line x1="92" y1="244" x2="92" y2="256" stroke="#ffffff"></line><line x1="486" y1="244" x2="486" y2="256" stroke="#ffffff"></line>
    <text x="289" y="270" fill="#ffffff" font-size="11" text-anchor="middle">eye-to-eye (210 mm)</text>
    
    <line x1="310" y1="138" x2="430" y2="138" stroke="#4fb8c8" stroke-width="1"></line>
    <line x1="310" y1="132" x2="310" y2="144" stroke="#4fb8c8"></line><line x1="430" y1="132" x2="430" y2="144" stroke="#4fb8c8"></line>
    <text x="370" y="126" fill="#4fb8c8" font-size="11" text-anchor="middle">stroke (55 mm)</text>

    
    <text x="600" y="120" fill="#ffffff" font-size="12" text-anchor="middle">ANCLAJE: OJILLO vs TRUNNION</text>
    
    <circle cx="560" cy="170" r="14" fill="none" stroke="#9a9a9a" stroke-width="2"></circle>
    <circle cx="560" cy="170" r="5" fill="#050505" stroke="#9a9a9a" stroke-width="1.2"></circle>
    <text x="560" y="202" fill="#9a9a9a" font-size="9.5" text-anchor="middle">ojillo</text>
    <text x="560" y="216" fill="#5a5a5a" font-size="8.5" text-anchor="middle">eje pasante</text>
    
    <rect x="624" y="158" width="56" height="26" rx="5" fill="none" stroke="#d9a44a" stroke-width="1.6"></rect>
    <circle cx="624" cy="171" r="4" fill="#050505" stroke="#d9a44a" stroke-width="1.4"></circle>
    <circle cx="680" cy="171" r="4" fill="#050505" stroke="#d9a44a" stroke-width="1.4"></circle>
    <text x="652" y="202" fill="#d9a44a" font-size="9.5" text-anchor="middle">trunnion</text>
    <text x="652" y="216" fill="#5a5a5a" font-size="8.5" text-anchor="middle">tornillos laterales</text>

    <text x="380" y="306" fill="#9a9a9a" font-size="10.5" text-anchor="middle">trunnion mete los pivotes dentro del can: monta más corto a igual recorrido</text>

    <text x="380" y="402" fill="#4fb8c8" font-size="12" text-anchor="middle">eye-to-eye y stroke definen el amortiguador · el anclaje define el cuadro</text>
    <text x="724" y="420" fill="#3a3a3a" font-size="8.5" text-anchor="end">© C.E. Ravello Joo · carlosravello.com</text>
  </g>
</svg>