<?xml version="1.0"?>
<svg viewBox="0 0 760 470" xmlns="http://www.w3.org/2000/svg" xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <title>Medir una dropper — BikeLab Studio</title>
  <desc>Las medidas clave de una tija telescópica: largo total, inserción máxima, stack del collarín a los rieles, recorrido y largo del tubo de sillín, con la fórmula recorrido útil = profundidad del tubo menos stack. © Carlos Eduardo Ravello Joo · carlosravello.com</desc>
  <metadata><RDF xmlns:dc="http://purl.org/dc/elements/1.1/"><Description><creator>Carlos Eduardo Ravello Joo</creator><rights>© 2026 Carlos Eduardo Ravello Joo. Todos los derechos reservados.</rights><publisher>BikeLab Studio</publisher><source>https://carlosravello.com</source><identifier>https://orcid.org/0009-0007-5631-7436</identifier></Description></RDF></metadata>
  <g font-family="&#39;IBM Plex Mono&#39;, ui-monospace, monospace">
    <rect x="0" y="0" width="760" height="470" rx="14" fill="#050505"></rect>
    <rect x="1" y="1" width="758" height="468" rx="14" fill="none" stroke="#242424" stroke-width="1.5"></rect>
    <text x="40" y="36" fill="#4fb8c8" font-size="11" letter-spacing="2.5">MEDIR UNA DROPPER ★</text>
    <text x="40" y="54" fill="#9a9a9a" font-size="11">BikeLab-pedia // sus-13 · el diagrama clave de la tija telescópica</text>

    
    
    <rect x="150" y="80" width="60" height="300" rx="4" fill="#0c0c0c" stroke="#3a3a3a" stroke-width="1.3"></rect>
    <text x="180" y="398" fill="#5a5a5a" font-size="9.5" text-anchor="middle">tubo de sillín</text>
    
    <rect x="146" y="150" width="68" height="12" rx="3" fill="#1a1a1a" stroke="#9a9a9a" stroke-width="1.2"></rect>
    <text x="120" y="160" fill="#9a9a9a" font-size="9" text-anchor="end">collarín</text>
    
    <rect x="162" y="100" width="36" height="250" rx="4" fill="#4fb8c8" fill-opacity="0.15" stroke="#4fb8c8" stroke-width="1.4"></rect>
    
    <rect x="150" y="92" width="60" height="8" rx="2" fill="#d9a44a"></rect>
    <text x="232" y="98" fill="#d9a44a" font-size="9">rieles</text>
    
    <rect x="170" y="100" width="20" height="56" rx="3" fill="#4fb8c8" fill-opacity="0.3" stroke="#4fb8c8" stroke-width="1"></rect>

    
    
    <line x1="120" y1="100" x2="120" y2="350" stroke="#ffffff" stroke-width="1"></line>
    <line x1="114" y1="100" x2="126" y2="100" stroke="#ffffff"></line><line x1="114" y1="350" x2="126" y2="350" stroke="#ffffff"></line>
    <text x="108" y="225" fill="#ffffff" font-size="10" text-anchor="middle" transform="rotate(-90 108 225)">largo total</text>
    
    <line x1="248" y1="162" x2="248" y2="350" stroke="#4fb8c8" stroke-width="1"></line>
    <line x1="242" y1="162" x2="254" y2="162" stroke="#4fb8c8"></line><line x1="242" y1="350" x2="254" y2="350" stroke="#4fb8c8"></line>
    <text x="262" y="260" fill="#4fb8c8" font-size="10">inserción máxima</text>
    
    <line x1="282" y1="92" x2="282" y2="156" stroke="#d9a44a" stroke-width="1"></line>
    <line x1="276" y1="92" x2="288" y2="92" stroke="#d9a44a"></line><line x1="276" y1="156" x2="288" y2="156" stroke="#d9a44a"></line>
    <text x="296" y="128" fill="#d9a44a" font-size="9.5">stack</text>
    
    <line x1="338" y1="100" x2="338" y2="156" stroke="#4fb8c8" stroke-width="1"></line>
    <line x1="332" y1="100" x2="344" y2="100" stroke="#4fb8c8"></line><line x1="332" y1="156" x2="344" y2="156" stroke="#4fb8c8"></line>
    <text x="352" y="132" fill="#4fb8c8" font-size="10">recorrido (drop)</text>
    
    <line x1="544" y1="162" x2="544" y2="380" stroke="#9a9a9a" stroke-width="1"></line>
    <line x1="538" y1="162" x2="550" y2="162" stroke="#9a9a9a"></line><line x1="538" y1="380" x2="550" y2="380" stroke="#9a9a9a"></line>
    <text x="558" y="275" fill="#9a9a9a" font-size="10">profundidad del tubo</text>
    <line x1="350" y1="380" x2="544" y2="380" stroke="#3a3a3a" stroke-width="1" stroke-dasharray="3 3"></line>

    
    <rect x="350" y="92" width="370" height="70" rx="8" fill="#0c0c0c" stroke="#4fb8c8" stroke-width="1.4"></rect>
    <text x="368" y="116" fill="#4fb8c8" font-size="11" font-weight="bold">FÓRMULA CLAVE</text>
    <text x="368" y="142" fill="#ffffff" font-size="13">recorrido útil = profundidad − stack</text>
    <text x="368" y="156" fill="#9a9a9a" font-size="9">la inserción que cabe limita el drop, no la marca</text>

    
    <rect x="350" y="180" width="370" height="190" rx="8" fill="#0c0c0c" stroke="#3a3a3a" stroke-width="1.2"></rect>
    <text x="368" y="204" fill="#9a9a9a" font-size="10.5">MIDE ESTAS CINCO:</text>
    <text x="368" y="228" fill="#ffffff" font-size="11">① largo total de la tija</text>
    <text x="368" y="252" fill="#ffffff" font-size="11">② inserción máxima (lo que entra)</text>
    <text x="368" y="276" fill="#ffffff" font-size="11">③ stack: collarín → rieles del sillín</text>
    <text x="368" y="300" fill="#ffffff" font-size="11">④ recorrido / drop deseado</text>
    <text x="368" y="324" fill="#ffffff" font-size="11">⑤ profundidad útil del tubo de sillín</text>
    <text x="368" y="352" fill="#d9a44a" font-size="10">ojo con codos / botellas que cortan la inserción</text>

    <text x="380" y="418" fill="#4fb8c8" font-size="12" text-anchor="middle">no compres por drop: comprueba que esa inserción cabe en tu cuadro</text>
    <text x="380" y="440" fill="#9a9a9a" font-size="10" text-anchor="middle">una tija de 200 mm que no inserta del todo no baja 200 mm</text>
    <text x="724" y="458" fill="#3a3a3a" font-size="8.5" text-anchor="end">© C.E. Ravello Joo · carlosravello.com</text>
  </g>
</svg>