  <title>Brake fluid: DOT vs Mineral — BikeLab Studio</title>
  <desc>Comparison of the two circuits: DOT (glycol, hygroscopic, ≈230/260 °C, SRAM/Hayes/Hope) with water dispersed in the fluid, and mineral oil (hydrophobic, ≈170–200 °C, Shimano/Magura/Tektro) with water pooled in the caliper; they don&#39;t mix. © Carlos Eduardo Ravello Joo · carlosravello.com</desc>
