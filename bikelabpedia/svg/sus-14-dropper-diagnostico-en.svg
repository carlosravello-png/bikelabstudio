<?xml version="1.0"?>
<svg viewBox="0 0 760 470" xmlns="http://www.w3.org/2000/svg" xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <title>Dropper post diagnosis — BikeLab Studio</title>
  <desc>Internal anatomy of a dropper post and fault tree: won&#39;t rise, sinks or has side play, with their causes and fixes. © Carlos Eduardo Ravello Joo · carlosravello.com</desc>
  <metadata><RDF xmlns:dc="http://purl.org/dc/elements/1.1/"><Description><creator>Carlos Eduardo Ravello Joo</creator><rights>© 2026 Carlos Eduardo Ravello Joo. All rights reserved.</rights><publisher>BikeLab Studio</publisher><source>https://carlosravello.com</source><identifier>https://orcid.org/0009-0007-5631-7436</identifier></Description></RDF></metadata>
  <g font-family="&#39;IBM Plex Mono&#39;, ui-monospace, monospace">
    <rect x="0" y="0" width="760" height="470" rx="14" fill="#050505"></rect>
    <rect x="1" y="1" width="758" height="468" rx="14" fill="none" stroke="#242424" stroke-width="1.5"></rect>
    <text x="40" y="36" fill="#4fb8c8" font-size="11" letter-spacing="2.5">DROPPER POST DIAGNOSIS</text>
    <text x="40" y="54" fill="#9a9a9a" font-size="11">BikeLab-pedia // sus-14 · internal anatomy + fault tree</text>

    <text x="150" y="86" fill="#9a9a9a" font-size="11" text-anchor="middle">INTERNAL ANATOMY</text>
    <rect x="120" y="100" width="60" height="300" rx="6" fill="#0c0c0c" stroke="#3a3a3a" stroke-width="1.3"></rect>
    <rect x="134" y="120" width="32" height="120" rx="4" fill="#4fb8c8" fill-opacity="0.15" stroke="#4fb8c8" stroke-width="1.3"></rect>
    <text x="196" y="150" fill="#4fb8c8" font-size="9" text-anchor="start">cartridge</text>
    <line x1="166" y1="150" x2="192" y2="150" stroke="#3a3a3a" stroke-width="1"></line>
    <rect x="134" y="240" width="32" height="10" fill="#9a9a9a"></rect>
    <text x="196" y="248" fill="#9a9a9a" font-size="9" text-anchor="start">IFP (floating piston)</text>
    <line x1="166" y1="246" x2="192" y2="246" stroke="#3a3a3a" stroke-width="1"></line>
    <rect x="134" y="250" width="32" height="120" rx="4" fill="#d9a44a" fill-opacity="0.15" stroke="#d9a44a" stroke-width="1.3"></rect>
    <circle cx="150" cy="380" r="5" fill="none" stroke="#d9a44a" stroke-width="1.3"></circle>
    <text x="196" y="384" fill="#d9a44a" font-size="9" text-anchor="start">air valve</text>
    <line x1="166" y1="380" x2="192" y2="380" stroke="#3a3a3a" stroke-width="1"></line>

    <line x1="360" y1="80" x2="360" y2="420" stroke="#2c2c2c" stroke-width="1"></line>

    <text x="400" y="86" fill="#9a9a9a" font-size="11">SYMPTOM → LIKELY CAUSE</text>
    <rect x="400" y="100" width="320" height="92" rx="8" fill="#0c0c0c" stroke="#d9a44a" stroke-width="1.3"></rect>
    <text x="416" y="124" fill="#d9a44a" font-size="12.5" font-weight="bold">won&#39;t rise</text>
    <text x="416" y="146" fill="#ffffff" font-size="10.5">· cable too tight</text>
    <text x="416" y="164" fill="#ffffff" font-size="10.5">· collar torqued &gt; 5 N·m</text>
    <text x="416" y="182" fill="#ffffff" font-size="10.5">· low air pressure (recharge it)</text>
    <rect x="400" y="202" width="320" height="70" rx="8" fill="#0c0c0c" stroke="#d9a44a" stroke-width="1.3"></rect>
    <text x="416" y="226" fill="#d9a44a" font-size="12.5" font-weight="bold">sinks</text>
    <text x="416" y="248" fill="#ffffff" font-size="10.5">· valve / internal seals</text>
    <text x="416" y="266" fill="#ffffff" font-size="10.5">· cartridge to replace</text>
    <rect x="400" y="282" width="320" height="70" rx="8" fill="#0c0c0c" stroke="#d9a44a" stroke-width="1.3"></rect>
    <text x="416" y="306" fill="#d9a44a" font-size="12.5" font-weight="bold">side play</text>
    <text x="416" y="328" fill="#ffffff" font-size="10.5">· worn bushings</text>
    <text x="416" y="346" fill="#ffffff" font-size="10.5">· some adjust with shims</text>

    <text x="380" y="392" fill="#4fb8c8" font-size="12" text-anchor="middle">most faults are cable, collar or pressure — before opening the cartridge</text>
    <text x="380" y="414" fill="#9a9a9a" font-size="10" text-anchor="middle">always start with the cheap, reversible stuff: cable and collar torque</text>
    <text x="724" y="456" fill="#3a3a3a" font-size="8.5" text-anchor="end">© C.E. Ravello Joo · carlosravello.com</text>
  </g>
</svg>