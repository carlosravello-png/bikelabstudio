<text x="40" y="52" font-family="&#39;Inter&#39;, sans-serif" font-size="24" font-weight="800" fill="#e0e0e0">Weight and pressure split</text>
<line x1="80" y1="380" x2="720" y2="380" stroke="#6a6a6a" stroke-width="2"></line>
<circle cx="260" cy="380" r="70" fill="none" stroke="#e0e0e0" stroke-width="2.5"></circle>
<circle cx="560" cy="380" r="70" fill="none" stroke="#e0e0e0" stroke-width="2.5"></circle>
<path d="M260,340 L360,220 L470,220 L560,340 M360,220 L400,140 L440,220 M400,140 L330,290 M360,220 L470,220" fill="none" stroke="#e0e0e0" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"></path>
