<text x="260" y="185" font-family="&#39;IBM Plex Mono&#39;, monospace" font-size="15" font-weight="700" fill="#4fb8c8" text-anchor="middle">~40% (approx.)</text>
<line x1="560" y1="310" x2="560" y2="150" stroke="#4fb8c8" stroke-width="2" marker-end="url(#arrC)"></line>
<text x="560" y="135" font-family="&#39;IBM Plex Mono&#39;, monospace" font-size="15" font-weight="700" fill="#4fb8c8" text-anchor="middle">~60% (approx.)</text>
<text x="260" y="440" font-family="&#39;IBM Plex Mono&#39;, monospace" font-size="14" font-weight="700" fill="#e0e0e0" text-anchor="middle">Front</text>
<text x="560" y="440" font-family="&#39;IBM Plex Mono&#39;, monospace" font-size="14" font-weight="700" fill="#e0e0e0" text-anchor="middle">Rear</text>
<text x="150" y="470" font-family="&#39;IBM Plex Mono&#39;, monospace" font-size="12" font-weight="400" fill="#9a9a9a" text-anchor="start">↓ Lower pressure → grip</text>
<text x="650" y="490" font-family="&#39;IBM Plex Mono&#39;, monospace" font-size="12" font-weight="400" fill="#9a9a9a" text-anchor="end">↑ Higher pressure → load / traction</text>

