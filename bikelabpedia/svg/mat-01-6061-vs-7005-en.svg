<svg viewBox="0 0 760 400" xmlns="http://www.w3.org/2000/svg" xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <title>Aluminium 6061 vs 7005: what changes when welded — BikeLab Studio</title>
  <desc>Comparison of 6061-T6 and 7005-T6 aluminium: strength, HAZ behavior when welded and the need for heat treatment. © Carlos Eduardo Ravello Joo · carlosravello.com</desc>
