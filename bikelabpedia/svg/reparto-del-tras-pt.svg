<text x="560" y="135" font-family="&#39;IBM Plex Mono&#39;, monospace" font-size="15" font-weight="700" fill="#4fb8c8" text-anchor="middle">~60% (aprox.)</text>
<text x="260" y="440" font-family="&#39;IBM Plex Mono&#39;, monospace" font-size="14" font-weight="700" fill="#e0e0e0" text-anchor="middle">Dianteiro</text>
