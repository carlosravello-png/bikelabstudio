<title id="t">Distribuição de peso e pressão</title>
<desc id="d">Silhueta lateral de uma bicicleta com distribuição de peso aproximada (~40% dianteiro / ~60% traseiro) e pressões relativas: dianteira mais baixa para aderência, traseira mais alta para carga e tração. — © Carlos Eduardo Ravello Joo · BikeLab Studio · CC BY 4.0 · bikelabstudio.com</desc>
