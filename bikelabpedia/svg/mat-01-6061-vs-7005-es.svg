  <g font-family="&#39;IBM Plex Mono&#39;, ui-monospace, monospace">
    <rect x="0" y="0" width="760" height="400" rx="14" fill="#080808"></rect>
    <rect x="1" y="1" width="758" height="398" rx="14" fill="none" stroke="#242424" stroke-width="1.5"></rect>
    <text x="40" y="34" fill="#4fb8c8" font-size="11" letter-spacing="2.5">ALUMINIO 6061 vs 7005</text>
    <text x="40" y="50" fill="#5a5a5a" font-size="11">BikeLab-pedia // mat-01 · qué cambia al soldar</text>

    <line x1="380" y1="74" x2="380" y2="330" stroke="#2c2c2c" stroke-width="1"></line>

    
    <text x="210" y="96" fill="#8f8f8f" font-size="13" text-anchor="middle" font-weight="bold">6061-T6</text>
    
    <text x="70" y="128" fill="#5a5a5a" font-size="10.5">resistencia tracción</text>
    <rect x="70" y="134" width="186" height="16" fill="#4fb8c8" fill-opacity="0.85"></rect>
    <text x="264" y="147" fill="#4fb8c8" font-size="12">310 MPa</text>
    <text x="70" y="170" fill="#5a5a5a" font-size="10.5">límite elástico</text>
    <rect x="70" y="176" width="165" height="16" fill="#7a7a7a"></rect>
    <text x="243" y="189" fill="#8f8f8f" font-size="12">275 MPa</text>
    
    <rect x="70" y="214" width="250" height="96" rx="6" fill="#0c0c0c" stroke="#3a3a3a" stroke-width="1.2"></rect>
    <text x="84" y="236" fill="#f0a0a0" font-size="11.5">pierde el temple en la ZAC</text>
    <text x="84" y="258" fill="#8f8f8f" font-size="10.5">solo se restituye con tratamiento</text>
    <text x="84" y="273" fill="#8f8f8f" font-size="10.5">térmico completo:</text>
    <text x="84" y="295" fill="#4fb8c8" font-size="11">solución → temple → envejecer</text>

    
    <text x="550" y="96" fill="#8f8f8f" font-size="13" text-anchor="middle" font-weight="bold">7005-T6</text>
    <text x="410" y="128" fill="#5a5a5a" font-size="10.5">resistencia tracción</text>
    <rect x="410" y="134" width="210" height="16" fill="#4fb8c8" fill-opacity="0.85"></rect>
    <text x="628" y="147" fill="#4fb8c8" font-size="12">350 MPa</text>
    <text x="410" y="170" fill="#5a5a5a" font-size="10.5">límite elástico</text>
    <rect x="410" y="176" width="174" height="16" fill="#7a7a7a"></rect>
    <text x="592" y="189" fill="#8f8f8f" font-size="12">290 MPa</text>
    <rect x="410" y="214" width="250" height="96" rx="6" fill="#0c0c0c" stroke="#4fb8c8" stroke-width="1.3"></rect>
    <text x="424" y="236" fill="#4fb8c8" font-size="11.5">autotemplante al aire</text>
    <text x="424" y="258" fill="#8f8f8f" font-size="10.5">la ZAC recupera ~80% por</text>
    <text x="424" y="273" fill="#8f8f8f" font-size="10.5">envejecimiento natural</text>
    <text x="424" y="295" fill="#8f8f8f" font-size="10.5">(100% si se envejece artificial)</text>

    <text x="380" y="352" fill="#5fbecb" font-size="12" text-anchor="middle">el 7005 perdona la soldadura; el 6061 exige horno después</text>
    <text x="380" y="372" fill="#5a5a5a" font-size="10.5" text-anchor="middle">por eso muchos cuadros soldados sin tratamiento usan 7005</text>
    <text x="724" y="394" fill="#2f2f2f" font-size="8.5" text-anchor="end">© C.E. Ravello Joo · carlosravello.com</text>
  </g>
  <text x="752" y="395.4" text-anchor="end" font-family="'IBM Plex Mono',monospace" font-size="10" fill="#333">bikelabstudio.com · C.E. Ravello Joo · CC BY 4.0</text>
</svg>