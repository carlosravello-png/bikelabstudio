<svg viewBox="0 0 760 400" xmlns="http://www.w3.org/2000/svg" xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <title>Aluminio 6061 vs 7005: qué cambia al soldar — BikeLab Studio</title>
  <desc>Comparación del aluminio 6061-T6 y 7005-T6: resistencia, comportamiento de la ZAC al soldar y necesidad de tratamiento térmico. © Carlos Eduardo Ravello Joo · carlosravello.com</desc>
  <metadata>
