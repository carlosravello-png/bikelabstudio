    <circle cx="72" cy="586" r="12" fill="#34D2FF"></circle><text x="72" y="591" fill="#0E0E12" font-size="13" font-weight="bold" text-anchor="middle">1</text>
    <text x="94" y="583" fill="#ECECEC" font-size="14" font-weight="bold">Manete + cilindro mestre + reservatório</text>
    <text x="94" y="601" fill="#9AA0A6" font-size="12.5">converte a força do dedo em pressão hidráulica</text>

    <circle cx="72" cy="626" r="12" fill="#34D2FF"></circle><text x="72" y="631" fill="#0E0E12" font-size="13" font-weight="bold" text-anchor="middle">2</text>
    <text x="94" y="623" fill="#ECECEC" font-size="14" font-weight="bold">Mangueira</text>
    <text x="94" y="641" fill="#9AA0A6" font-size="12.5">transmite a pressão sem expandir (reforço interno)</text>

    <circle cx="72" cy="666" r="12" fill="#FFB020"></circle><text x="72" y="671" fill="#0E0E12" font-size="13" font-weight="bold" text-anchor="middle">3</text>
    <text x="94" y="663" fill="#ECECEC" font-size="14" font-weight="bold">Pinça</text>
    <text x="94" y="681" fill="#9AA0A6" font-size="12.5">aloja pistões e pastilhas; abraça o rotor</text>

    <circle cx="72" cy="706" r="12" fill="#46E08A"></circle><text x="72" y="711" fill="#0E0E12" font-size="13" font-weight="bold" text-anchor="middle">4</text>
    <text x="94" y="703" fill="#ECECEC" font-size="14" font-weight="bold">Pistões</text>
    <text x="94" y="721" fill="#9AA0A6" font-size="12.5">empurram as pastilhas contra o rotor (Pascal)</text>
  </g>
  
  <g>
    <circle cx="622" cy="586" r="12" fill="#B68CFF"></circle><text x="622" y="591" fill="#0E0E12" font-size="13" font-weight="bold" text-anchor="middle">5</text>
    <text x="644" y="583" fill="#ECECEC" font-size="14" font-weight="bold">Retentores / vedações</text>
    <text x="644" y="601" fill="#9AA0A6" font-size="12.5">vedam a pressão e retraem o pistão (roll-back)</text>

    <circle cx="622" cy="626" r="12" fill="#FFB020"></circle><text x="622" y="631" fill="#0E0E12" font-size="13" font-weight="bold" text-anchor="middle">6</text>
    <text x="644" y="623" fill="#ECECEC" font-size="14" font-weight="bold">Pastilhas</text>
    <text x="644" y="641" fill="#9AA0A6" font-size="12.5">material de atrito que converte movimento em calor</text>

    <circle cx="622" cy="666" r="12" fill="#46E08A"></circle><text x="622" y="671" fill="#0E0E12" font-size="13" font-weight="bold" text-anchor="middle">7</text>
    <text x="644" y="663" fill="#ECECEC" font-size="14" font-weight="bold">Rotor</text>
    <text x="644" y="681" fill="#9AA0A6" font-size="12.5">disco solidário à roda; dissipa o calor ao ar</text>

    <line x1="622" y1="700" x2="1138" y2="700" stroke="#222" stroke-width="1"></line>
    <text x="622" y="719" fill="#E8FF3A" font-size="12.5">Cadeia de pressão: dedo → fluido → pistão → pastilha → rotor → ar.</text>
