<?xml version="1.0"?>
<svg viewBox="0 0 1200 700" width="100%" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" shape-rendering="geometricPrecision">
  <title>Energy doesn&#39;t disappear: it becomes heat — BikeLab Studio</title>
  <desc>Flow of kinetic energy converted into heat at the brake rotor. © Carlos Eduardo Ravello Joo · carlosravello.com</desc>
  <metadata><RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/"><Description><creator>Carlos Eduardo Ravello Joo</creator><rights>© 2026 Carlos Eduardo Ravello Joo. All rights reserved.</rights><publisher>BikeLab Studio</publisher><source>https://carlosravello.com</source><identifier>https://orcid.org/0009-0007-5631-7436</identifier></Description></RDF></metadata>
  <defs>
    
    <radialGradient id="heatGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF5C5C" stop-opacity="0.55"></stop>
      <stop offset="45%" stop-color="#FFB020" stop-opacity="0.26"></stop>
      <stop offset="100%" stop-color="#FFB020" stop-opacity="0"></stop>
    </radialGradient>
    <marker id="arrHeat" markerWidth="12" markerHeight="12" refX="8" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8" fill="none" stroke="#FFB020" stroke-width="1.8"></path>
    </marker>
    <marker id="arrCyan" markerWidth="12" markerHeight="12" refX="8" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8" fill="none" stroke="#34D2FF" stroke-width="1.8"></path>
    </marker>
  </defs>

  <rect x="0" y="0" width="1200" height="700" fill="#0E0E12"></rect>
  <rect x="8.5" y="8.5" width="1183" height="683" fill="none" stroke="#2A2A2A" stroke-width="1"></rect>
  <g stroke="#3A3A3A" stroke-width="1" fill="none">
    <path d="M22 22 H42 M22 22 V42"></path>
    <path d="M1178 22 H1158 M1178 22 V42"></path>
    <path d="M22 678 H42 M22 678 V658"></path>
    <path d="M1178 678 H1158 M1178 678 V658"></path>
  </g>

  <rect x="40" y="34" width="6" height="30" fill="#E8FF3A"></rect>
  <text x="62" y="57" fill="#ECECEC" font-size="25" font-weight="bold" letter-spacing="0.4">Energy doesn&#39;t disappear: it becomes heat</text>
  <text x="62" y="84" fill="#9AA0A6" font-size="15">Conservation of energy in braking · the rider&#39;s kinetic energy ends up as heat in the rotor</text>
  <text x="1160" y="50" fill="#6A6A6A" font-size="12" text-anchor="end" letter-spacing="1">FIG.01 / ENERGY</text>
  <line x1="40" y1="100" x2="1160" y2="100" stroke="#2A2A2A" stroke-width="1"></line>

  <g>
    <rect x="40" y="124" width="372" height="158" rx="2" fill="#121218" stroke="#34D2FF" stroke-width="1.3"></rect>
    <text x="60" y="150" fill="#34D2FF" font-size="13" letter-spacing="1.5">[ KINETIC ENERGY ]</text>
    <circle cx="108" cy="214" r="25" fill="none" stroke="#34D2FF" stroke-width="2.2"></circle>
    <circle cx="200" cy="214" r="25" fill="none" stroke="#34D2FF" stroke-width="2.2"></circle>
    <path d="M108 214 L154 178 L200 214 M154 178 L146 214 M154 178 L154 164" fill="none" stroke="#34D2FF" stroke-width="2.2" stroke-linejoin="round"></path>
    <line x1="108" y1="214" x2="154" y2="214" stroke="#34D2FF" stroke-width="2.2"></line>
    <line x1="242" y1="188" x2="384" y2="188" stroke="#34D2FF" stroke-width="2.2" marker-end="url(#arrCyan)"></line>
    <text x="312" y="178" fill="#9AA0A6" font-size="14" text-anchor="middle" font-style="italic">v</text>
    <text x="312" y="244" fill="#ECECEC" font-size="15" text-anchor="middle">m = 95 kg</text>
    <text x="312" y="266" fill="#ECECEC" font-size="15" text-anchor="middle">v = 40 km/h (11.1 m/s)</text>
  </g>

  <g>
    <line x1="424" y1="203" x2="516" y2="203" stroke="#FFB020" stroke-width="3.2" marker-end="url(#arrHeat)"></line>
    <text x="468" y="191" fill="#FFB020" font-size="12.5" text-anchor="middle" letter-spacing="1.5">CONVERTS</text>
  </g>

  <g>
    <rect x="528" y="124" width="632" height="158" rx="2" fill="#121218" stroke="#FF5C5C" stroke-width="1.3"></rect>
    <text x="548" y="150" fill="#FF5C5C" font-size="13" letter-spacing="1.5">[ HEAT IN THE ROTOR ]</text>
    <circle cx="648" cy="208" r="118" fill="url(#heatGrad)"></circle>
    <circle cx="648" cy="208" r="50" fill="none" stroke="#FFB020" stroke-width="2.6"></circle>
    <circle cx="648" cy="208" r="19" fill="none" stroke="#FFB020" stroke-width="2.2"></circle>
    <g stroke="#FFB020" stroke-width="1.6" opacity="0.85">
      <line x1="648" y1="158" x2="648" y2="178"></line>
      <line x1="648" y1="238" x2="648" y2="258"></line>
      <line x1="598" y1="208" x2="618" y2="208"></line>
      <line x1="678" y1="208" x2="698" y2="208"></line>
      <line x1="612" y1="172" x2="627" y2="187"></line>
      <line x1="669" y1="229" x2="684" y2="244"></line>
      <line x1="684" y1="172" x2="669" y2="187"></line>
      <line x1="627" y1="229" x2="612" y2="244"></line>
    </g>
    <g fill="none" stroke="#FF5C5C" stroke-width="1.5" stroke-dasharray="3 5" opacity="0.7">
      <path d="M732 208 a84 84 0 0 1 -24 60"></path>
      <path d="M752 208 a104 104 0 0 1 -30 74"></path>
    </g>
    <text x="812" y="186" fill="#ECECEC" font-size="17" font-weight="bold">≈ 5.9 kJ per stop</text>
    <text x="812" y="210" fill="#9AA0A6" font-size="14.5">all the energy of motion</text>
    <text x="812" y="230" fill="#9AA0A6" font-size="14.5">dissipates as heat + noise</text>
    <text x="812" y="258" fill="#FFB020" font-size="14.5">friction doesn&#39;t destroy energy:</text>
    <text x="812" y="278" fill="#FFB020" font-size="14.5">it transforms it</text>
  </g>

  <g>
    <rect x="40" y="312" width="545" height="192" rx="2" fill="#121218" stroke="#2A2A2A" stroke-width="1.2"></rect>
    <text x="62" y="340" fill="#9AA0A6" font-size="13" letter-spacing="1.5">[ ENERGY OF ONE STOP ]</text>
    <line x1="62" y1="352" x2="563" y2="352" stroke="#222" stroke-width="1"></line>
    <text x="62" y="402" fill="#34D2FF" font-size="36" font-weight="bold">E = ½ · m · v²</text>
    <text x="62" y="440" fill="#ECECEC" font-size="16">m = 95 kg   v = 11.1 m/s</text>
    <text x="62" y="466" fill="#ECECEC" font-size="16">E = ½ · 95 · 11.1²</text>
    <text x="62" y="494" fill="#46E08A" font-size="18" font-weight="bold">⇒ ≈ 5,900 J  ≈  5.9 kJ</text>
  </g>
  <g>
    <rect x="615" y="312" width="545" height="192" rx="2" fill="#121218" stroke="#2A2A2A" stroke-width="1.2"></rect>
    <text x="637" y="340" fill="#9AA0A6" font-size="13" letter-spacing="1.5">[ POWER ON A SUSTAINED DESCENT ]</text>
    <line x1="637" y1="352" x2="1138" y2="352" stroke="#222" stroke-width="1"></line>
    <text x="637" y="402" fill="#FFB020" font-size="34" font-weight="bold">P = m · g · sinθ · v</text>
    <text x="637" y="440" fill="#ECECEC" font-size="16">95 kg · 10% grade · 30 km/h (8.33 m/s)</text>
    <text x="637" y="466" fill="#ECECEC" font-size="16">P = 95 · 9.81 · 0.0995 · 8.33</text>
    <text x="637" y="494" fill="#FF5C5C" font-size="18" font-weight="bold">⇒ ≈ 770 W continuous</text>
  </g>

  <g>
    <rect x="40" y="524" width="1120" height="96" rx="2" fill="#15110A" stroke="#FFB020" stroke-width="1.5"></rect>
    <rect x="40" y="524" width="5" height="96" fill="#FFB020"></rect>
    <g transform="translate(78,550)" stroke="#FFB020" stroke-width="2.2" fill="none">
      <path d="M6 14 L46 5 a11 11 0 0 1 0 38 L6 35 Z"></path>
      <path d="M19 35 L15 56 L28 56 L26 35"></path>
      <line x1="53" y1="17" x2="66" y2="17"></line>
      <line x1="53" y1="24" x2="68" y2="24"></line>
      <line x1="53" y1="31" x2="66" y2="31"></line>
    </g>
    <text x="168" y="568" fill="#FFB020" font-size="22" font-weight="bold">≈ 770 W = a hair dryer heating your rotor non-stop</text>
    <text x="168" y="598" fill="#C9CDD2" font-size="15">On a long descent the rotor receives that power continuously — that&#39;s why fade appears if it can&#39;t dissipate it.</text>
  </g>

  <text x="1160" y="648" fill="#6A6A6A" font-size="11" text-anchor="end">© Carlos Eduardo Ravello Joo · carlosravello.com</text>
</svg>