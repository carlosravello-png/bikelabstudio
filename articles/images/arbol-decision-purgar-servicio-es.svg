  <defs>
    <marker id="agn" markerWidth="12" markerHeight="12" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#46E08A" stroke-width="1.8"></path></marker>
    <marker id="arr" markerWidth="12" markerHeight="12" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#FF5C5C" stroke-width="1.8"></path></marker>
    <marker id="agy" markerWidth="12" markerHeight="12" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#9AA0A6" stroke-width="1.8"></path></marker>
  </defs>

  <rect x="0" y="0" width="1200" height="760" fill="#0E0E12"></rect>
  <rect x="8.5" y="8.5" width="1183" height="743" fill="none" stroke="#2A2A2A" stroke-width="1"></rect>
  <g stroke="#3A3A3A" stroke-width="1" fill="none">
    <path d="M22 22 H42 M22 22 V42"></path><path d="M1178 22 H1158 M1178 22 V42"></path>
    <path d="M22 738 H42 M22 738 V718"></path><path d="M1178 738 H1158 M1178 738 V718"></path>
  </g>

  <rect x="40" y="34" width="6" height="30" fill="#E8FF3A"></rect>
  <text x="62" y="57" fill="#ECECEC" font-size="25" font-weight="bold">¿Purgar o servicio completo?</text>
  <text x="62" y="84" fill="#9AA0A6" font-size="15">Árbol de decisión · el síntoma no basta: lo que decide es el estado real del fluido y los pistones</text>
  <text x="1160" y="50" fill="#6A6A6A" font-size="12" text-anchor="end" letter-spacing="1">FIG.08 / DECISIÓN</text>
  <line x1="40" y1="100" x2="1160" y2="100" stroke="#2A2A2A" stroke-width="1"></line>

  
  <g fill="none">
    <line x1="310" y1="176" x2="310" y2="202" stroke="#9AA0A6" stroke-width="1.6" marker-end="url(#agy)"></line>
    <line x1="470" y1="252" x2="558" y2="252" stroke="#46E08A" stroke-width="1.8" marker-end="url(#agn)"></line>
    <line x1="310" y1="300" x2="310" y2="354" stroke="#9AA0A6" stroke-width="1.6" marker-end="url(#agy)"></line>
    <line x1="480" y1="404" x2="558" y2="404" stroke="#FF5C5C" stroke-width="1.8" marker-end="url(#arr)"></line>
    <line x1="310" y1="452" x2="310" y2="506" stroke="#9AA0A6" stroke-width="1.6" marker-end="url(#agy)"></line>
  </g>
  <text x="500" y="244" fill="#46E08A" font-size="13" font-weight="bold">SÍ</text>
  <text x="324" y="332" fill="#9AA0A6" font-size="13" font-weight="bold">NO</text>
  <text x="510" y="396" fill="#FF5C5C" font-size="13" font-weight="bold">SÍ</text>
  <text x="324" y="486" fill="#9AA0A6" font-size="13" font-weight="bold">NO</text>

  
  <rect x="140" y="124" width="340" height="52" rx="2" fill="#121218" stroke="#9AA0A6" stroke-width="1.4"></rect>
  <text x="156" y="146" fill="#9AA0A6" font-size="10.5" letter-spacing="1.5">[ SÍNTOMA ]</text>
  <text x="310" y="162" fill="#ECECEC" font-size="14" text-anchor="middle">Maneta esponjosa o frenada larga</text>

  
  <polygon points="310,204 470,252 310,300 150,252" fill="#121218" stroke="#46E08A" stroke-width="1.5"></polygon>
  <text x="310" y="240" fill="#ECECEC" font-size="13" text-anchor="middle">¿SIN fugas, fluido</text>
  <text x="310" y="257" fill="#ECECEC" font-size="13" text-anchor="middle">limpio y pistones</text>
  <text x="310" y="274" fill="#ECECEC" font-size="13" text-anchor="middle">libres?</text>

  
  <polygon points="310,356 484,404 310,452 136,404" fill="#121218" stroke="#FF5C5C" stroke-width="1.5"></polygon>
  <text x="310" y="392" fill="#ECECEC" font-size="13" text-anchor="middle">¿Fluido oscuro / pistón</text>
  <text x="310" y="409" fill="#ECECEC" font-size="13" text-anchor="middle">pegado / fuga / óxido</text>
  <text x="310" y="426" fill="#ECECEC" font-size="13" text-anchor="middle">/ &gt; 2 años?</text>

  
  <rect x="140" y="508" width="340" height="76" rx="2" fill="#0A1622" stroke="#34D2FF" stroke-width="1.3"></rect>
  <text x="156" y="532" fill="#34D2FF" font-size="10.5" letter-spacing="1.5">[ SIN SÍNTOMA CLARO ]</text>
  <text x="156" y="552" fill="#ECECEC" font-size="13">Revisa el tacto en la próxima salida.</text>
  <text x="156" y="572" fill="#9AA0A6" font-size="12.5">No abras el sistema sin motivo.</text>

  
  <rect x="560" y="214" width="580" height="76" rx="2" fill="#0A1410" stroke="#46E08A" stroke-width="1.6"></rect>
  <rect x="560" y="214" width="5" height="76" fill="#46E08A"></rect>
  <text x="584" y="244" fill="#46E08A" font-size="20" font-weight="bold">PURGAR</text>
  <text x="584" y="268" fill="#C9CDD2" font-size="13.5">Purga de fluido: recupera el tacto y repone el punto de</text>
  <text x="584" y="285" fill="#C9CDD2" font-size="13.5">ebullición. Mantenimiento anual de rutina.</text>

  
  <rect x="560" y="358" width="580" height="92" rx="2" fill="#1A0F0F" stroke="#FF5C5C" stroke-width="1.6"></rect>
  <rect x="560" y="358" width="5" height="92" fill="#FF5C5C"></rect>
  <text x="584" y="388" fill="#FF5C5C" font-size="20" font-weight="bold">SERVICIO COMPLETO + KIT DE SELLOS</text>
  <text x="584" y="414" fill="#C9CDD2" font-size="13.5">Despiece, limpieza de pistones, sellos/retenes nuevos y</text>
  <text x="584" y="432" fill="#C9CDD2" font-size="13.5">sangrado completo. Aquí una purga sola NO resuelve.</text>

  
  <g>
    <rect x="40" y="620" width="1120" height="84" rx="2" fill="#15110A" stroke="#FFB020" stroke-width="1.5"></rect>
    <rect x="40" y="620" width="5" height="84" fill="#FFB020"></rect>
    <g transform="translate(74,640)" stroke="#FFB020" stroke-width="2" fill="none">
      <path d="M22 2 L42 40 L2 40 Z"></path><line x1="22" y1="16" x2="22" y2="29"></line><circle cx="22" cy="35" r="1.4" fill="#FFB020"></circle>
    </g>
    <text x="132" y="656" fill="#FFB020" font-size="19" font-weight="bold">Purgar sin limpiar reinyecta contaminantes — y mata pinza y maneta</text>
    <text x="132" y="684" fill="#C9CDD2" font-size="14">Si el fluido está oscuro o hay óxido, el sangrado solo empuja la suciedad por todo el circuito. Limpia primero, purga después.</text>
  </g>

