  <defs>
    
    <marker id="arrCy" markerWidth="12" markerHeight="12" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#34D2FF" stroke-width="1.8"></path></marker>
    <marker id="arrGn" markerWidth="12" markerHeight="12" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#46E08A" stroke-width="1.8"></path></marker>
  </defs>

  <rect x="0" y="0" width="1200" height="700" fill="#0E0E12"></rect>
  <rect x="8.5" y="8.5" width="1183" height="683" fill="none" stroke="#2A2A2A" stroke-width="1"></rect>
  <g stroke="#3A3A3A" stroke-width="1" fill="none">
    <path d="M22 22 H42 M22 22 V42"></path><path d="M1178 22 H1158 M1178 22 V42"></path>
    <path d="M22 678 H42 M22 678 V658"></path><path d="M1178 678 H1158 M1178 678 V658"></path>
  </g>

  <rect x="40" y="34" width="6" height="30" fill="#E8FF3A"></rect>
  <text x="62" y="57" fill="#ECECEC" font-size="25" font-weight="bold">Why your finger stops 100 kg</text>
  <text x="62" y="84" fill="#9AA0A6" font-size="15">Hydraulic advantage · Pascal&#39;s principle: pressure is equal throughout the circuit, force is multiplied by area</text>
  <text x="1160" y="50" fill="#6A6A6A" font-size="12" text-anchor="end" letter-spacing="1">FIG.02 / PASCAL</text>
  <line x1="40" y1="100" x2="1160" y2="100" stroke="#2A2A2A" stroke-width="1"></line>

  <rect x="40" y="118" width="1120" height="226" rx="2" fill="#121218" stroke="#2A2A2A" stroke-width="1.2"></rect>
  <text x="62" y="144" fill="#34D2FF" font-size="13" letter-spacing="1.2">[ LEVER SIDE · small piston Ø11 mm ]</text>
  <text x="1138" y="144" fill="#46E08A" font-size="13" letter-spacing="1.2" text-anchor="end">[ CALIPER SIDE · 4 pistons Ø18 mm ]</text>

  <g>
    <circle cx="96" cy="300" r="6" fill="#34D2FF"></circle>
    <line x1="96" y1="300" x2="250" y2="232" stroke="#34D2FF" stroke-width="4" stroke-linecap="round"></line>
    <line x1="210" y1="180" x2="210" y2="236" stroke="#34D2FF" stroke-width="2.4" marker-end="url(#arrCy)"></line>
    <text x="210" y="172" fill="#34D2FF" font-size="14" text-anchor="middle" font-weight="bold">F lever</text>
    <text x="210" y="158" fill="#9AA0A6" font-size="12" text-anchor="middle">(your finger)</text>
  </g>

  <g>
    <rect x="252" y="252" width="120" height="40" rx="2" fill="#0E0E12" stroke="#34D2FF" stroke-width="1.6"></rect>
    <rect x="252" y="252" width="34" height="40" fill="#34D2FF" fill-opacity="0.28"></rect>
    <line x1="286" y1="252" x2="286" y2="292" stroke="#34D2FF" stroke-width="2"></line>
    <rect x="276" y="214" width="64" height="30" rx="2" fill="#0E0E12" stroke="#34D2FF" stroke-width="1.3"></rect>
    <text x="308" y="234" fill="#34D2FF" font-size="11" text-anchor="middle">reservoir</text>
    <text x="312" y="312" fill="#9AA0A6" font-size="12" text-anchor="middle">master cylinder</text>
    <text x="312" y="328" fill="#ECECEC" font-size="12.5" text-anchor="middle">A = 95 mm²</text>
  </g>

  <g>
    <line x1="372" y1="272" x2="700" y2="272" stroke="#34D2FF" stroke-width="7" stroke-linecap="round" opacity="0.55"></line>
    <line x1="372" y1="272" x2="700" y2="272" stroke="#34D2FF" stroke-width="2.4" stroke-dasharray="2 8"></line>
    <text x="536" y="260" fill="#E8FF3A" font-size="13" text-anchor="middle" font-weight="bold">P constant (Pascal)</text>
    <text x="536" y="296" fill="#9AA0A6" font-size="12" text-anchor="middle">incompressible fluid · same pressure throughout the circuit</text>
  </g>

  <g>
    <rect x="884" y="180" width="20" height="150" fill="#3A3A3A"></rect>
    <rect x="884" y="180" width="20" height="150" fill="none" stroke="#6A6A6A" stroke-width="1"></rect>
    <text x="894" y="350" fill="#9AA0A6" font-size="12" text-anchor="middle">rotor</text>
    <rect x="724" y="196" width="86" height="118" rx="3" fill="#0E0E12" stroke="#46E08A" stroke-width="1.6"></rect>
    <rect x="970" y="196" width="86" height="118" rx="3" fill="#0E0E12" stroke="#46E08A" stroke-width="1.6"></rect>
    <g fill="#46E08A" fill-opacity="0.3" stroke="#46E08A" stroke-width="1.6"><circle cx="792" cy="228" r="20"></circle><circle cx="792" cy="282" r="20"></circle></g>
    <g fill="#46E08A" fill-opacity="0.3" stroke="#46E08A" stroke-width="1.6"><circle cx="988" cy="228" r="20"></circle><circle cx="988" cy="282" r="20"></circle></g>
    <rect x="858" y="190" width="22" height="130" fill="#46E08A" fill-opacity="0.18" stroke="#46E08A" stroke-width="1.2"></rect>
    <rect x="908" y="190" width="22" height="130" fill="#46E08A" fill-opacity="0.18" stroke="#46E08A" stroke-width="1.2"></rect>
    <line x1="828" y1="255" x2="854" y2="255" stroke="#46E08A" stroke-width="3" marker-end="url(#arrGn)"></line>
    <line x1="960" y1="255" x2="934" y2="255" stroke="#46E08A" stroke-width="3" marker-end="url(#arrGn)"></line>
    <text x="894" y="160" fill="#46E08A" font-size="14" text-anchor="middle" font-weight="bold">F caliper</text>
    <text x="894" y="332" fill="#ECECEC" font-size="12.5" text-anchor="middle">A = 1018 mm²</text>
  </g>

  <g>
    <rect x="40" y="358" width="545" height="166" rx="2" fill="#121218" stroke="#2A2A2A" stroke-width="1.2"></rect>
    <text x="62" y="384" fill="#9AA0A6" font-size="13" letter-spacing="1.5">[ HYDRAULIC MULTIPLICATION LAW ]</text>
    <line x1="62" y1="396" x2="563" y2="396" stroke="#222" stroke-width="1"></line>
    <text x="62" y="448" fill="#ECECEC" font-size="26" font-weight="bold">F</text>
    <text x="78" y="455" fill="#46E08A" font-size="16">caliper</text>
    <text x="158" y="448" fill="#ECECEC" font-size="26">/ F</text>
    <text x="198" y="455" fill="#34D2FF" font-size="16">lever</text>
    <text x="258" y="448" fill="#ECECEC" font-size="26" font-weight="bold">=</text>
    <text x="290" y="448" fill="#46E08A" font-size="26" font-weight="bold">A caliper</text>
    <line x1="290" y1="458" x2="430" y2="458" stroke="#ECECEC" stroke-width="2"></line>
    <text x="290" y="484" fill="#34D2FF" font-size="26" font-weight="bold">A master</text>
    <text x="62" y="510" fill="#9AA0A6" font-size="13.5">same pressure P · force scales with piston area</text>
  </g>
  <g>
    <rect x="615" y="358" width="545" height="166" rx="2" fill="#121218" stroke="#2A2A2A" stroke-width="1.2"></rect>
    <text x="637" y="384" fill="#9AA0A6" font-size="13" letter-spacing="1.5">[ THE MATH ]</text>
    <line x1="637" y1="396" x2="1138" y2="396" stroke="#222" stroke-width="1"></line>
    <text x="637" y="426" fill="#34D2FF" font-size="16">A master = π · (5.5)²  ≈  95 mm²</text>
    <text x="637" y="454" fill="#46E08A" font-size="16">A caliper = 4 · π · (9)²  ≈  1018 mm²</text>
    <text x="637" y="486" fill="#ECECEC" font-size="16">ratio = 1018 / 95</text>
    <text x="637" y="514" fill="#E8FF3A" font-size="20" font-weight="bold">⇒ × 10.7 hydraulic multiplication</text>
  </g>

  <g>
    <rect x="40" y="540" width="1120" height="92" rx="2" fill="#0A1410" stroke="#46E08A" stroke-width="1.5"></rect>
    <rect x="40" y="540" width="5" height="92" fill="#46E08A"></rect>
    <text x="72" y="580" fill="#46E08A" font-size="21" font-weight="bold">Your finger is multiplied ×10.7 by hydraulics alone — plus the lever&#39;s mechanical advantage</text>
    <text x="72" y="610" fill="#C9CDD2" font-size="15">The area ratio (not brute force) is what turns a fingertip tap into hundreds of newtons on the rotor.</text>
  </g>

