<svg viewBox="0 0 800 750" xmlns="http://www.w3.org/2000/svg" shape-rendering="geometricPrecision">
  <metadata>
    <rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#"
             xmlns:dc="http://purl.org/dc/elements/1.1/"
             xmlns:dcterms="http://purl.org/dc/terms/"
             xmlns:cc="http://creativecommons.org/ns#">
      <rdf:Description rdf:about="https://www.bikelabstudio.com/articles/images/di2-component-isolation-sequence.svg">
        <dc:title>Di2 Component Isolation Sequence for Battery Drain Diagnosis</dc:title>
        <dc:title xml:lang="es">Secuencia de Aislamiento de Componentes Di2 — Diagnóstico de Descarga</dc:title>
        <dc:creator>Carlos Eduardo Ravello Joo</dc:creator>
        <dc:publisher>BikeLab Studio</dc:publisher>
        <dc:description>Numbered isolation sequence: which Di2 component to disconnect first, sleep current thresholds, time per step. No SM-PCE02. BikeLab Studio.</dc:description>
        <dc:subject>di2 isolation protocol, shimano di2 diagnosis, battery drain, BikeLab Studio</dc:subject>
        <dc:date>2026-05-30</dc:date>
        <dc:rights>© 2026 Carlos Eduardo Ravello Joo. CC BY 4.0.</dc:rights>
        <dc:identifier>https://orcid.org/0009-0007-5631-7436</dc:identifier>
        <dcterms:license rdf:resource="https://creativecommons.org/licenses/by/4.0/"/>
        <cc:attributionName>Carlos Eduardo Ravello Joo — BikeLab Studio</cc:attributionName>
        <cc:attributionURL rdf:resource="https://carlosravello.com"/>
      </rdf:Description>
    </rdf:RDF>
  </metadata>

      <defs>
      
        <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
          <path d="M28 0 H0 V28" fill="none" stroke="#151515" stroke-width="1"></path>
        </pattern>
        <marker id="arr" markerWidth="9" markerHeight="9" refX="6.5" refY="3" orient="auto">
          <path d="M0 0 L6.5 3 L0 6" fill="none" stroke="#8a8a8a" stroke-width="1.2"></path>
        </marker>
      </defs>

      
      <rect x="0" y="0" width="800" height="750" fill="#0a0a0a"></rect>
      <rect x="0" y="0" width="800" height="750" fill="url(#grid)"></rect>
      <rect x="0.5" y="0.5" width="799" height="749" fill="none" stroke="#2a2a2a" stroke-width="1"></rect>
      <g stroke="#555" stroke-width="1" fill="none">
        <path d="M14 14 H30 M14 14 V30"></path>
        <path d="M786 14 H770 M786 14 V30"></path>
        <path d="M14 736 H30 M14 736 V720"></path>
        <path d="M786 736 H770 M786 736 V720"></path>
      </g>

      
      <text x="30" y="42" fill="#f2f2f2" font-size="14" letter-spacing="2.5" font-weight="bold">COMPONENT ISOLATION SEQUENCE // DI2 DRAIN DIAGNOSIS</text>
      <line x1="30" y1="54" x2="770" y2="54" stroke="#3a3a3a" stroke-width="1"></line>
      <text x="770" y="42" fill="#7a7a7a" font-size="9.5" letter-spacing="2" text-anchor="end">FIG.03</text>

      
      <g>
        <rect x="652" y="76" width="118" height="118" fill="#141414" stroke="#9a9a9a" stroke-width="1.2"></rect>
        <text x="663" y="94" fill="#8a8a8a" font-size="8" letter-spacing="1.5">[ TEST WINDOW ]</text>
        <line x1="663" y1="100" x2="759" y2="100" stroke="#333" stroke-width="1"></line>
        <text x="663" y="118" fill="#bdbdbd" font-size="9.5">Total test time</text>
        <text x="663" y="136" fill="#f2f2f2" font-size="15" font-weight="bold">6–8 days</text>
        <line x1="663" y1="150" x2="759" y2="150" stroke="#2c2c2c" stroke-width="1"></line>
        <text x="663" y="168" fill="#bdbdbd" font-size="9.5">No SM-PCE02</text>
        <text x="663" y="183" fill="#bdbdbd" font-size="9.5">required</text>
      </g>
      
      <g>
        <line x1="711" y1="214" x2="711" y2="648" stroke="#6a6a6a" stroke-width="1.2" marker-end="url(#arr)"></line>
        <text x="724" y="440" fill="#6a6a6a" font-size="9" letter-spacing="3" transform="rotate(90,724,440)" text-anchor="middle">ISOLATION ORDER</text>
      </g>

      
      
      <g stroke="#444" stroke-width="1.2">
        <line x1="61" y1="162" x2="61" y2="176"></line>
        <line x1="61" y1="262" x2="61" y2="276"></line>
        <line x1="61" y1="362" x2="61" y2="376"></line>
        <line x1="61" y1="462" x2="61" y2="476"></line>
        <line x1="61" y1="562" x2="61" y2="576"></line>
      </g>

      
      <g>
        <rect x="30" y="76" width="608" height="86" fill="#111" stroke="#cfcfcf" stroke-width="1.3"></rect>
        <line x1="92" y1="76" x2="92" y2="162" stroke="#cfcfcf" stroke-width="1.3"></line>
        <text x="61" y="116" fill="#f2f2f2" font-size="26" font-weight="bold" text-anchor="middle">01</text>
        <text x="61" y="136" fill="#7a7a7a" font-size="7.5" letter-spacing="1.5" text-anchor="middle">STEP</text>
        <text x="108" y="100" fill="#f2f2f2" font-size="12.5" font-weight="bold">DISCONNECT: EW-WU111 (BT Unit)</text>
        <text x="108" y="122" fill="#9a9a9a" font-size="10">WAIT: 12 hours   |   EXPECTED SLEEP: &lt;80 µA</text>
        <text x="108" y="142" fill="#dcdcdc" font-size="10">If drain stops → Replace or update firmware</text>
      </g>
      
      <g>
        <rect x="30" y="176" width="608" height="86" fill="#111" stroke="#cfcfcf" stroke-width="1.3"></rect>
        <line x1="92" y1="176" x2="92" y2="262" stroke="#cfcfcf" stroke-width="1.3"></line>
        <text x="61" y="216" fill="#f2f2f2" font-size="26" font-weight="bold" text-anchor="middle">02</text>
        <text x="61" y="236" fill="#7a7a7a" font-size="7.5" letter-spacing="1.5" text-anchor="middle">STEP</text>
        <text x="108" y="200" fill="#f2f2f2" font-size="12.5" font-weight="bold">DISCONNECT: Rear Derailleur</text>
        <text x="108" y="222" fill="#9a9a9a" font-size="10">WAIT: 12 hours   |   EXPECTED SLEEP: &lt;65 µA</text>
        <text x="108" y="242" fill="#dcdcdc" font-size="10">If drain stops → RD microcontroller fault</text>
      </g>
      
      <g>
        <rect x="30" y="276" width="608" height="86" fill="#111" stroke="#cfcfcf" stroke-width="1.3"></rect>
        <line x1="92" y1="276" x2="92" y2="362" stroke="#cfcfcf" stroke-width="1.3"></line>
        <text x="61" y="316" fill="#f2f2f2" font-size="26" font-weight="bold" text-anchor="middle">03</text>
        <text x="61" y="336" fill="#7a7a7a" font-size="7.5" letter-spacing="1.5" text-anchor="middle">STEP</text>
        <text x="108" y="300" fill="#f2f2f2" font-size="12.5" font-weight="bold">DISCONNECT: Front Derailleur</text>
        <text x="108" y="322" fill="#9a9a9a" font-size="10">WAIT: 12 hours   |   EXPECTED SLEEP: &lt;50 µA</text>
        <text x="108" y="342" fill="#dcdcdc" font-size="10">If drain stops → FD alignment or MCU fault</text>
      </g>
      
      <g>
        <rect x="30" y="376" width="608" height="86" fill="#111" stroke="#cfcfcf" stroke-width="1.3"></rect>
        <line x1="92" y1="376" x2="92" y2="462" stroke="#cfcfcf" stroke-width="1.3"></line>
        <text x="61" y="416" fill="#f2f2f2" font-size="26" font-weight="bold" text-anchor="middle">04</text>
        <text x="61" y="436" fill="#7a7a7a" font-size="7.5" letter-spacing="1.5" text-anchor="middle">STEP</text>
        <text x="108" y="400" fill="#f2f2f2" font-size="12.5" font-weight="bold">DISCONNECT: Junction A (EW-RS910)</text>
        <text x="108" y="422" fill="#9a9a9a" font-size="10">WAIT: 12 hours   |   EXPECTED SLEEP: &lt;40 µA</text>
        <text x="108" y="442" fill="#dcdcdc" font-size="10">If drain stops → Junction A firmware loop</text>
      </g>
      
      <g>
        <rect x="30" y="476" width="608" height="86" fill="#141414" stroke="#f2f2f2" stroke-width="1.4"></rect>
        <line x1="92" y1="476" x2="92" y2="562" stroke="#f2f2f2" stroke-width="1.4"></line>
        <text x="61" y="516" fill="#ffffff" font-size="26" font-weight="bold" text-anchor="middle">05</text>
        <text x="61" y="536" fill="#9a9a9a" font-size="7.5" letter-spacing="1.5" text-anchor="middle">ISOLATE</text>
        <text x="108" y="500" fill="#ffffff" font-size="12.5" font-weight="bold">ISOLATE: Battery (disconnect all wires)</text>
        <text x="108" y="522" fill="#bdbdbd" font-size="10">WAIT: 24 hours   |   Battery should hold charge</text>
        <text x="108" y="542" fill="#e6e6e6" font-size="10">If drain → Internal cell degradation</text>
      </g>
      
      <g>
        <rect x="30" y="576" width="608" height="86" fill="#0e0e0e" stroke="#7a7a7a" stroke-width="1.2"></rect>
        <line x1="92" y1="576" x2="92" y2="662" stroke="#7a7a7a" stroke-width="1.2"></line>
        <text x="61" y="616" fill="#cfcfcf" font-size="26" font-weight="bold" text-anchor="middle">06</text>
        <text x="61" y="636" fill="#6a6a6a" font-size="7.5" letter-spacing="1.5" text-anchor="middle">REMAIN</text>
        <text x="108" y="600" fill="#dcdcdc" font-size="12.5" font-weight="bold">REMAINING: Dumb components (wires, JC41, JC130)</text>
        <text x="108" y="622" fill="#9a9a9a" font-size="10">Visual inspection for corrosion or kinks</text>
        <text x="108" y="642" fill="#bdbdbd" font-size="10">If suspect → overnight test with known-good parts</text>
      </g>

      
      <line x1="30" y1="700" x2="770" y2="700" stroke="#2a2a2a" stroke-width="1"></line>
      <text x="30" y="720" fill="#5e5e5e" font-size="8.6">© Carlos Eduardo Ravello Joo · BikeLab Studio 2026</text>
      <text x="30" y="732" fill="#4a4a4a" font-size="8.6">carlosravello.com</text>
    </svg>