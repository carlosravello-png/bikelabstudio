  <circle cx="888" cy="226" r="13" fill="#46E08A"></circle><text x="888" y="231" fill="#0E0E12" font-size="14" font-weight="bold" text-anchor="middle">4</text>
  <circle cx="838" cy="330" r="13" fill="#B68CFF"></circle><text x="838" y="335" fill="#0E0E12" font-size="14" font-weight="bold" text-anchor="middle">5</text>
  <circle cx="926" cy="448" r="13" fill="#FFB020"></circle><text x="926" y="453" fill="#0E0E12" font-size="14" font-weight="bold" text-anchor="middle">6</text>

  <rect x="40" y="556" width="1120" height="168" rx="2" fill="#121218" stroke="#2A2A2A" stroke-width="1.2"></rect>
  <g>
    <circle cx="72" cy="586" r="12" fill="#34D2FF"></circle><text x="72" y="591" fill="#0E0E12" font-size="13" font-weight="bold" text-anchor="middle">1</text>
    <text x="94" y="583" fill="#ECECEC" font-size="14" font-weight="bold">Lever + master cylinder + reservoir</text>
    <text x="94" y="601" fill="#9AA0A6" font-size="12.5">turns finger force into hydraulic pressure</text>

    <circle cx="72" cy="626" r="12" fill="#34D2FF"></circle><text x="72" y="631" fill="#0E0E12" font-size="13" font-weight="bold" text-anchor="middle">2</text>
    <text x="94" y="623" fill="#ECECEC" font-size="14" font-weight="bold">Hose</text>
    <text x="94" y="641" fill="#9AA0A6" font-size="12.5">transmits pressure without expanding (internal reinforcement)</text>

    <circle cx="72" cy="666" r="12" fill="#FFB020"></circle><text x="72" y="671" fill="#0E0E12" font-size="13" font-weight="bold" text-anchor="middle">3</text>
    <text x="94" y="663" fill="#ECECEC" font-size="14" font-weight="bold">Caliper</text>
    <text x="94" y="681" fill="#9AA0A6" font-size="12.5">houses pistons and pads; grips the rotor</text>

    <circle cx="72" cy="706" r="12" fill="#46E08A"></circle><text x="72" y="711" fill="#0E0E12" font-size="13" font-weight="bold" text-anchor="middle">4</text>
    <text x="94" y="703" fill="#ECECEC" font-size="14" font-weight="bold">Pistons</text>
    <text x="94" y="721" fill="#9AA0A6" font-size="12.5">push the pads against the rotor (Pascal)</text>
  </g>
  <g>
    <circle cx="622" cy="586" r="12" fill="#B68CFF"></circle><text x="622" y="591" fill="#0E0E12" font-size="13" font-weight="bold" text-anchor="middle">5</text>
    <text x="644" y="583" fill="#ECECEC" font-size="14" font-weight="bold">Seals</text>
    <text x="644" y="601" fill="#9AA0A6" font-size="12.5">seal the pressure and retract the piston (roll-back)</text>

    <circle cx="622" cy="626" r="12" fill="#FFB020"></circle><text x="622" y="631" fill="#0E0E12" font-size="13" font-weight="bold" text-anchor="middle">6</text>
    <text x="644" y="623" fill="#ECECEC" font-size="14" font-weight="bold">Pads</text>
    <text x="644" y="641" fill="#9AA0A6" font-size="12.5">friction material that turns motion into heat</text>

    <circle cx="622" cy="666" r="12" fill="#46E08A"></circle><text x="622" y="671" fill="#0E0E12" font-size="13" font-weight="bold" text-anchor="middle">7</text>
    <text x="644" y="663" fill="#ECECEC" font-size="14" font-weight="bold">Rotor</text>
    <text x="644" y="681" fill="#9AA0A6" font-size="12.5">disc fixed to the wheel; sheds heat to the air</text>

    <line x1="622" y1="700" x2="1138" y2="700" stroke="#222" stroke-width="1"></line>
    <text x="622" y="719" fill="#E8FF3A" font-size="12.5">Pressure chain: finger → fluid → piston → pad → rotor → air.</text>
  </g>

