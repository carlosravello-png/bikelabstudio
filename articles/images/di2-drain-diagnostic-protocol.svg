<svg viewBox="0 0 700 900" xmlns="http://www.w3.org/2000/svg" shape-rendering="geometricPrecision">
  <metadata>
    <rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#"
             xmlns:dc="http://purl.org/dc/elements/1.1/"
             xmlns:dcterms="http://purl.org/dc/terms/"
             xmlns:cc="http://creativecommons.org/ns#">
      <rdf:Description rdf:about="https://www.bikelabstudio.com/articles/images/di2-drain-diagnostic-protocol.svg">
        <dc:title>Shimano Di2 Battery Drain Diagnostic Protocol — Decision Tree</dc:title>
        <dc:title xml:lang="es">Protocolo de Diagnóstico de Descarga Batería Di2 — Árbol de Decisión</dc:title>
        <dc:creator>Carlos Eduardo Ravello Joo</dc:creator>
        <dc:publisher>BikeLab Studio</dc:publisher>
        <dc:description>Step-by-step diagnostic flowchart for Di2 battery drain. Single-click sleep test to component isolation. BikeLab Studio.</dc:description>
        <dc:subject>di2 battery drain, diagnostic flowchart, shimano di2, EW-WU111, BikeLab Studio</dc:subject>
        <dc:date>2026-05-30</dc:date>
        <dc:rights>© 2026 Carlos Eduardo Ravello Joo. CC BY-NC-ND 4.0.</dc:rights>
        <dc:identifier>https://orcid.org/0009-0007-5631-7436</dc:identifier>
        <dcterms:license rdf:resource="https://creativecommons.org/licenses/by-nc-nd/4.0/"/>
        <cc:attributionName>Carlos Eduardo Ravello Joo — BikeLab Studio</cc:attributionName>
        <cc:attributionURL rdf:resource="https://carlosravello.com"/>
      </rdf:Description>
    </rdf:RDF>
  </metadata>

      <defs>
      
        <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
          <path d="M28 0 H0 V28" fill="none" stroke="#151515" stroke-width="1"></path>
        </pattern>
        <marker id="arr" markerWidth="9" markerHeight="9" refX="6.5" refY="3" orient="auto">
          <path d="M0 0 L6.5 3 L0 6" fill="none" stroke="#cfcfcf" stroke-width="1.2"></path>
        </marker>
        <marker id="arrd" markerWidth="9" markerHeight="9" refX="6.5" refY="3" orient="auto">
          <path d="M0 0 L6.5 3 L0 6" fill="none" stroke="#8a8a8a" stroke-width="1.2"></path>
        </marker>
      </defs>

      
      <rect x="0" y="0" width="700" height="900" fill="#0a0a0a"></rect>
      <rect x="0" y="0" width="700" height="900" fill="url(#grid)"></rect>
      <rect x="0.5" y="0.5" width="699" height="899" fill="none" stroke="#2a2a2a" stroke-width="1"></rect>
      <g stroke="#555" stroke-width="1" fill="none">
        <path d="M14 14 H30 M14 14 V30"></path>
        <path d="M686 14 H670 M686 14 V30"></path>
        <path d="M14 886 H30 M14 886 V870"></path>
        <path d="M686 886 H670 M686 886 V870"></path>
      </g>

      
      <text x="30" y="42" fill="#f2f2f2" font-size="14" letter-spacing="2.5" font-weight="bold">DI2 BATTERY DRAIN // DIAGNOSTIC PROTOCOL</text>
      <line x1="30" y1="54" x2="670" y2="54" stroke="#3a3a3a" stroke-width="1"></line>
      <text x="670" y="42" fill="#7a7a7a" font-size="9.5" letter-spacing="2" text-anchor="end">FIG.02</text>

      
      <g stroke="#cfcfcf" stroke-width="1.3" fill="none">
        <line x1="230" y1="132" x2="230" y2="198" marker-end="url(#arr)"></line>
        <line x1="230" y1="256" x2="230" y2="322" marker-end="url(#arr)"></line>
        <line x1="230" y1="380" x2="230" y2="446" marker-end="url(#arr)"></line>
        <line x1="230" y1="504" x2="230" y2="570" marker-end="url(#arr)"></line>
        <line x1="230" y1="628" x2="230" y2="694" marker-end="url(#arr)"></line>
        <line x1="230" y1="752" x2="230" y2="778" marker-end="url(#arr)"></line>
        
        <line x1="390" y1="104" x2="428" y2="104" marker-end="url(#arr)"></line>
        <line x1="390" y1="228" x2="428" y2="228" marker-end="url(#arr)"></line>
        <line x1="390" y1="352" x2="428" y2="352" marker-end="url(#arr)"></line>
        <line x1="390" y1="476" x2="428" y2="476" marker-end="url(#arr)"></line>
        <line x1="390" y1="600" x2="428" y2="600" marker-end="url(#arr)"></line>
        <line x1="390" y1="724" x2="428" y2="724" marker-end="url(#arr)"></line>
      </g>

      
      <g font-size="9" font-weight="bold" letter-spacing="1">
        
        <text x="238" y="170" fill="#cfcfcf">YES</text>
        <text x="238" y="294" fill="#cfcfcf">YES</text>
        <text x="238" y="418" fill="#9a9a9a">NO</text>
        <text x="238" y="542" fill="#cfcfcf">YES</text>
        <text x="238" y="666" fill="#cfcfcf">YES</text>
        <text x="238" y="770" fill="#9a9a9a">NO</text>
        
        <text x="409" y="98" fill="#9a9a9a" text-anchor="middle">NO</text>
        <text x="409" y="222" fill="#9a9a9a" text-anchor="middle">NO</text>
        <text x="409" y="346" fill="#cfcfcf" text-anchor="middle">YES</text>
        <text x="409" y="470" fill="#9a9a9a" text-anchor="middle">NO</text>
        <text x="409" y="594" fill="#9a9a9a" text-anchor="middle">NO</text>
        <text x="409" y="718" fill="#cfcfcf" text-anchor="middle">YES</text>
      </g>

      
      
      <g>
        <rect x="70" y="76" width="320" height="56" fill="#111" stroke="#e6e6e6" stroke-width="1.4"></rect>
        <line x1="80" y1="76" x2="80" y2="132" stroke="#e6e6e6" stroke-width="1.4"></line>
        <text x="92" y="71" fill="#9a9a9a" font-size="8.5" letter-spacing="2">[ START ]</text>
        <text x="235" y="99" fill="#f2f2f2" font-size="11" text-anchor="middle">Battery draining &gt;10%</text>
        <text x="235" y="116" fill="#f2f2f2" font-size="11" text-anchor="middle">in 12 hours?</text>
      </g>
      
      <g>
        <rect x="70" y="200" width="320" height="56" fill="#111" stroke="#cfcfcf" stroke-width="1.3"></rect>
        <line x1="80" y1="200" x2="80" y2="256" stroke="#cfcfcf" stroke-width="1.3"></line>
        <text x="92" y="195" fill="#7a7a7a" font-size="8.5" letter-spacing="1">Q2</text>
        <text x="235" y="223" fill="#f2f2f2" font-size="11" text-anchor="middle">Single-click test:</text>
        <text x="235" y="240" fill="#f2f2f2" font-size="11" text-anchor="middle">Does system wake normally?</text>
      </g>
      
      <g>
        <rect x="70" y="324" width="320" height="56" fill="#111" stroke="#cfcfcf" stroke-width="1.3"></rect>
        <line x1="80" y1="324" x2="80" y2="380" stroke="#cfcfcf" stroke-width="1.3"></line>
        <text x="92" y="319" fill="#7a7a7a" font-size="8.5" letter-spacing="1">Q3</text>
        <text x="235" y="347" fill="#f2f2f2" font-size="11" text-anchor="middle">Was EW-WU111 recently</text>
        <text x="235" y="364" fill="#f2f2f2" font-size="11" text-anchor="middle">installed or updated?</text>
      </g>
      
      <g>
        <rect x="70" y="448" width="320" height="56" fill="#111" stroke="#cfcfcf" stroke-width="1.3"></rect>
        <line x1="80" y1="448" x2="80" y2="504" stroke="#cfcfcf" stroke-width="1.3"></line>
        <text x="92" y="443" fill="#7a7a7a" font-size="8.5" letter-spacing="1">Q4</text>
        <text x="235" y="471" fill="#f2f2f2" font-size="11" text-anchor="middle">Disconnect EW-WU111.</text>
        <text x="235" y="488" fill="#f2f2f2" font-size="11" text-anchor="middle">Drain continues?</text>
      </g>
      
      <g>
        <rect x="70" y="572" width="320" height="56" fill="#111" stroke="#cfcfcf" stroke-width="1.3"></rect>
        <line x1="80" y1="572" x2="80" y2="628" stroke="#cfcfcf" stroke-width="1.3"></line>
        <text x="92" y="567" fill="#7a7a7a" font-size="8.5" letter-spacing="1">Q5</text>
        <text x="235" y="595" fill="#f2f2f2" font-size="11" text-anchor="middle">Disconnect Rear Derailleur.</text>
        <text x="235" y="612" fill="#f2f2f2" font-size="11" text-anchor="middle">Drain continues?</text>
      </g>
      
      <g>
        <rect x="70" y="696" width="320" height="56" fill="#111" stroke="#cfcfcf" stroke-width="1.3"></rect>
        <line x1="80" y1="696" x2="80" y2="752" stroke="#cfcfcf" stroke-width="1.3"></line>
        <text x="92" y="691" fill="#7a7a7a" font-size="8.5" letter-spacing="1">Q6</text>
        <text x="235" y="719" fill="#f2f2f2" font-size="11" text-anchor="middle">Isolated battery test</text>
        <text x="235" y="736" fill="#f2f2f2" font-size="11" text-anchor="middle">(24h disconnected). Drain?</text>
      </g>

      
      
      <g>
        <rect x="430" y="74" width="250" height="60" fill="#141414" stroke="#777" stroke-width="1" stroke-dasharray="4 3"></rect>
        <text x="442" y="92" fill="#8a8a8a" font-size="8" letter-spacing="1">&gt;&gt; OUTCOME</text>
        <text x="442" y="109" fill="#dcdcdc" font-size="10">Normal behavior.</text>
        <text x="442" y="124" fill="#9a9a9a" font-size="10">Check ride frequency.</text>
      </g>
      
      <g>
        <rect x="430" y="198" width="250" height="60" fill="#141414" stroke="#777" stroke-width="1" stroke-dasharray="4 3"></rect>
        <text x="442" y="216" fill="#8a8a8a" font-size="8" letter-spacing="1">&gt;&gt; OUTCOME</text>
        <text x="442" y="233" fill="#dcdcdc" font-size="10">System stuck awake →</text>
        <text x="442" y="248" fill="#9a9a9a" font-size="10">Isolation protocol</text>
      </g>
      
      <g>
        <rect x="430" y="322" width="250" height="60" fill="#141414" stroke="#777" stroke-width="1" stroke-dasharray="4 3"></rect>
        <text x="442" y="340" fill="#8a8a8a" font-size="8" letter-spacing="1">&gt;&gt; OUTCOME</text>
        <text x="442" y="357" fill="#dcdcdc" font-size="10">Check firmware version.</text>
        <text x="442" y="372" fill="#9a9a9a" font-size="10">Update via E-TUBE app.</text>
      </g>
      
      <g>
        <rect x="430" y="446" width="250" height="60" fill="#141414" stroke="#9a9a9a" stroke-width="1.2"></rect>
        <text x="442" y="464" fill="#a8a8a8" font-size="8" letter-spacing="1">&gt;&gt; CULPRIT FOUND</text>
        <text x="442" y="481" fill="#f2f2f2" font-size="10">EW-WU111 is culprit →</text>
        <text x="442" y="496" fill="#cfcfcf" font-size="10">Replace or update firmware</text>
      </g>
      
      <g>
        <rect x="430" y="570" width="250" height="60" fill="#141414" stroke="#9a9a9a" stroke-width="1.2"></rect>
        <text x="442" y="588" fill="#a8a8a8" font-size="8" letter-spacing="1">&gt;&gt; CULPRIT FOUND</text>
        <text x="442" y="605" fill="#f2f2f2" font-size="10">RD MCU fault →</text>
        <text x="442" y="620" fill="#cfcfcf" font-size="10">Replace RD</text>
      </g>
      
      <g>
        <rect x="430" y="694" width="250" height="60" fill="#141414" stroke="#9a9a9a" stroke-width="1.2"></rect>
        <text x="442" y="712" fill="#a8a8a8" font-size="8" letter-spacing="1">&gt;&gt; CULPRIT FOUND</text>
        <text x="442" y="729" fill="#f2f2f2" font-size="10">Battery cell failure →</text>
        <text x="442" y="744" fill="#cfcfcf" font-size="10">Replace battery</text>
      </g>
      
      <g>
        <rect x="70" y="778" width="320" height="56" fill="#141414" stroke="#9a9a9a" stroke-width="1.2"></rect>
        <line x1="80" y1="778" x2="80" y2="834" stroke="#9a9a9a" stroke-width="1.2"></line>
        <text x="92" y="773" fill="#a8a8a8" font-size="8" letter-spacing="1">&gt;&gt; OUTCOME</text>
        <text x="235" y="801" fill="#f2f2f2" font-size="10.5" text-anchor="middle">Junction or wire fault →</text>
        <text x="235" y="818" fill="#cfcfcf" font-size="10.5" text-anchor="middle">SM-PCE02 or shop</text>
      </g>

      
      <line x1="30" y1="852" x2="670" y2="852" stroke="#2a2a2a" stroke-width="1"></line>
      <text x="670" y="872" fill="#cfcfcf" font-size="10" text-anchor="end">→ Use BikeLab Di2/AXS Diagnostic Tool</text>
      <text x="30" y="872" fill="#5e5e5e" font-size="8.6">© Carlos Eduardo Ravello Joo · BikeLab Studio 2026</text>
      <text x="30" y="884" fill="#4a4a4a" font-size="8.6">carlosravello.com</text>
    </svg>