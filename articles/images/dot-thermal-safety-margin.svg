        <dc:title>Thermal Safety Margin: DOT 4 vs DOT 5.1 at Sea Level and 3,000m Altitude</dc:title>
        <dc:title xml:lang="es">Margen de Seguridad Térmica: DOT 4 vs DOT 5.1 a Nivel del Mar y 3,000m</dc:title>
        <dc:creator>Carlos Eduardo Ravello Joo</dc:creator>
        <dc:publisher>BikeLab Studio</dc:publisher>
        <dc:description>Horizontal bar chart comparing effective boiling points of DOT 4 and DOT 5.1 (fresh and 2% moisture) at sea level and 3,000m altitude. BikeLab Studio.</dc:description>
