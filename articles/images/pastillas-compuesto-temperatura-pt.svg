<?xml version="1.0"?>
<svg viewBox="0 0 1200 660" width="100%" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" shape-rendering="geometricPrecision">
  <title>Pastilhas: orgânica vs sinterizada vs semimetálica — BikeLab Studio</title>
  <desc>Comparação de compostos de pastilha de freio em quatro eixos de desempenho e limiar de vitrificação. © Carlos Eduardo Ravello Joo · carlosravello.com</desc>
  <metadata><RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/"><Description><creator>Carlos Eduardo Ravello Joo</creator><rights>© 2026 Carlos Eduardo Ravello Joo. Todos os direitos reservados.</rights><publisher>BikeLab Studio</publisher><source>https://carlosravello.com</source><identifier>https://orcid.org/0009-0007-5631-7436</identifier></Description></RDF></metadata>
  <defs></defs>

  <rect x="0" y="0" width="1200" height="660" fill="#0E0E12"></rect>
  <rect x="8.5" y="8.5" width="1183" height="643" fill="none" stroke="#2A2A2A" stroke-width="1"></rect>
  <g stroke="#3A3A3A" stroke-width="1" fill="none">
    <path d="M22 22 H42 M22 22 V42"></path><path d="M1178 22 H1158 M1178 22 V42"></path>
    <path d="M22 638 H42 M22 638 V618"></path><path d="M1178 638 H1158 M1178 638 V618"></path>
  </g>

  <rect x="40" y="34" width="6" height="30" fill="#E8FF3A"></rect>
  <text x="62" y="57" fill="#ECECEC" font-size="25" font-weight="bold">Pastilhas: orgânica vs sinterizada vs semimetálica</text>
  <text x="62" y="84" fill="#9AA0A6" font-size="15">Não existe “melhor”: existe compromisso · cada composto ganha em uns eixos e cede em outros</text>
  <text x="1160" y="50" fill="#6A6A6A" font-size="12" text-anchor="end" letter-spacing="1">FIG.09 / PASTILHAS</text>
  <line x1="40" y1="100" x2="1160" y2="100" stroke="#2A2A2A" stroke-width="1"></line>

  
  <rect x="40" y="118" width="700" height="480" rx="2" fill="#121218" stroke="#2A2A2A" stroke-width="1.2"></rect>
  <text x="62" y="144" fill="#9AA0A6" font-size="13" letter-spacing="1.2">[ DESEMPENHO EM 4 EIXOS · escala 0–5 ]</text>

  
  <g fill="none" stroke="#242430" stroke-width="1">
    <polygon points="390,328 422,360 390,392 358,360"></polygon>
    <polygon points="390,296 454,360 390,424 326,360"></polygon>
    <polygon points="390,264 486,360 390,456 294,360"></polygon>
    <polygon points="390,232 518,360 390,488 262,360"></polygon>
    <polygon points="390,200 550,360 390,520 230,360"></polygon>
  </g>
  
  <g stroke="#3A3A3A" stroke-width="1">
    <line x1="390" y1="200" x2="390" y2="520"></line>
    <line x1="230" y1="360" x2="550" y2="360"></line>
  </g>
  
  <text x="390" y="190" fill="#ECECEC" font-size="13.5" text-anchor="middle" font-weight="bold">Mordida a frio</text>
  <text x="560" y="356" fill="#ECECEC" font-size="13.5" font-weight="bold">Resistência</text>
  <text x="560" y="372" fill="#ECECEC" font-size="13.5" font-weight="bold">ao fade</text>
  <text x="390" y="540" fill="#ECECEC" font-size="13.5" text-anchor="middle" font-weight="bold">Silêncio</text>
  <text x="220" y="356" fill="#ECECEC" font-size="13.5" text-anchor="end" font-weight="bold">Cuidado</text>
  <text x="220" y="372" fill="#ECECEC" font-size="13.5" text-anchor="end" font-weight="bold">do rotor</text>
  
  <text x="398" y="216" fill="#6A6A6A" font-size="10">5</text>

  
  <polygon points="390,264 518,360 390,456 294,360" fill="#46E08A" fill-opacity="0.12" stroke="#46E08A" stroke-width="2"></polygon>
  
  <polygon points="390,296 550,360 390,424 326,360" fill="#FFB020" fill-opacity="0.12" stroke="#FFB020" stroke-width="2"></polygon>
  
  <polygon points="390,232 454,360 390,520 230,360" fill="#34D2FF" fill-opacity="0.12" stroke="#34D2FF" stroke-width="2"></polygon>
  
  <g>
    <circle cx="390" cy="232" r="3.6" fill="#34D2FF"></circle><circle cx="454" cy="360" r="3.6" fill="#34D2FF"></circle><circle cx="390" cy="520" r="3.6" fill="#34D2FF"></circle><circle cx="230" cy="360" r="3.6" fill="#34D2FF"></circle>
    <circle cx="390" cy="296" r="3.6" fill="#FFB020"></circle><circle cx="550" cy="360" r="3.6" fill="#FFB020"></circle><circle cx="390" cy="424" r="3.6" fill="#FFB020"></circle><circle cx="326" cy="360" r="3.6" fill="#FFB020"></circle>
    <circle cx="390" cy="264" r="3.6" fill="#46E08A"></circle><circle cx="518" cy="360" r="3.6" fill="#46E08A"></circle><circle cx="390" cy="456" r="3.6" fill="#46E08A"></circle><circle cx="294" cy="360" r="3.6" fill="#46E08A"></circle>
  </g>

  
  <rect x="120" y="566" width="16" height="12" fill="#34D2FF" fill-opacity="0.5" stroke="#34D2FF" stroke-width="1.4"></rect>
  <text x="144" y="576" fill="#9AA0A6" font-size="13">Orgânica</text>
  <rect x="280" y="566" width="16" height="12" fill="#FFB020" fill-opacity="0.5" stroke="#FFB020" stroke-width="1.4"></rect>
  <text x="304" y="576" fill="#9AA0A6" font-size="13">Sinterizada</text>
  <rect x="450" y="566" width="16" height="12" fill="#46E08A" fill-opacity="0.5" stroke="#46E08A" stroke-width="1.4"></rect>
  <text x="474" y="576" fill="#9AA0A6" font-size="13">Semimetálica</text>

  
  <g>
    <rect x="760" y="118" width="400" height="480" rx="2" fill="#121218" stroke="#2A2A2A" stroke-width="1.2"></rect>
    <text x="782" y="144" fill="#9AA0A6" font-size="13" letter-spacing="1.2">[ QUANDO ESCOLHER CADA UMA ]</text>
    <line x1="782" y1="156" x2="1138" y2="156" stroke="#222" stroke-width="1"></line>

    <rect x="782" y="176" width="14" height="14" fill="#34D2FF" fill-opacity="0.5" stroke="#34D2FF" stroke-width="1.4"></rect>
    <text x="806" y="188" fill="#34D2FF" font-size="15" font-weight="bold">Orgânica</text>
    <text x="782" y="210" fill="#C9CDD2" font-size="13">Silenciosa, suave com o rotor e boa</text>
    <text x="782" y="228" fill="#C9CDD2" font-size="13">mordida a frio. Vitrifica com calor.</text>

    <rect x="782" y="252" width="14" height="14" fill="#FFB020" fill-opacity="0.5" stroke="#FFB020" stroke-width="1.4"></rect>
    <text x="806" y="264" fill="#FFB020" font-size="15" font-weight="bold">Sinterizada</text>
    <text x="782" y="286" fill="#C9CDD2" font-size="13">Máxima resistência ao fade e à chuva.</text>
    <text x="782" y="304" fill="#C9CDD2" font-size="13">Ruidosa e mais dura com o rotor.</text>

    <rect x="782" y="328" width="14" height="14" fill="#46E08A" fill-opacity="0.5" stroke="#46E08A" stroke-width="1.4"></rect>
    <text x="806" y="340" fill="#46E08A" font-size="15" font-weight="bold">Semimetálica</text>
    <text x="782" y="362" fill="#C9CDD2" font-size="13">O meio-termo: equilíbrio entre mordida,</text>
    <text x="782" y="380" fill="#C9CDD2" font-size="13">fade e durabilidade. Polivalente.</text>

    
    <rect x="782" y="406" width="356" height="116" rx="2" fill="#15110A" stroke="#FF5C5C" stroke-width="1.4"></rect>
    <g transform="translate(800,424)" stroke="#FF5C5C" stroke-width="1.8" fill="none">
      <path d="M16 2 L30 28 L2 28 Z"></path><line x1="16" y1="12" x2="16" y2="20"></line><circle cx="16" cy="24" r="1.2" fill="#FF5C5C"></circle>
    </g>
    <text x="846" y="430" fill="#FF5C5C" font-size="14.5" font-weight="bold">Vitrificação orgânica ≈ 300°C</text>
    <text x="800" y="460" fill="#C9CDD2" font-size="12.5">Acima de ~300°C o ligante da</text>
    <text x="800" y="478" fill="#C9CDD2" font-size="12.5">orgânica se cristaliza: superfície vidrada,</text>
    <text x="800" y="496" fill="#C9CDD2" font-size="12.5">perda brusca de mordida e chiado.</text>
    <text x="800" y="514" fill="#FFB020" font-size="12.5">Em descidas longas → sinterizada.</text>

    <text x="782" y="556" fill="#E8FF3A" font-size="12.5">Escolha por terreno e clima,</text>
    <text x="782" y="574" fill="#E8FF3A" font-size="12.5">não por marketing.</text>
  </g>

  <text x="1160" y="640" fill="#6A6A6A" font-size="11" text-anchor="end">© Carlos Eduardo Ravello Joo · carlosravello.com</text>
