<svg xmlns="http://www.w3.org/2000/svg" width="400" height="200" viewBox="0 0 400 200">
  <defs>
    <!-- Background gradient -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#050505"/>
      <stop offset="100%" stop-color="#0a0900"/>
    </linearGradient>
    <!-- Yellow glow filter -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <!-- Scan line pattern -->
    <pattern id="scanlines" width="400" height="4" patternUnits="userSpaceOnUse">
      <rect width="400" height="1" y="0" fill="rgba(255,255,255,0.012)"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="400" height="200" fill="url(#bg)"/>

  <!-- Circuit grid — horizontal -->
  <line x1="0" y1="40"  x2="400" y2="40"  stroke="#0f0f0f" stroke-width="1"/>
  <line x1="0" y1="80"  x2="400" y2="80"  stroke="#0f0f0f" stroke-width="1"/>
  <line x1="0" y1="120" x2="400" y2="120" stroke="#0f0f0f" stroke-width="1"/>
  <line x1="0" y1="160" x2="400" y2="160" stroke="#0f0f0f" stroke-width="1"/>

  <!-- Circuit grid — vertical -->
  <line x1="80"  y1="0" x2="80"  y2="200" stroke="#0f0f0f" stroke-width="1"/>
  <line x1="160" y1="0" x2="160" y2="200" stroke="#0f0f0f" stroke-width="1"/>
  <line x1="240" y1="0" x2="240" y2="200" stroke="#0f0f0f" stroke-width="1"/>
  <line x1="320" y1="0" x2="320" y2="200" stroke="#0f0f0f" stroke-width="1"/>

  <!-- Circuit traces — left branch -->
  <polyline points="20,100 60,100 60,60 110,60" stroke="#1a1a1a" stroke-width="1.5" fill="none"/>
  <polyline points="20,130 40,130 40,160 90,160" stroke="#1a1a1a" stroke-width="1.5" fill="none"/>
  <circle cx="60" cy="100" r="2.5" fill="#1e1e1e"/>
  <circle cx="40" cy="130" r="2.5" fill="#1e1e1e"/>

  <!-- Circuit traces — right branch -->
  <polyline points="380,70 340,70 340,40 300,40" stroke="#1a1a1a" stroke-width="1.5" fill="none"/>
  <polyline points="380,140 360,140 360,160 310,160" stroke="#1a1a1a" stroke-width="1.5" fill="none"/>
  <circle cx="340" cy="70"  r="2.5" fill="#1e1e1e"/>
  <circle cx="360" cy="140" r="2.5" fill="#1e1e1e"/>

  <!-- Scanlines overlay -->
  <rect width="400" height="200" fill="url(#scanlines)"/>

  <!-- Left accent bar -->
  <rect x="0" y="0" width="3" height="200" fill="#e8ff00" opacity="0.7"/>

  <!-- Top status bar -->
  <rect x="0" y="0" width="400" height="22" fill="#070700"/>
  <text x="12" y="14" font-family="'JetBrains Mono',monospace" font-size="7" fill="#e8ff00" letter-spacing="2" text-anchor="start" font-weight="400">BIKELAB_STUDIO // DIAGNOSTIC_TOOL_v1.0</text>
  <circle cx="385" cy="11" r="3" fill="#e8ff00" opacity="0.9"/>
  <circle cx="375" cy="11" r="3" fill="#444"/>
  <circle cx="365" cy="11" r="3" fill="#444"/>

  <!-- Main label -->
  <text x="26" y="68" font-family="'Space Grotesk','Arial Black',sans-serif" font-size="38" fill="#e8ff00" font-weight="900" letter-spacing="-1" filter="url(#glow)">DI2 &amp; AXS</text>

  <!-- Subtitle -->
  <text x="27" y="88" font-family="'IBM Plex Mono','Courier New',monospace" font-size="8.5" fill="#888" letter-spacing="3" text-anchor="start" font-weight="300">ELECTRONIC_SHIFTING // DIAGNÓSTICO</text>

  <!-- Divider line -->
  <line x1="26" y1="96" x2="220" y2="96" stroke="#1e1e1e" stroke-width="1"/>

  <!-- Feature pills -->
  <rect x="26"  y="106" width="62" height="16" fill="none" stroke="#1e1e1e" stroke-width="1"/>
  <text x="57"  y="118" font-family="'IBM Plex Mono',monospace" font-size="7" fill="#555" text-anchor="middle" letter-spacing="1">SHIMANO</text>

  <rect x="95"  y="106" width="50" height="16" fill="none" stroke="#1e1e1e" stroke-width="1"/>
  <text x="120" y="118" font-family="'IBM Plex Mono',monospace" font-size="7" fill="#555" text-anchor="middle" letter-spacing="1">SRAM</text>

  <rect x="152" y="106" width="58" height="16" fill="none" stroke="#1e1e1e" stroke-width="1"/>
  <text x="181" y="118" font-family="'IBM Plex Mono',monospace" font-size="7" fill="#555" text-anchor="middle" letter-spacing="1">GRATIS</text>

  <!-- Bottom CTA -->
  <text x="26" y="155" font-family="'IBM Plex Mono',monospace" font-size="9" fill="#333" letter-spacing="2" font-weight="300">// Una pregunta a la vez</text>
  <text x="26" y="170" font-family="'IBM Plex Mono',monospace" font-size="9" fill="#333" letter-spacing="2" font-weight="300">// Sin app necesaria</text>
  <text x="26" y="185" font-family="'IBM Plex Mono',monospace" font-size="9" fill="#333" letter-spacing="2" font-weight="300">// Shimano Di2 · SRAM AXS</text>

  <!-- Right side — diagnostic node graphic -->
  <g opacity="0.6">
    <!-- Node circles -->
    <circle cx="300" cy="80"  r="5" fill="none" stroke="#e8ff00" stroke-width="1"/>
    <circle cx="330" cy="100" r="5" fill="none" stroke="#444"    stroke-width="1"/>
    <circle cx="360" cy="80"  r="5" fill="none" stroke="#444"    stroke-width="1"/>
    <circle cx="330" cy="60"  r="5" fill="none" stroke="#444"    stroke-width="1"/>
    <circle cx="300" cy="120" r="5" fill="none" stroke="#2a2a00" stroke-width="1" fill="#050505"/>
    <circle cx="360" cy="120" r="5" fill="none" stroke="#2a2a00" stroke-width="1"/>

    <!-- Connector lines -->
    <line x1="305" y1="80"  x2="325" y2="100" stroke="#e8ff00" stroke-width="0.8" opacity="0.5"/>
    <line x1="305" y1="80"  x2="325" y2="60"  stroke="#333"    stroke-width="0.8"/>
    <line x1="335" y1="100" x2="355" y2="80"  stroke="#333"    stroke-width="0.8"/>
    <line x1="335" y1="100" x2="355" y2="120" stroke="#222"    stroke-width="0.8"/>
    <line x1="335" y1="60"  x2="355" y2="80"  stroke="#333"    stroke-width="0.8"/>
    <line x1="300" y1="85"  x2="300" y2="115" stroke="#1a1a1a" stroke-width="0.8"/>

    <!-- Active node indicator -->
    <circle cx="300" cy="80" r="8" fill="none" stroke="#e8ff00" stroke-width="0.5" opacity="0.4"/>

    <!-- Node labels -->
    <text x="300" y="145" font-family="'IBM Plex Mono',monospace" font-size="6" fill="#333" text-anchor="middle" letter-spacing="1">ENERGÍA</text>
    <text x="330" y="115" font-family="'IBM Plex Mono',monospace" font-size="6" fill="#333" text-anchor="middle" letter-spacing="1">COM</text>
    <text x="360" y="135" font-family="'IBM Plex Mono',monospace" font-size="6" fill="#333" text-anchor="middle" letter-spacing="1">MECÁNICA</text>

    <!-- Signal dot animation hint -->
    <circle cx="312" cy="90" r="1.5" fill="#e8ff00" opacity="0.7"/>
  </g>

  <!-- Bottom bar -->
  <rect x="0" y="193" width="400" height="7" fill="#070700"/>
  <text x="200" y="198" font-family="'IBM Plex Mono',monospace" font-size="5.5" fill="#2a2a2a" text-anchor="middle" letter-spacing="3">BIKELABSTUDIO.COM // TRUJILLO, PERU</text>
</svg>
