  <defs></defs>

  <rect x="0" y="0" width="1200" height="700" fill="#0E0E12"></rect>
  <rect x="8.5" y="8.5" width="1183" height="683" fill="none" stroke="#2A2A2A" stroke-width="1"></rect>
  <g stroke="#3A3A3A" stroke-width="1" fill="none">
    <path d="M22 22 H42 M22 22 V42"></path><path d="M1178 22 H1158 M1178 22 V42"></path>
    <path d="M22 678 H42 M22 678 V658"></path><path d="M1178 678 H1158 M1178 678 V658"></path>
  </g>

  <rect x="40" y="34" width="6" height="30" fill="#E8FF3A"></rect>
  <text x="62" y="57" fill="#ECECEC" font-size="25" font-weight="bold">Hygroscopic vs hydrophobic: where the water goes</text>
  <text x="62" y="84" fill="#9AA0A6" font-size="15">DOT mixes and spreads the water · mineral oil rejects it and lets it pool at the hottest point</text>
  <text x="1160" y="50" fill="#6A6A6A" font-size="12" text-anchor="end" letter-spacing="1">FIG.06 / WATER</text>
  <line x1="40" y1="100" x2="1160" y2="100" stroke="#2A2A2A" stroke-width="1"></line>

  <circle cx="62" cy="120" r="5" fill="#4F7DF0"></circle>
  <text x="76" y="125" fill="#9AA0A6" font-size="12.5">= water</text>

  <g>
    <rect x="40" y="138" width="545" height="430" rx="2" fill="#121218" stroke="#34D2FF" stroke-width="1.4"></rect>
    <text x="62" y="166" fill="#34D2FF" font-size="14" letter-spacing="1.2" font-weight="bold">[ DOT · HYGROSCOPIC ]</text>
    <text x="62" y="188" fill="#9AA0A6" font-size="13">water mixes and stays suspended throughout the WHOLE circuit</text>

    <rect x="70" y="214" width="96" height="44" rx="3" fill="#0E0E12" stroke="#34D2FF" stroke-width="1.6"></rect>
    <text x="118" y="241" fill="#34D2FF" font-size="12" text-anchor="middle">lever</text>
    <path d="M166 236 C 300 246 348 380 372 432" fill="none" stroke="#34D2FF" stroke-width="11" opacity="0.35" stroke-linecap="round"></path>
    <path d="M166 236 C 300 246 348 380 372 432" fill="none" stroke="#34D2FF" stroke-width="2" stroke-dasharray="2 7"></path>
    <rect x="372" y="424" width="160" height="84" rx="4" fill="#0E0E12" stroke="#34D2FF" stroke-width="1.6"></rect>
    <text x="452" y="470" fill="#34D2FF" font-size="12.5" text-anchor="middle">caliper</text>
    <text x="452" y="490" fill="#9AA0A6" font-size="11" text-anchor="middle">(low + hottest point)</text>

    <g fill="#4F7DF0">
      <circle cx="96" cy="231" r="3.4"></circle><circle cx="124" cy="244" r="3.4"></circle><circle cx="148" cy="226" r="3.4"></circle>
      <circle cx="196" cy="240" r="3.4"></circle><circle cx="240" cy="258" r="3.4"></circle><circle cx="280" cy="288" r="3.4"></circle>
      <circle cx="312" cy="330" r="3.4"></circle><circle cx="338" cy="372" r="3.4"></circle><circle cx="360" cy="410" r="3.4"></circle>
      <circle cx="398" cy="446" r="3.4"></circle><circle cx="430" cy="470" r="3.4"></circle><circle cx="466" cy="448" r="3.4"></circle>
      <circle cx="498" cy="478" r="3.4"></circle><circle cx="412" cy="486" r="3.4"></circle><circle cx="486" cy="436" r="3.4"></circle>
      <circle cx="218" cy="226" r="3.4"></circle><circle cx="262" cy="272" r="3.4"></circle>
    </g>

    <rect x="62" y="522" width="461" height="34" rx="2" fill="#0A1622" stroke="#34D2FF" stroke-width="1"></rect>
    <text x="74" y="544" fill="#34D2FF" font-size="13.5" font-weight="bold">⇒ Gradual, uniform drop of the boiling point</text>
  </g>

  <g>
    <rect x="615" y="138" width="545" height="430" rx="2" fill="#121218" stroke="#B68CFF" stroke-width="1.4"></rect>
    <text x="637" y="166" fill="#B68CFF" font-size="14" letter-spacing="1.2" font-weight="bold">[ MINERAL · HYDROPHOBIC ]</text>
    <text x="637" y="188" fill="#9AA0A6" font-size="13">water doesn&#39;t mix: it sinks and pools in the CALIPER</text>

    <rect x="645" y="214" width="96" height="44" rx="3" fill="#0E0E12" stroke="#B68CFF" stroke-width="1.6"></rect>
    <text x="693" y="241" fill="#B68CFF" font-size="12" text-anchor="middle">lever</text>
    <path d="M741 236 C 875 246 923 380 947 432" fill="none" stroke="#B68CFF" stroke-width="11" opacity="0.3" stroke-linecap="round"></path>
    <path d="M741 236 C 875 246 923 380 947 432" fill="none" stroke="#B68CFF" stroke-width="2" stroke-dasharray="2 7"></path>
    <rect x="947" y="424" width="160" height="84" rx="4" fill="#0E0E12" stroke="#B68CFF" stroke-width="1.6"></rect>
    <text x="955" y="442" fill="#B68CFF" font-size="12.5">caliper</text>

    <path d="M951 500 L1103 500 L1103 480 Q1027 466 951 480 Z" fill="#4F7DF0" fill-opacity="0.55" stroke="#4F7DF0" stroke-width="1.2"></path>
    <g fill="#4F7DF0">
      <circle cx="970" cy="490" r="3.4"></circle><circle cx="995" cy="494" r="3.4"></circle><circle cx="1020" cy="489" r="3.4"></circle>
      <circle cx="1045" cy="494" r="3.4"></circle><circle cx="1070" cy="490" r="3.4"></circle><circle cx="1085" cy="495" r="3.4"></circle>
    </g>
    <g fill="none" stroke="#FF5C5C" stroke-width="1.5">
      <circle cx="1000" cy="470" r="4"></circle><circle cx="1035" cy="462" r="5"></circle><circle cx="1062" cy="472" r="3"></circle>
    </g>
    <text x="1027" y="416" fill="#FF5C5C" font-size="13" text-anchor="middle" font-weight="bold">100°C → vapor</text>

    <rect x="637" y="522" width="461" height="34" rx="2" fill="#1A0F22" stroke="#FF5C5C" stroke-width="1"></rect>
    <text x="649" y="544" fill="#FF5C5C" font-size="13.5" font-weight="bold">⇒ Boils at 100°C in the caliper → sudden spongy lever</text>
  </g>

  <g>
    <rect x="40" y="586" width="1120" height="78" rx="2" fill="#15110A" stroke="#FFB020" stroke-width="1.5"></rect>
    <rect x="40" y="586" width="5" height="78" fill="#FFB020"></rect>
    <text x="72" y="618" fill="#FFB020" font-size="19" font-weight="bold">Same water, different fate: dispersed it lowers the whole system; concentrated it blows the critical point</text>
    <text x="72" y="646" fill="#C9CDD2" font-size="14">That&#39;s why &#34;healthy&#34; mineral oil can fail suddenly on a descent, while DOT degrades progressively and with warning.</text>
  </g>

