  <rect x="40" y="34" width="6" height="30" fill="#E8FF3A"></rect>
  <text x="62" y="57" fill="#ECECEC" font-size="25" font-weight="bold">The rotor as a heat sink: diameter and technology</text>
  <text x="62" y="84" fill="#9AA0A6" font-size="15">Peak temperature on a 10 km descent · more area and better conduction = more heat delivered to the air</text>
  <text x="1160" y="50" fill="#6A6A6A" font-size="12" text-anchor="end" letter-spacing="1">FIG.10 / DISSIPATION</text>
  <line x1="40" y1="100" x2="1160" y2="100" stroke="#2A2A2A" stroke-width="1"></line>

  <rect x="40" y="118" width="520" height="440" rx="2" fill="#121218" stroke="#2A2A2A" stroke-width="1.2"></rect>
  <text x="62" y="144" fill="#9AA0A6" font-size="13" letter-spacing="1.2">[ PEAK TEMPERATURE · 10 km descent ]</text>

  <g stroke="#1E1E24" stroke-width="1">
    <line x1="150" y1="500" x2="520" y2="500"></line><line x1="150" y1="445" x2="520" y2="445"></line>
    <line x1="150" y1="390" x2="520" y2="390"></line><line x1="150" y1="335" x2="520" y2="335"></line>
    <line x1="150" y1="280" x2="520" y2="280"></line><line x1="150" y1="225" x2="520" y2="225"></line>
    <line x1="150" y1="170" x2="520" y2="170"></line>
  </g>
  <g fill="#9AA0A6" font-size="12" text-anchor="end">
    <text x="138" y="504">0</text><text x="138" y="449">50</text><text x="138" y="394">100</text>
    <text x="138" y="339">150</text><text x="138" y="284">200</text><text x="138" y="229">250</text><text x="138" y="174">300</text>
  </g>
  <line x1="150" y1="170" x2="150" y2="500" stroke="#6A6A6A" stroke-width="1.4"></line>
  <line x1="150" y1="500" x2="520" y2="500" stroke="#6A6A6A" stroke-width="1.4"></line>
  <text x="84" y="335" fill="#ECECEC" font-size="13" text-anchor="middle" transform="rotate(-90 84 335)">peak temperature (°C)</text>

  <line x1="150" y1="225" x2="520" y2="225" stroke="#FFB020" stroke-width="1.3" stroke-dasharray="6 5"></line>

  <rect x="210" y="181" width="100" height="319" fill="#FF5C5C" fill-opacity="0.88"></rect>
  <text x="260" y="173" fill="#FF5C5C" font-size="16" font-weight="bold" text-anchor="middle">≈ 290°C</text>
  <text x="260" y="524" fill="#ECECEC" font-size="14" text-anchor="middle">203 mm</text>
  <text x="260" y="542" fill="#9AA0A6" font-size="11.5" text-anchor="middle">standard (steel)</text>

  <rect x="370" y="226" width="100" height="274" fill="#46E08A" fill-opacity="0.9"></rect>
  <text x="420" y="218" fill="#46E08A" font-size="16" font-weight="bold" text-anchor="middle">&lt; 250°C</text>
  <text x="420" y="524" fill="#ECECEC" font-size="14" text-anchor="middle">220 mm</text>
  <text x="420" y="542" fill="#9AA0A6" font-size="11.5" text-anchor="middle">Ice-Tech (Al core)</text>
  <line x1="150" y1="556" x2="176" y2="556" stroke="#FFB020" stroke-width="1.3" stroke-dasharray="6 5"></line>
  <text x="184" y="560" fill="#FFB020" font-size="11.5">250°C · severe fade onset</text>

  <line x1="330" y1="181" x2="330" y2="226" stroke="#E8FF3A" stroke-width="1.2" stroke-dasharray="3 3"></line>
  <text x="338" y="206" fill="#E8FF3A" font-size="12">−40°C</text>

  <rect x="580" y="118" width="580" height="440" rx="2" fill="#121218" stroke="#2A2A2A" stroke-width="1.2"></rect>
  <text x="602" y="144" fill="#9AA0A6" font-size="13" letter-spacing="1.2">[ WHY IT DISSIPATES BETTER · Ice-Tech cutaway ]</text>

  <g stroke="#FFB020" stroke-width="2" marker-end="url(#ah)">
    <line x1="690" y1="210" x2="690" y2="184"></line><line x1="780" y1="210" x2="780" y2="184"></line>
    <line x1="870" y1="210" x2="870" y2="184"></line><line x1="960" y1="210" x2="960" y2="184"></line><line x1="1050" y1="210" x2="1050" y2="184"></line>
  </g>
  <text x="870" y="174" fill="#FFB020" font-size="12" text-anchor="middle">heat → AIR</text>

  <rect x="640" y="214" width="460" height="22" fill="#6A6A6A"></rect>
  <rect x="640" y="236" width="460" height="34" fill="#34D2FF" fill-opacity="0.45" stroke="#34D2FF" stroke-width="1"></rect>
  <rect x="640" y="270" width="460" height="22" fill="#6A6A6A"></rect>
  <text x="1110" y="228" fill="#9AA0A6" font-size="12">steel (track)</text>
  <text x="1110" y="257" fill="#34D2FF" font-size="12">Al core</text>
  <text x="1110" y="285" fill="#9AA0A6" font-size="12">steel (track)</text>

  <g stroke="#FFB020" stroke-width="2" marker-end="url(#ah)">
    <line x1="690" y1="292" x2="690" y2="318"></line><line x1="780" y1="292" x2="780" y2="318"></line>
    <line x1="870" y1="292" x2="870" y2="318"></line><line x1="960" y1="292" x2="960" y2="318"></line><line x1="1050" y1="292" x2="1050" y2="318"></line>
  </g>
  <text x="870" y="338" fill="#FFB020" font-size="12" text-anchor="middle">heat → AIR</text>

  <line x1="602" y1="362" x2="1138" y2="362" stroke="#222" stroke-width="1"></line>
  <circle cx="612" cy="388" r="4" fill="#46E08A"></circle>
  <text x="628" y="392" fill="#C9CDD2" font-size="13.5">More diameter → more swept area and more thermal mass.</text>
  <circle cx="612" cy="416" r="4" fill="#34D2FF"></circle>
  <text x="628" y="420" fill="#C9CDD2" font-size="13.5">Aluminum core → conducts heat out of the track faster.</text>
  <circle cx="612" cy="444" r="4" fill="#FFB020"></circle>
  <text x="628" y="448" fill="#C9CDD2" font-size="13.5">Steel brakes; aluminum evacuates. Together they deliver more heat to air.</text>

  <rect x="602" y="472" width="536" height="66" rx="2" fill="#0A1410" stroke="#46E08A" stroke-width="1.4"></rect>
  <rect x="602" y="472" width="5" height="66" fill="#46E08A"></rect>
  <text x="624" y="500" fill="#46E08A" font-size="16" font-weight="bold">The rotor doesn&#39;t &#34;hold&#34; heat: it gives it to the air</text>
  <text x="624" y="524" fill="#C9CDD2" font-size="13">More area + better conduction = lower peak and more margin before fade.</text>

