  <text x="62" y="84" fill="#9AA0A6" font-size="15">Punto de ebullición seco y húmedo · el fluido húmedo es el que de verdad usas tras meses de servicio</text>
  <text x="1160" y="50" fill="#6A6A6A" font-size="12" text-anchor="end" letter-spacing="1">FIG.05 / EBULLICIÓN</text>
