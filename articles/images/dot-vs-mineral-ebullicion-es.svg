  <text x="516" y="552" fill="#ECECEC" font-size="15" text-anchor="middle">DOT 5.1</text>

  
  <rect x="685" y="245" width="56" height="285" fill="#34D2FF" fill-opacity="0.85"></rect>
  <text x="713" y="237" fill="#34D2FF" font-size="14" font-weight="bold" text-anchor="middle">225</text>
  <rect x="751" y="403" width="56" height="127" fill="#FF5C5C" fill-opacity="0.6"></rect>
  <rect x="751" y="403" width="56" height="127" fill="none" stroke="#FF5C5C" stroke-width="1.4" stroke-dasharray="4 3"></rect>
