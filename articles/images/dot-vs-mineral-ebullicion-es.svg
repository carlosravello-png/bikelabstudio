  <text x="746" y="552" fill="#ECECEC" font-size="15" text-anchor="middle">Mineral</text>
  <text x="746" y="572" fill="#9AA0A6" font-size="11.5" text-anchor="middle">(agua atrapada)</text>

  
  <rect x="455" y="586" width="16" height="12" fill="#34D2FF" fill-opacity="0.85"></rect>
  <text x="478" y="596" fill="#9AA0A6" font-size="12.5">seco</text>
  <rect x="545" y="586" width="16" height="12" fill="#FF5C5C" fill-opacity="0.85"></rect>
  <text x="568" y="596" fill="#9AA0A6" font-size="12.5">húmedo / agua atrapada</text>

  
  <g>
    <rect x="935" y="118" width="225" height="480" rx="2" fill="#121218" stroke="#2A2A2A" stroke-width="1.2"></rect>
    <text x="957" y="146" fill="#9AA0A6" font-size="13" letter-spacing="1.2">[ EL MATIZ DEL MINERAL ]</text>
    <line x1="957" y1="158" x2="1138" y2="158" stroke="#222" stroke-width="1"></line>
    <text x="957" y="186" fill="#B68CFF" font-size="13.5" font-weight="bold">No es higroscópico:</text>
    <text x="957" y="206" fill="#C9CDD2" font-size="12.5">el aceite mineral no absorbe</text>
    <text x="957" y="224" fill="#C9CDD2" font-size="12.5">humedad como el DOT.</text>

    <text x="957" y="258" fill="#FF5C5C" font-size="13.5" font-weight="bold">Pero el agua entra igual</text>
    <text x="957" y="278" fill="#C9CDD2" font-size="12.5">por sellos y condensación.</text>
    <text x="957" y="296" fill="#C9CDD2" font-size="12.5">Al no mezclarse, se hunde y</text>
    <text x="957" y="314" fill="#C9CDD2" font-size="12.5">se acumula en la PINZA —</text>
    <text x="957" y="332" fill="#C9CDD2" font-size="12.5">el punto más bajo y caliente.</text>

    <line x1="957" y1="356" x2="1138" y2="356" stroke="#222" stroke-width="1"></line>
    <text x="957" y="384" fill="#FFB020" font-size="13.5" font-weight="bold">Y ahí hierve a 100°C</text>
    <text x="957" y="404" fill="#C9CDD2" font-size="12.5">muy por debajo del propio</text>
    <text x="957" y="422" fill="#C9CDD2" font-size="12.5">fluido seco (225°C).</text>
    <text x="957" y="448" fill="#C9CDD2" font-size="12.5">Resultado: maneta esponjosa</text>
    <text x="957" y="466" fill="#C9CDD2" font-size="12.5">justo cuando más frenas.</text>

    <line x1="957" y1="494" x2="1138" y2="494" stroke="#222" stroke-width="1"></line>
    <text x="957" y="522" fill="#46E08A" font-size="12.5">DOT o mineral: ambos</text>
    <text x="957" y="540" fill="#46E08A" font-size="12.5">necesitan purga anual.</text>
    <text x="957" y="566" fill="#9AA0A6" font-size="12">El número seco engaña;</text>
    <text x="957" y="584" fill="#9AA0A6" font-size="12">manda el húmedo real.</text>
  </g>

