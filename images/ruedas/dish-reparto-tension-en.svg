  <title id="dsh-t">Why an offset rim makes the 60 % rule reachable: tension split between wheel sides</title>
  <desc id="dsh-d">Curve of the ratio between non-drive-side and drive-side spoke tension on a rear disc wheel, as a function of the offset in millimetres of the rim spoke bed towards the non-drive side. With a symmetric rim the ratio is 0.52, meaning the loose side works at 52 % of the tight side, below the 60 % DT Swiss requires; the curve crosses that threshold at 1.76 millimetres of offset and reaches 0.66 at three millimetres. The ratio depends only on the number of spokes per side, the flange spacing of the hub and the spoke lengths: it does not depend on how the wheel is built or how hard it is tensioned. Reference geometry representative of a rear disc wheel, not measured on a specific hub. Source: own derivation from the axial equilibrium of the rim, validated in dish_oracle.py (BikeLab Studio, 2026); 60 % threshold per DT Swiss. Diagram by Carlos Eduardo Ravello Joo (ORCID 0009-0007-5631-7436) for BikeLab Studio, 2026. Licensed CC BY 4.0.</desc>
