  <title id="ten-t">Janela de tensao de raios admissivel segundo a DT Swiss, por tipo de freio e de uso</title>
  <desc id="ten-d">Grafico de barras com as seis faixas de tensao admissivel do lado mais tensionado da roda, em newtons: disco dianteira 950 a 1200, disco traseira 1050 a 1300, freio de aro dianteira 900 a 1100, freio de aro traseira 1050 a 1300, hibrida dianteira 1050 a 1300 e hibrida traseira 1150 a 1400. A faixa solida interna marca a media recomendada pelo fabricante. Fonte: DT Swiss, manual tecnico Spline WXD10000000861S versao 2024.06, tabela 6.1. Diagrama de Carlos Eduardo Ravello Joo (ORCID 0009-0007-5631-7436) para a BikeLab Studio, 2026. Licenca CC BY 4.0.</desc>
