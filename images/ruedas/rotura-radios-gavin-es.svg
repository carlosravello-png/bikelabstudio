  <title id="gav-t">Localizacion de la rotura por fatiga en 76 radios ensayados por Gavin (1996)</title>
  <desc id="gav-d">De 76 radios de acero inoxidable llevados a rotura por fatiga, 68 rompieron en el codo trabajado en frio y 8 en la rosca. Ninguno rompio por la zona central. El grafico inferior situa ademas el rango de tension del ensayo, que empieza en 174 megapascales, frente al rango que se mide rodando en carretera, de 20 a 150 megapascales: la curva de fatiga publicada esta extrapolada en todo el tramo de uso real. Fuente: Gavin, H. P. (1996), Bicycle-Wheel Spoke Patterns and Spoke Fatigue, Journal of Engineering Mechanics ASCE 122(8), 736-742, DOI 10.1061/(ASCE)0733-9399(1996)122:8(736). Diagrama de Carlos Eduardo Ravello Joo (ORCID 0009-0007-5631-7436) para BikeLab Studio, 2026. Licencia CC BY 4.0.</desc>
