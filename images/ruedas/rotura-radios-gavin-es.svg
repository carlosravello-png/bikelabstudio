  <rect width="800" height="520" fill="#050505"/>
  <text x="40" y="52" fill="#e0e0e0" font-size="19">Donde rompen los radios</text>
  <text x="40" y="74" fill="#8a8a8a" font-size="12">Gavin 1996 · 76 radios de acero inoxidable ensayados a fatiga hasta la rotura</text>
  <rect x="60.0" y="108" width="608.4" height="46" fill="#ff6b35" fill-opacity="0.85"/>
  <rect x="668.4" y="108" width="71.6" height="46" fill="#4fb8c8" fill-opacity="0.85"/>
  <text x="364" y="137" fill="#050505" font-size="16" text-anchor="middle" font-weight="bold">68 en el codo</text>
  <text x="704" y="172" fill="#4fb8c8" font-size="12" text-anchor="middle">8 en la rosca</text>
  <text x="60.0" y="194" fill="#8a8a8a" font-size="12">El codo es la curva de 90 grados doblada en frio para entrar en el buje. Ninguno rompio por el centro.</text>
  <text x="40" y="216" fill="#e0e0e0" font-size="15">El limite que declara el propio autor</text>
  <line x1="130.0" y1="240" x2="130.0" y2="358" stroke="#222222" stroke-width="1"/>
  <text x="130.0" y="378" fill="#8a8a8a" font-size="11" text-anchor="middle">0</text>
  <line x1="206.2" y1="240" x2="206.2" y2="358" stroke="#222222" stroke-width="1"/>
  <text x="206.2" y="378" fill="#8a8a8a" font-size="11" text-anchor="middle">50</text>
  <line x1="282.5" y1="240" x2="282.5" y2="358" stroke="#222222" stroke-width="1"/>
  <text x="282.5" y="378" fill="#8a8a8a" font-size="11" text-anchor="middle">100</text>
  <line x1="358.8" y1="240" x2="358.8" y2="358" stroke="#222222" stroke-width="1"/>
  <text x="358.8" y="378" fill="#8a8a8a" font-size="11" text-anchor="middle">150</text>
  <line x1="435.0" y1="240" x2="435.0" y2="358" stroke="#222222" stroke-width="1"/>
  <text x="435.0" y="378" fill="#8a8a8a" font-size="11" text-anchor="middle">200</text>
  <line x1="511.2" y1="240" x2="511.2" y2="358" stroke="#222222" stroke-width="1"/>
  <text x="511.2" y="378" fill="#8a8a8a" font-size="11" text-anchor="middle">250</text>
  <line x1="587.5" y1="240" x2="587.5" y2="358" stroke="#222222" stroke-width="1"/>
  <text x="587.5" y="378" fill="#8a8a8a" font-size="11" text-anchor="middle">300</text>
  <line x1="663.8" y1="240" x2="663.8" y2="358" stroke="#222222" stroke-width="1"/>
  <text x="663.8" y="378" fill="#8a8a8a" font-size="11" text-anchor="middle">350</text>
  <line x1="740.0" y1="240" x2="740.0" y2="358" stroke="#222222" stroke-width="1"/>
  <text x="740.0" y="378" fill="#8a8a8a" font-size="11" text-anchor="middle">400</text>
  <text x="435" y="398" fill="#8a8a8a" font-size="12" text-anchor="middle">amplitud del ciclo de tension [MPa]</text>
  <rect x="160.5" y="254" width="198.2" height="34" fill="#4fb8c8" fill-opacity="0.22" stroke="#4fb8c8" stroke-width="1"/>
  <text x="40" y="276" fill="#4fb8c8" font-size="12">en carretera</text>
  <text x="260" y="276" fill="#4fb8c8" font-size="12" text-anchor="middle">20 a 150</text>
  <rect x="395.4" y="302" width="344.6" height="34" fill="#e8ff00" fill-opacity="0.22" stroke="#e8ff00" stroke-width="1"/>
  <text x="40" y="324" fill="#e8ff00" font-size="12">ensayado</text>
  <text x="403" y="324" fill="#e8ff00" font-size="12">desde 174</text>
  <rect x="130.0" y="302" width="265.4" height="34" fill="none" stroke="#ff6b35" stroke-width="1" stroke-dasharray="5 4"/>
  <text x="263" y="324" fill="#ff6b35" font-size="12" text-anchor="middle">extrapolado</text>
  <text x="40" y="426" fill="#e0e0e0" font-size="12">La curva S-N publicada (log S = -0,30 log N + b) esta extrapolada justo en el tramo donde rueda una bicicleta.</text>
  <text x="40" y="444" fill="#8a8a8a" font-size="11">Lo dice Gavin en el mismo parrafo, sin que nadie se lo pregunte.</text>
  <text x="40" y="500" fill="#8a8a8a" font-size="11">Fuente: Gavin (1996) · DOI 10.1061/(ASCE)0733-9399(1996)122:8(736)</text>
  <text x="760" y="500" fill="#8a8a8a" font-size="11" text-anchor="end">bikelabstudio.com · CC BY 4.0</text>
