  <text x="416" y="206.0" fill="#8a8a8a" font-size="11" text-anchor="middle">empieza a mandar el negativo</text>
  <text x="619" y="206.0" fill="#ff6b35" font-size="11" text-anchor="middle">pandeo</text>
  <text x="700" y="422.0" fill="#ff6b35" font-size="11" text-anchor="end">tension critica</text>
  <text x="40" y="452" fill="#e0e0e0" font-size="12">Los modos se combinan en serie, 1/K = &#931; 1/K&#8345;, asi que el primero que se anula arrastra a toda la rueda.</text>
  <text x="40" y="470" fill="#ff6b35" font-size="11">Curva esquematica. Exactos: los signos y que el termino que resta crece con n&#178;.</text>
  <text x="40" y="484" fill="#8a8a8a" font-size="11">La escala depende de EI&#8322; y G&#771;J del aro, que ningun fabricante publica.</text>
