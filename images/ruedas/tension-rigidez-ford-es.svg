  <title id="frd-t">Por que subir la tension de radios reduce la rigidez lateral de la rueda</title>
  <desc id="frd-d">Anatomia de la ecuacion 2.71c de Ford (2018). La rigidez de cada modo lateral de la rueda suma dos contribuciones positivas, la de los radios y la del aro por flexion y torsion, y resta una tercera, menos pi por ene al cuadrado por la tension media. A tension baja las dos se compensan casi exactamente, y por eso medir en ese rango no detecta ningun cambio. A tension suficientemente alta domina el termino negativo y la rigidez lateral cae. Existe una tension critica a la que la rigidez lateral se anula y la rueda pandea fuera de su plano. Curva esquematica: la escala depende de la rigidez a flexion y a torsion del aro, que los fabricantes no publican. Fuente: Ford, M. P. (2018), tesis doctoral, Northwestern University, ecuaciones 2.70 y 2.71. Diagrama de Carlos Eduardo Ravello Joo (ORCID 0009-0007-5631-7436) para BikeLab Studio, 2026. Licencia CC BY 4.0.</desc>
