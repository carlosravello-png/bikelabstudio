  <title id="gav-t">Localizacao da ruptura por fadiga em 76 raios ensaiados por Gavin (1996)</title>
  <desc id="gav-d">De 76 raios de aco inoxidavel levados a ruptura por fadiga, 68 quebraram no cotovelo trabalhado a frio e 8 na rosca. Nenhum quebrou na parte central. O grafico inferior situa a faixa de tensao do ensaio, que comeca em 174 megapascals, diante da faixa medida rodando na estrada, de 20 a 150 megapascals: a curva de fadiga publicada esta extrapolada em todo o trecho de uso real, como o proprio autor declara. Fonte: Gavin 1996, ASCE. Diagrama de Carlos Eduardo Ravello Joo (ORCID 0009-0007-5631-7436) para a BikeLab Studio, 2026. Licenca CC BY 4.0.</desc>
