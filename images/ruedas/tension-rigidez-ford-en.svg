  <text x="416" y="206.0" fill="#8a8a8a" font-size="11" text-anchor="middle">the negative term takes over</text>
  <text x="619" y="206.0" fill="#ff6b35" font-size="11" text-anchor="middle">buckling</text>
  <text x="700" y="422.0" fill="#ff6b35" font-size="11" text-anchor="end">critical tension</text>
  <text x="40" y="452" fill="#e0e0e0" font-size="12">The modes combine in series, 1/K = Σ 1/Kₙ, so the first one to vanish takes the whole wheel with it.</text>
  <text x="40" y="470" fill="#ff6b35" font-size="11">Schematic curve. Exact: the signs, and that the subtracted term grows with n².</text>
