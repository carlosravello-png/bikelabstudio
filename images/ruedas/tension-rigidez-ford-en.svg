  <title id="frd-t">Why raising spoke tension reduces the lateral stiffness of the wheel</title>
  <desc id="frd-d">Anatomy of equation 2.71c in Ford (2018). The stiffness of each lateral mode of the wheel adds two positive contributions, from the spokes and from the rim in bending and torsion, and subtracts a third, minus pi times n squared times the mean tension. At low tension the two nearly cancel, which is why measuring in that range detects no change. At high enough tension the negative term dominates and lateral stiffness falls. There is a critical tension at which lateral stiffness vanishes and the wheel buckles out of plane. Schematic curve: the scale depends on the bending and torsional stiffness of the rim, which manufacturers do not publish. Source: Ford 2018. Diagram by Carlos Eduardo Ravello Joo (ORCID 0009-0007-5631-7436) for BikeLab Studio, 2026. Licensed CC BY 4.0.</desc>
