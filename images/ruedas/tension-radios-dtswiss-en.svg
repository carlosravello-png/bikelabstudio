  <title id="ten-t">Allowable spoke tension window per DT Swiss, by brake type and use</title>
  <desc id="ten-d">Bar chart of the six allowable tension ranges for the tightest side of the wheel, in newtons: disc front 950 to 1200, disc rear 1050 to 1300, rim brake front 900 to 1100, rim brake rear 1050 to 1300, hybrid front 1050 to 1300 and hybrid rear 1150 to 1400. The solid inner band is the average recommended by the manufacturer. Source: DT Swiss, Spline technical manual WXD10000000861S version 2024.06, table 6.1. Diagram by Carlos Eduardo Ravello Joo (ORCID 0009-0007-5631-7436) for BikeLab Studio, 2026. Licensed CC BY 4.0.</desc>
